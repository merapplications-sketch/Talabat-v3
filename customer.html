    const r=await TLB.placeOrder({store:S.cartStore,lines,tip:S.tip,payment:S.pay,promo:S.promo&&S.promo.code,address:addrText(ad),lat:ad.lat,lng:ad.lng,fee:calc().fw>0?0:q.fee,wallet:calc().w>0?calc().w:null,points:calc().pts||null,extra:optExtra(),key:S.okey});
    if(r.error){if(r.error=='wallet_changed')TLB.loadWallet(true);if(r.error=='points_changed'||r.error=='points_min')TLB.reload&&TLB.reload().then(render);if(r.error=='unavailable'||r.error=='bad_options'){TLB.reload&&TLB.reload().then(render);go('cart')}if(r.error=='fee_changed'||r.error=='too_far'){S.quote=null;S.quoteErr=null;quoteNow()}if(/^promo_|too_many$/.test(r.error)){S.promo=null;S.perr=r.error;go('cart')}if(r.error=='bad_time')S.at=null;if(r.error=='bad_group'){grpEnd();go('home')}alert(errMsg(r));return}

  :`<div class="fbar"><input class="fld" type="text" id="tkm" maxlength="500" placeholder="${t('supReplyPh')}" style="flex:1" onkeydown="if(event.key=='Enter')tkSend()"><button class="btn" style="flex:0 0 auto;width:auto;padding:0 20px" onclick="tkSend()">${t('supSend')}</button></div>`}</div>`}
/* ---------- FAVORITES / OFFERS / PROFILE ---------- */
function vFav(){const l=STORES.filter(isFavS);return topbar(t('fav'),'',"go('home')")+`<div class="pg">${l.length?l.map(s=>storeRow(s)).join(''):emptyV(t('favEmptyT'),t('favEmptyS'),'','heart')}</div>`}
function vPromo(){const o=STORES.filter(s=>s.disc>0).sort((a,b)=>b.disc-a.disc),f=STORES.filter(s=>s.ft=='free'||s.ffd),card=s=>`<div class="ofc" onclick="go('offer',{oid:'${s.id}'})"><div class="th">${pic(s.lg||s.i)}</div><div class="tx"><b>${esc(s.n)}</b><div style="margin-top:6px">${s.disc>0?`<span class="dis">−${s.disc}%</span> `:''}${s.ft=='free'||s.ffd?`<span class="pill">${t('n6Free')}</span>`:''}</div></div>${ico('chev',18)}</div>`;
  return topbar(t('promoTab'),t('promoTabS'),"go('home')")+`<div class="pg">${o.length||f.length?`${o.length?`<h3 style="margin:0 4px 12px">${t('bestOffers')}</h3>${o.map(card).join('')}`:''}${f.length?`<h3 style="margin:18px 4px 12px">${t('freeS')}</h3>${f.map(card).join('')}`:''}`:emptyV(t('noPromoT'),t('promoTabS'),'','tag')}</div>`}
function vOffer(){const s=STORES.find(x=>x.id==S.oid);if(!s){S.v='promo';return vPromo()}
  const rows=[s.disc>0?[t('n6Disc'),`−${s.disc}%`]:null,s.ft=='free'?[t('n6Fee'),t('n6Free')]:null,s.ffd?[t('n6FreeF'),'✓']:null,(s.ft!='free'&&s.fee>=0)?[t('n6Fee'),`${s.fee} TJS`]:null,s.rt?[t('n6Rt'),`★ ${(+s.rt).toFixed(1)}${s.rc?` (${s.rc})`:''}`]:null].filter(Boolean);
  return topbar(esc(s.n),'',"go('promo')")+`<div class="pg"><div class="odh">${s.i?`<img src="${esc(s.i)}" alt="">`:''}</div>
  <div class="card"><h3>${t('n6Cond')}</h3>${rows.map(([a,b])=>`<div class="dr"><span>${a}</span><b>${b}</b></div>`).join('')}${s.d?`<div class="xs mut" style="margin-top:8px;line-height:1.45">${esc(s.d)}</div>`:''}</div>
  <div class="card"><h3 style="margin-bottom:4px">${t('n6Cont')}</h3><div class="ctr"><span class="i3">${ico('pin',16)}</span><div class="ctx"><div class="xs mut">${t('n6Addr')}</div><div class="b6">${s.ad?esc(s.ad):'—'}</div></div>${mapH(s)?`<a class="cbt" href="${mapH(s)}" target="_blank" rel="noopener" aria-label="${t('n7Map')}" title="${t('n7Map')}">${ico('nav',18)}</a>`:''}</div><div class="ctr"><span class="i3">${ico('phone',16)}</span><div class="ctx"><div class="xs mut">${t('n6Phone')}</div><div class="b6">${s.ph?esc(s.ph):`<span class="mut">${t('n6NoPh')}</span>`}</div></div>${s.ph?`<a class="cbt call" href="${telH(s.ph)}" aria-label="${t('n6Phone')}" title="${t('n6Phone')}">${ico('phone',18)}</a>`:''}</div></div>
  <button class="btn big" onclick="openStore(${STORES.indexOf(s)})">${t('n6Menu')}</button></div>`}
function vMe(){const dl=TLB.orders().filter(o=>o.status=='delivered'),r2=n=>Math.round(n*100)/100,d=r2(dl.reduce((a,o)=>a+(+o.discount||0),0)),p=r2(dl.reduce((a,o)=>a+(+o.promoDiscount||0),0)),row=(ic,tx,go,vl)=>`<div class="r2" onclick="${go}"><span class="i3">${ico(ic,16)}</span><span>${tx}</span><span class="vl">${vl||''}${ico('chev',14)}</span></div>`;
  return `<div class="pg"><div class="pf2"><div class="av2">${esc(String(ME.name||'?').charAt(0).toUpperCase())}</div><div style="min-width:0"><b style="font-size:15px;color:#fff;display:block">${esc(ME.name)}</b><div style="opacity:.95;font-size:12px">${esc(ME.phone||'')}</div></div><span class="gr" onclick="go('settings')" role="button" aria-label="${t('n6Set')}">${ico('gear',16)}</span></div>
  ${d+p>0?`<div class="sv2"><div><div class="xs mut">${t('n6Saved')}</div><b>${r2(d+p)} TJS</b></div><div class="xs mut" style="text-align:right">${t('n6SvD')} ${d}<br>${t('n6SvP')} ${p}</div></div>`:''}
  <div class="gp">${row('card',t('walT'),"go('wallet')",`${TLB.wallet().balance} TJS`)}${row('receipt',t('histL'),"go('orders')")}${row('pin',t('addrT'),"openAddr('me')")}${row('heart',t('fav'),"go('fav')")}${row('chat',t('supT'),"go('support')",TLB.ticketUnread()?`<span class="bdg" style="position:static">${TLB.ticketUnread()}</span>`:'')}</div>
  <div class="gp">${row('star',t('n7About'),"go('about')")}${row('check',t('n7Priv'),"go('privacy')")}</div>
  <p class="xs mut" style="text-align:center;margin-top:6px">${t('verL')} ${esc(TLB.version||'')} · ${PGV}</p></div>`}
function vPage(slug){TLB.loadPages();const pg=TLB.pages()[slug],txt=pg?(TLB.lang()=='ru'?pg.ru:pg.en)||pg.ru||pg.en:null,sp=TLB.supportInfo();
  return topbar(t(slug=='about'?'n7About':'n7Priv'),'',"go('me')")+`<div class="pg"><div class="card">${pg===undefined?`<div class="xs mut">${t('n7Load')}</div>`:txt?`<div class="tx2">${esc(txt)}</div>`:`<div class="xs mut">${t('n7NoText')}</div>`}</div>
  ${slug=='about'?`<div class="card"><div class="dr"><span>${t('verL')}</span><b>${esc(TLB.version||'')} · ${PGV}</b></div>${sp.phone?`<div class="dr"><span>${t('supCall')}</span><a href="${telH(sp.phone)}">${esc(sp.phone)}</a></div>`:''}${sp.hours?`<div class="dr"><span>${t('supHours')}</span><b>${esc(sp.hours)}</b></div>`:''}</div><button class="btn s big" onclick="go('support')">${t('n7Contact')}</button>`:''}</div>`}
const vAbout=()=>vPage('about'),vPrivacy=()=>vPage('privacy');
function vSettings(){return topbar(t('n6Set'),'',"go('me')")+`<div class="pg"><div class="card"><h3>${t('n6Acc')}</h3><div class="dr"><span>${esc(ME.name)}</span></div><h3 style="margin-top:12px">${t('phoneL')}</h3><div class="pm"><input class="fld" type="tel" id="ph" value="${esc(ME.phone)}" placeholder="+992…" maxlength="16"><button class="btn" onclick="savePhone()">${t('phoneSave')}</button></div><div class="xs mut" style="margin-top:8px;line-height:1.45">${t('phoneRule')}</div></div>

  <button class="btn s big" onclick="TLB.logout()">${ico('out',20)} ${t('logout')}</button><p class="xs mut" style="text-align:center;margin-top:16px">${t('note')} · ${t('verL')} ${esc(TLB.version||'')} · ${PGV}</p></div>`}
/* ---------- RENDER ---------- */
function render(){
  if(!ME.phone){$('app').innerHTML=phoneGateV();return}
  if(TLB.me().banned&&!['support','ticket'].includes(S.v)){S.v='support';TLB.wantSupport(true)}
  if(S.v=='menu'&&!TLB.isOpen(S.store)){S.v='home';TLB.toast&&TLB.toast(t('closedMsg'),true)}
  if(S.v=='track'&&TLB.unread(S.tid))setTimeout(()=>TLB.markRead(S.tid),0);
  const V={home:vHome,cat:vCat,menu:vMenu,cart:vCart,pay:vPay,group:vGroup,addr:vAddr,addrForm:vAddrForm,orders:vOrders,track:vTrack,fav:vFav,promo:vPromo,me:vMe,settings:vSettings,about:vAbout,privacy:vPrivacy,offer:vOffer,wallet:vWallet,support:vSupport,ticket:vTicket}[S.v]();
  const full=['cart','pay','group','addr','addrForm','ticket'].includes(S.v),nav=['home','orders','wallet','promo','me'],ni={home:'home',orders:'receipt',wallet:'card',promo:'tag',me:'user'},un=TLB.totalUnread();
  const n=cartCount(),cc=n?calc():null,bar=n&&['home','menu','cat','fav','promo'].includes(S.v)?`<div class="bar" onclick="goCart()" role="button"><span class="n">${n}</span><span class="l">${t('cartBarL')}</span><span class="p">${Math.round((cc.sub-cc.d-cc.h)*100)/100} TJS</span></div>`:'';
  const on=k=>S.v==k||(k=='home'&&['cat','menu'].includes(S.v))||(k=='orders'&&S.v=='track')||(k=='me'&&['support','settings','about','privacy'].includes(S.v))||(k=='promo'&&S.v=='offer');
  const navH=full?'':`<div class="nav">${nav.map(k=>`<div class="${on(k)?'on':''}" onclick="${k=='home'?"S.q='';":''}go('${k}')">${ico(ni[k],24)}${t(k=='promo'?'promoTab':k)}${k=='orders'&&un?`<span class="bdg">${un}</span>`:''}</div>`).join('')}</div>`;
  const a=document.activeElement,kid=a&&['ci','sq','cq','ph','pc','mq','nt','rc','afs','afh','afe','aff','afa','afn','rpm','tkm','tmpn','gfn','gfp'].includes(a.id)?a.id:null,keep=kid?a.value:null;
  const _o=document.querySelector('.osh'),_ost=_o?_o.scrollTop:0,_osw=!!_o;
  $('app').innerHTML=V+bar+navH+addrSheet()+roSheet()+repSheet();
  const _n=document.querySelector('.osh');if(_n&&_osw&&S.sh&&S.sh.keep)_n.scrollTop=_ost;document.documentElement.classList.toggle('shopen',!!S.sh);
  if(kid&&$(kid)){const e=$(kid);e.value=keep;e.focus();e.setSelectionRange(keep.length,keep.length)}
  const ch=$('ch');if(ch)ch.scrollTop=ch.scrollHeight;rotRestore();menuAfter();
  cartSave();if(['home','wallet','track'].includes(S.v))milestone();
  if(document.body&&document.body.style)document.body.style.paddingBottom=full?'0px':bar?'calc(150px + env(safe-area-inset-bottom,0px))':'calc(84px + env(safe-area-inset-bottom,0px))'}
/* a happy hour starts or ends with no data event: refresh prices once a minute while any is scheduled */
if(!window.__hhTick)window.__hhTick=setInterval(()=>{if(ME.phone&&TLB.happyHours&&TLB.happyHours().length&&!S.busy){syncStores();render()}},60000);
TLB.start('customer',me=>{ME={name:me.name,phone:me.phone};TLB.chrome(false);prefLoad();TLB.wantSupport();syncStores();cartLoad();TLB.on(()=>{syncStores();cartLoad();render();openDeep();grpDeep()});render();openDeep();grpDeep()});
</script></body></html>
