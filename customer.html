  <button class="ib" style="left:14px" onclick="go('${S.back||'home'}')" aria-label="${t('back')}">${ico('back')}</button>
  <div style="position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px"><button class="ib" style="position:static" aria-label="${t('searchMenu')}" onclick="S.msearch=!S.msearch;if(!S.msearch)S.msq='';render()">${ico('search',19)}</button><button class="ib" style="position:static" onclick="shareStore()" aria-label="${t('shareB')}">${ico('share',19)}</button><button class="ib" style="position:static;color:${fav?'#ff5a00':'#171717'}" aria-label="${t('favs')}" onclick="TLB.toggleFav('${st.id}')">${ico('heart',19,fav)}</button></div></div>
  <div class="mi"><div class="row" style="justify-content:flex-start;gap:14px;align-items:center"><div class="lg">${st.logo_url?`<img src="${esc(st.logo_url)}" alt="">`:esc(String(S.store||'?').charAt(0).toUpperCase())}</div><div style="min-width:0"><h1>${esc(S.store)}</h1><div class="xs mut" style="margin-top:3px">${sd.rt>0?`<span class="rt">${ico('star',13,1)}${sd.rt.toFixed(1)}${sd.rc?` <i>(${cnt(sd.rc)})</i>`:''}</span> · ${t('ratingSrc')} · `:''}${st.category?t(st.category):''}</div></div></div>
  ${st.description?`<div class="sm mut" style="margin-top:10px">${esc(st.description)}</div>`:''}
  <div>${open?'':`<span class="chp r">${t('closed')}</span>`}<span class="chp">${ico('bike',14)} ${delTxt(sd)}</span>${sd.disc>0?`<span class="chp o">−${sd.disc}%</span>`:''}</div></div>
  ${offers.length?`<div class="ofs">${offers.map(o=>`<div class="of"><b>${esc(o[0])}</b><span>${esc(o[1])}</span></div>`).join('')}</div>`:''}
  ${S.msearch?`<div style="padding:12px 16px 0"><label class="sb" style="margin:0;background:#fff;border:1px solid var(--line)">${ico('search',18)}<input type="text" id="mq" placeholder="${t('searchMenu')}" value="${esc(S.msq)}" oninput="S.msq=this.value;render()"></label></div>`:''}
  ${q||!M.length?'':`<div class="mt"><button class="hb" onclick="S.sheet=true;render()" aria-label="${t('sections')}">${ico('menu',22)}</button><div class="tabs" onscroll="S.tabx=this.scrollLeft">${tabs}</div></div>`}
  ${body}
  ${S.sheet?`<div class="sheet" onclick="S.sheet=false;render()"><div onclick="event.stopPropagation()"><h2 style="margin:16px 0 4px">${t('sections')}</h2>${secs.map(s=>`<div class="s2" onclick="jumpSec('${s.id}')">${esc(s.title)}</div>`).join('')}</div></div>`:''}`}
if(!window.__menuScroll){window.__menuScroll=1;window.addEventListener('scroll',()=>{if(S.v!='menu')return;const ss=[...document.querySelectorAll('.msec[id]')];if(!ss.length)return;let cur=ss[0].id;ss.forEach(s=>{if(s.getBoundingClientRect().top<=96)cur=s.id});document.querySelectorAll('.mt .tb').forEach(x=>x.classList.toggle('on',x.dataset.s==cur))},{passive:true})}
function menuAfter(){const tb=document.querySelector('.mt .tabs');if(tb)tb.scrollLeft=S.tabx;const f=document.querySelector('.mt .tb');if(f&&!document.querySelector('.mt .tb.on'))f.classList.add('on')}
/* ---------- CART (step 1) ---------- */
function stepper(id,q){return `<div class="pls on"><button aria-label="${q==1?t('removeI'):'−'}" onclick="${q==1?`delLine('${id}')`:`add('${id}',-1)`}">${ico(q==1?'trash':'minus',16)}</button><span>${q}</span><button aria-label="+" onclick="add('${id}',1)">${ico('plus',16)}</button></div>`}
function vCart(){const m=menuOf(S.cartStore),c=calc(),ids=Object.keys(S.cart),mm=TLB.allMenus(true)[S.cartStore]||[],sd=sdOf(S.cartStore);
  if(!ids.length)return topbar(t('cartT'),esc(S.cartStore),"go('home')")+emptyV(t('emptyCartT'),t('emptyCartS'));
  const like=mm.filter(x=>!S.cart[x.id]).slice(0,10),saved=Math.round((c.d+c.p)*100)/100;
  return topbar(t('cartT'),esc(S.cartStore),"goMore()")+
  `${ids.map(id=>{const i=m.find(x=>x.id==id)||{name:'?',price:0,image:'',discount:0},q=S.cart[id],e=eff(i,sd);return `<div class="ci"><div class="im">${i.image?`<img src="${esc(i.image)}" alt="">`:''}${e?`<span class="off">−${e}%</span>`:''}${stepper(id,q)}</div><div class="tx"><div class="nm">${esc(i.name)}</div>${pxH(i,sd,q)}</div></div>`}).join('')}
  ${like.length?`<div class="band"><div class="sh">${t('youLike')}</div><div class="hs">${like.map(i=>`<div class="lk"><div class="im">${i.image?`<img src="${esc(i.image)}" alt="" style="width:100%;height:100%;object-fit:cover">`:''}<button class="add" aria-label="${t('addMore')}" onclick="add('${i.id}',1)">${ico('plus',18)}</button></div><div class="tt">${esc(i.name)}<div style="margin-top:2px">${pxH(i,sd)}</div></div></div>`).join('')}</div></div>`:''}
  ${saved>0?`<div class="sv">${t('saving')} ${saved} TJS</div>`:''}<div style="height:90px"></div>
  <div class="fbar"><button class="btn s" onclick="goMore()">${t('addMore')}</button><button class="btn" onclick="go('checkout')">${t('continueB')}</button></div>`}
/* ---------- CHECKOUT (step 2) ---------- */
function vCheckout(){const c=calc(),ids=Object.keys(S.cart);
  if(!ids.length)return vCart();
  const promoBox=c.base<=0?`<div class="sm mut" style="margin-top:8px">${t('promoNoOffer')}</div>`:S.promo?`<div class="po"><span>${esc(S.promo.code)} · −${c.p} TJS</span><button class="btn t" onclick="removePromo()">${t('promoRm')}</button></div>`
    :`<div class="pm"><input class="fld" type="text" id="pc" maxlength="20" autocapitalize="characters" autocomplete="off" placeholder="${t('promoPh')}"><button class="btn" onclick="applyPromo()">${t('promoApply')}</button></div>${S.perr?`<div class="pe">${t('err_'+S.perr)}</div>`:''}<div class="xs mut" style="margin-top:8px">${t('promoOffNote')}</div>`;
  return topbar(t('checkoutT'),esc(S.cartStore),"go('cart')")+`<div class="pg">
  <div class="card"><div class="xs mut">${t('addrL')}</div><div class="b6" style="margin-top:4px;display:flex;gap:8px;align-items:center">${ico('pin',18)}Проспект Рудаки, д. 12, кв. 4</div></div>
  <div class="card"><h2>${t('payM')}</h2><div style="margin-top:4px">${['apple','card','cash'].map(p=>`<div class="opt" onclick="S.pay='${p}';render()"><span>${t(p)}</span><span class="rad ${S.pay==p?'on':''}"></span></div>`).join('')}</div></div>
  <div class="card"><h2>${t('tip')}</h2><div class="tipr">${[0,3,5,10].map(v=>`<div class="tip ${S.tip==v?'on':''}" onclick="S.tip=${v};render()">${v?v+' TJS':t('none')}</div>`).join('')}</div></div>
  <div class="card"><h2>${t('promoT')}</h2>${promoBox}</div>
  <div class="card sum"><h2 style="margin-bottom:6px">${t('summary')}</h2><div class="row"><span>${t('sub')}</span><span>${c.sub} TJS</span></div>${c.d>0?`<div class="row" style="color:var(--ok)"><span>${t('discS')}</span><span>−${c.d} TJS</span></div>`:''}${c.p>0?`<div class="row" style="color:var(--ok)"><span>${t('promoLine')} ${esc(S.promo.code)}</span><span>−${c.p} TJS</span></div>`:''}<div class="row"><span>${t('deliv')}${c.ff?` <span class="xs" style="color:var(--ok)">(${t('freeFirstL')})</span>`:''}</span><span>${c.fee} TJS</span></div><div class="row tot"><span>${t('total')}</span><span>${c.total} TJS</span></div></div></div>
  <div style="height:90px"></div><div class="fbar"><button class="btn big" ${S.busy?'disabled':''} onclick="place()">${t('place')} · ${c.total} TJS</button></div>`}
/* ---------- ORDERS / TRACKING / PROFILE ---------- */
function vOrders(){const l=TLB.orders();
  return `<div class="pg" style="padding-bottom:4px"><h1>${t('orders')}</h1></div><div class="pg">${l.length?l.map(o=>`<div class="card"><div onclick="go('track',{tid:${o.id}})"><div class="row"><b>${esc(o.store)}</b><span class="pill ${o.status}">${t(o.status)}${TLB.unread(o.id)?` · ${TLB.unread(o.id)}`:''}</span></div><div class="row sm mut" style="margin-top:6px"><span>${t('orderN')} #${o.id} · ${fmtD(o.createdAt)}</span><b style="color:var(--ink)">${o.total} TJS</b></div></div>
  <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px"><button class="btn t" onclick="reorder(${o.id})">${t('reorder')}</button></div></div>`).join(''):emptyV(t('noOrdersT'),t('noOrdersS'))}</div>`}
function vTrack(){const o=TLB.order(S.tid);if(!o)return vOrders();
  const n={pending:0,preparing:1,ready:1,pickedup:2,delivered:3}[o.status],dead=o.status=='rejected'||o.status=='cancelled',live=['preparing','ready','pickedup'].includes(o.status);
  return topbar(`${t('orderN')} #${o.id}`,esc(o.store),"go('orders')")+`<div class="pg">
  <div class="card"><div class="row"><span class="pill ${o.status}">${t(o.status)}</span><b>${o.total} TJS</b></div><div class="sm mut" style="margin-top:8px">${esc(t(o.payment))}</div>
  ${o.status=='pending'?`<button class="btn s big" style="margin-top:12px" onclick="cancelO()">${t('cancelO')}</button>`:''}</div>
  ${dead?'':`<div class="card">${['pending','preparing','pickedup','delivered'].map((k,i)=>`<div class="stp ${i<=n?'on':''}"><i>${i<=n?ico('check',14):''}</i><b>${t('s_'+k)}</b></div>`).join('')}</div>`}
  ${o.driver&&!dead?`<div class="card"><b>${t('courier')}: ${esc(o.driverName)}</b><div class="chat" id="ch">${o.chat.map(m=>`<div class="m ${m.s=='client'?'me':''}">${TLB.fmtMsg(m.t)}</div>`).join('')}</div>
  ${live?`<div class="row" style="gap:8px"><input class="fld" type="text" id="ci" maxlength="200" placeholder="${t('chatH')}"><button class="btn g sm" onclick="sendLoc()">${ico('pin',16)}</button><button class="btn sm" onclick="sendChat()">${t('send')}</button></div>`:`<div class="xs mut" style="text-align:center">${t('chatClosed')}</div>`}</div>`:''}
  <button class="btn s big" onclick="reorder(${o.id})">${t('reorder')}</button></div>`}
function vMe(){return `<div class="pg"><div class="card" style="text-align:center;padding:24px 14px"><div class="av">${esc(String(ME.name||'?').charAt(0).toUpperCase())}</div><b style="font-size:18px">${esc(ME.name)}</b></div>
  <div class="card"><h2>${t('phoneL')}</h2><div class="pm"><input class="fld" type="tel" id="ph" value="${esc(ME.phone)}" placeholder="+992…" maxlength="16"><button class="btn" onclick="savePhone()">${t('phoneSave')}</button></div></div>
  <div class="card row"><h2>${t('langL')}</h2><div class="seg"><button class="${TLB.lang()=='ru'?'on':''}" onclick="TLB.setLang('ru')">RU</button><button class="${TLB.lang()=='en'?'on':''}" onclick="TLB.setLang('en')">EN</button></div></div>
  <button class="btn s big" onclick="TLB.logout()">${t('logout')}</button><p class="xs mut" style="text-align:center;margin-top:16px">${t('note')}</p></div>`}
/* ---------- RENDER ---------- */
function render(){
  if(S.v=='track'&&TLB.unread(S.tid))setTimeout(()=>TLB.markRead(S.tid),0);
  const V={home:vHome,cat:vCat,menu:vMenu,cart:vCart,checkout:vCheckout,orders:vOrders,track:vTrack,me:vMe}[S.v]();
  const full=S.v=='cart'||S.v=='checkout',nav=['home','orders','me'],ni={home:'home',orders:'receipt',me:'user'},un=TLB.totalUnread();
  const n=cartCount(),bar=n&&['home','menu','cat'].includes(S.v)?`<div class="bar" onclick="go('cart')" role="button"><span class="n">${n}</span><span class="l">${t('cartBarL')}</span><span class="p">${calc().total} TJS</span></div>`:'';
  const navH=full?'':`<div class="nav">${nav.map(k=>`<div class="${S.v==k||(k=='home'&&['cat','menu'].includes(S.v))||(k=='orders'&&S.v=='track')?'on':''}" onclick="${k=='home'?"S.q='';":''}go('${k}')">${ico(ni[k],24)}${t(k)}${k=='orders'&&un?`<span class="bdg">${un}</span>`:''}</div>`).join('')}</div>`;
  const a=document.activeElement,kid=a&&['ci','sq','cq','ph','pc','mq'].includes(a.id)?a.id:null,keep=kid?a.value:null;
  $('app').innerHTML=V+bar+navH;
  if(kid&&$(kid)){const e=$(kid);e.value=keep;e.focus();e.setSelectionRange(keep.length,keep.length)}
  const ch=$('ch');if(ch)ch.scrollTop=ch.scrollHeight;rotRestore();menuAfter();
  if(document.body&&document.body.style)document.body.style.paddingBottom=full?'0px':bar?'calc(142px + env(safe-area-inset-bottom,0px))':'calc(78px + env(safe-area-inset-bottom,0px))'}
TLB.start('customer',me=>{ME={name:me.name,phone:me.phone};TLB.chrome(false);syncStores();TLB.on(()=>{syncStores();render()});render()});
</script></body></html>
