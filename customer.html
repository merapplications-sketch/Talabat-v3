.d6c .d6-undo{flex:none;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--o);background:#fff;color:#D94700;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}

.d6c .grpe{display:flex;align-items:center;gap:12px;width:100%;background:#FFF1E9;border:1px solid #FFD4BE;border-radius:16px;padding:16px;box-shadow:none;margin:12px 0;font-family:inherit;color:var(--ink);min-height:74px}

.d6c .d6-cmt label{display:block;font-size:13px;line-height:19px;font-weight:600;margin-bottom:8px}
.d6c .d6-cmt textarea{width:100%;min-height:68px;border-radius:12px;background:#F7F8FA;border:1px solid var(--line);padding:12px;font-family:inherit;font-size:16px;line-height:22px;color:var(--ink);resize:vertical;outline:none}
.d6c .d6-cmt textarea:focus{border-color:var(--o);background:#fff}
.d6c .d6-cmt small{display:block;font-size:12px;line-height:16px;color:var(--mut);margin-top:6px}
.fbar.d6-dock{background:#fff;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));gap:8px;box-shadow:0 -4px 16px #17243C0a}
.fbar.d6-dock .btn{height:auto;min-height:56px;border-radius:12px;font-size:14px;line-height:20px;font-weight:600;padding:8px}
.fbar.d6-dock .btn.s{background:#FFF1E9;color:#EF500B;flex:0 0 auto;min-width:120px;box-shadow:none}

.fbar.d6-dock .btn:disabled{background:#C9CED8;color:#fff}

/* ===== design v06.1 — batches 2–3: page layer for checkout, order details, wallet, profile, address (.d6p), Home B (.d6h),
   restaurants list (.d6l). Existing markup and handlers; only the look follows the design. ===== */
.d6p .top,.d6l .top{background:var(--bg);gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 12px}
.d6p .top .ib,.d6l .top .ib{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 1px 5px #00000011;position:static;flex:none;color:var(--ink)}
.d6p .tt b,.d6l .tt b{font-size:22px;line-height:27px;font-weight:600;color:var(--ink)}
.d6p .tt span,.d6l .tt span{font-size:13px;line-height:18px;color:var(--mut)}
.d6p .pg{padding:0 16px 16px}
.d6p .card{border-radius:16px;border:1px solid var(--line2);box-shadow:none;padding:16px;margin-bottom:12px;background:#fff}
.d6p .card h3,.d6p h3{font-size:16px;line-height:22px;font-weight:600;color:var(--ink)}
.d6p .tip{background:var(--form);border-radius:12px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink);padding:0 6px}
.d6p .tip.on{background:var(--o);color:#fff}
.d6p .wsw.on{background:var(--o)}
.d6p .fld{background:var(--form);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:12px;font-size:16px}
.d6p .fld:focus{border-color:var(--o);background:#fff}
.d6p .pm .btn{background:var(--tint);color:var(--o);border-radius:12px;height:48px;padding:0 16px;flex:none}
.d6p .btn.t{color:var(--o);font-weight:600;min-height:44px}
.d6p .wsw{width:64px;height:44px;border:7px solid transparent;box-sizing:border-box}
.d6p .wsw,.d6p .wsw.on{background-clip:padding-box!important}
.d6p .btn.big{min-height:56px;height:auto;border-radius:12px;font-size:15px}
.d6p .sum .row{font-size:14px;line-height:20px;color:var(--mut2);padding:7px 0}
.d6p .sum .tot{border-top:1px solid var(--line2);font-size:16px;color:var(--ink)}
.d6p .sum .tot span:last-child{color:var(--o);font-size:18px}
.d6p .ernb{background:linear-gradient(90deg,#FF6A1F,#F3B04B);color:var(--ink);min-height:40px;border-radius:20px;padding:8px 16px}
.d6p .sv{background:var(--tint);color:var(--ink);border:1px solid #FFD4BE;border-radius:16px;font-weight:600}
.d6p .rad.on{background:var(--o);border-color:var(--o)}
.d6p .pay{min-height:56px}
.d6p .closedb{border-radius:16px}
.d6p .fbar{background:#fff;box-shadow:0 -4px 16px #17243C0a;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.d6p .fbar .btn{min-height:56px;height:auto;border-radius:12px}
.d6p .dr{border-bottom-color:var(--line2)}
/* order details */
.d6p .d6-st{display:flex;align-items:center;gap:12px}
.d6p .d6-st .ok{width:40px;height:40px;border-radius:12px;background:#E6F6ED;color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.d6p .d6-st .ok.bad{background:#FDECEB;color:var(--bad)}
.d6p .d6-st b{font-size:18px;line-height:24px}
.d6p .d6-it{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
.d6p .d6-it:last-child{border-bottom:0}
.d6p .d6-it .d6-ph{width:64px;height:56px;border-radius:10px;flex:none}
.d6p .d6-it .tx{flex:1;min-width:0;font-size:14px;line-height:20px}
.d6p .d6-it .tx b{display:block;font-size:15px}
.d6p .d6-it .nt2,.d6p .d6-it .nt{font-size:12px;line-height:16px;color:var(--mut2)}
.d6p .d6-it .pr{font-weight:600;white-space:nowrap}
.d6p .d6-rep{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:12px 16px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);text-align:start;margin-bottom:12px;cursor:pointer}
/* wallet */
.d6p .d6-bal{background:var(--tint);border:1px solid #FFD4BE;border-radius:16px;padding:16px;margin-bottom:12px;position:relative}
.d6p .d6-bal .lb{font-size:13px;line-height:18px;font-weight:600;color:var(--o)}
.d6p .d6-bal .am{font-size:32px;line-height:40px;font-weight:600;color:var(--ink);margin-top:4px}
.d6p .d6-bal .am small{font-size:14px;color:var(--o);font-weight:600;margin-left:4px}
.d6p .d6-bal .hn{font-size:12px;line-height:17px;color:var(--mut2);margin-top:6px}
.d6p .d6-bal .ic{position:absolute;right:16px;top:16px;color:var(--o)}
.d6p .d6-pts .am{font-size:28px;line-height:34px;font-weight:600}
.d6p .d6-pts .am small{font-size:13px;color:var(--mut);font-weight:500;margin-left:4px}
.d6p .d6-pts .cp{color:var(--o);font-weight:600;font-size:13px}
.d6p .d6-prog{height:6px;border-radius:6px;background:#E7EBF1;margin:12px 0 8px;overflow:hidden}
.d6p .d6-prog i{display:block;height:100%;background:var(--o);border-radius:6px}
.d6p .d6-lnk{background:none;border:0;padding:0;min-height:44px;color:var(--o);font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.d6p .d6-rules{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:18px;color:var(--mut2);margin-top:4px}
.d6p .d6-dis{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:0 16px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;cursor:pointer}
.d6p .d6-dis svg{transition:transform .15s}
.d6p .d6-dis.on svg{transform:rotate(180deg)}
.d6p .d6-tabs{display:flex;gap:8px;margin:0 0 12px}
.d6p .d6-tabs button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.d6p .d6-tabs button.on{background:var(--tint);border-color:var(--o);color:var(--o)}
/* profile */
.d6p .d6-pf{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:12px}
.d6p .d6-av{width:52px;height:52px;border-radius:50%;background:var(--tint);color:var(--o);font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.d6p .d6-pf b{display:block;font-size:17px;line-height:22px}
.d6p .d6-pf .pn{font-size:13px;color:var(--mut);margin-top:2px}
.d6p .d6-pf .d6-lnk{min-height:44px}
.d6p .d6-sv{background:var(--tint);border:1px solid #FFD4BE;border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.d6p .d6-sv .lb{font-size:12px;color:var(--mut2)}
.d6p .d6-sv b{font-size:24px;line-height:30px;font-weight:600}
.d6p .d6-sv .xs{text-align:right}
.d6p .gp{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:0 16px;margin-bottom:12px;box-shadow:none}
.d6p .r2{min-height:56px;padding:0;border-radius:0;font-size:15px;font-weight:600;gap:12px;border-bottom:1px solid var(--line2)}
.d6p .r2:last-child{border-bottom:0}
.d6p .r2 .i3{background:none;color:var(--o);width:24px;height:24px}
.d6p .r2 .vl{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--o);font-weight:600;font-size:14px}
.d6p .r2 .vl svg{color:var(--mut)}
.d6p .d6-ft{font-size:12px;line-height:17px;color:var(--mut);margin:4px 4px 0}
/* address form */
.d6p .seg{background:none;padding:0;gap:8px}
.d6p .seg button{min-height:44px;border-radius:12px;background:#fff;border:1px solid var(--line2);color:var(--ink);font-size:14px;font-weight:600}
.d6p .seg button.on{background:var(--tint);border-color:var(--tint);color:var(--o);box-shadow:none}
.d6p .mapbox{border-radius:12px}
.d6p .fl2{font-size:13px;font-weight:600;color:var(--ink)}
.d6p .frow{display:block}
.d6p .fbar.d6-save .btn{background:var(--o)}

.d6p .supl{justify-content:flex-start;gap:12px;min-height:64px;background:#fff;border:1px solid var(--line2);border-radius:16px;padding:12px 16px;margin:0 0 12px;color:var(--ink);font-size:15px;font-weight:600;text-align:start}
.d6p .supl svg{color:var(--o)}
.d6p .ratef h3{font-size:18px}
.d6p .rcp .li{display:flex}
/* ===== Home B (.d6h) and the restaurants list (.d6l) ===== */
.d6h,.d6l{background:#fff;padding-bottom:4px;min-height:100vh}
.d6-hh{position:sticky;top:calc(-58px - env(safe-area-inset-top,0px));z-index:55;background:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
.d6-hr{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:8px}
.d6-logo{width:108px;height:auto;flex:none;display:block}
.d6-loc{flex:1;min-width:0;display:flex;align-items:center;gap:4px;border:0;background:none;font-family:inherit;color:var(--ink);text-align:start;min-height:48px;padding:0 2px;cursor:pointer}
.d6-loc svg{flex:none}
.d6-loc span{flex:1;min-width:0;display:flex;flex-direction:column}
.d6-loc small{font-size:12px;line-height:16px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d6-loc b{font-size:14px;line-height:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d6-hib{position:relative;width:44px;height:44px;border-radius:50%;background:var(--form);border:0;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;cursor:pointer;padding:0}
.d6-hib .bdg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--o);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;box-sizing:content-box;line-height:1}
.d6-sf{display:flex;align-items:center;gap:8px;min-height:52px;border-radius:14px;background:var(--form);border:1px solid var(--line2);padding:0 1px 0 14px;color:var(--mut);cursor:text}
.d6-sf input[type=search]{flex:1;min-width:0;border:0;background:none;font-family:inherit;font-size:16px;color:var(--ink);height:48px;outline:none;padding:0;margin:0;-webkit-appearance:none;appearance:none;box-shadow:none}
.d6-sf input::placeholder{color:var(--mut)}
.d6-fb{width:48px;height:48px;border-radius:12px;background:var(--tint);color:var(--o);border:0;display:flex;align-items:center;justify-content:center;position:relative;flex:none;cursor:pointer;padding:0}
.d6-fb.on{background:var(--o);color:#fff}
.d6-fb i{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--o)}
.d6h .ndg{margin:8px 14px 0}
/* bento */
.d6-bento{display:grid;grid-template-columns:1.53fr 1fr;grid-template-rows:106px 106px;gap:8px;padding:6px 14px 0}
.d6-bento.one{grid-template-columns:1fr;grid-template-rows:180px}
.d6-bm{grid-row:1/3;position:relative;border-radius:14px;overflow:hidden;min-width:0}
.d6-bento.one .d6-bm{grid-row:auto}
.d6-bsc{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.d6-bsc::-webkit-scrollbar{display:none}
.d6-bsc>.d6-bt{flex:0 0 100%;scroll-snap-align:start;border-radius:0;padding-bottom:22px}
.d6-bt{position:relative;overflow:hidden;border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:pointer;color:#fff;background:linear-gradient(150deg,#FF7A2E,#FF5A12 60%,#E84A08);min-width:0;min-height:0}
.d6-bt.d6tg{background:linear-gradient(150deg,#45A862,#23853F)}
.d6-bt.d6tp{background:linear-gradient(150deg,#FAD0DC,#F2A3BD);color:var(--ink)}
.d6-bt .tt{font-size:14px;line-height:18px;font-weight:600;position:relative;z-index:1;max-width:100%}
.d6-bt.d6tm .tt{font-size:22px;line-height:26px;max-width:80%}
.d6-bt .su{font-size:11px;line-height:15px;position:relative;z-index:1;max-width:72%}
.d6-bt.d6tm .su{font-size:13px;line-height:17px}
.d6-bt .cd{font-size:12px;font-weight:600;background:#ffffff33;border-radius:8px;padding:2px 8px;position:relative;z-index:1;display:inline-flex;align-items:center;gap:4px}
.d6-bt .cta{margin-top:auto;background:#fff;color:var(--ink);font-size:13px;font-weight:600;border-radius:12px;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;position:relative;z-index:1;max-width:100%}
.d6-bt:not(.d6tm) .su{display:none}
.d6-bt .ar{margin-top:auto;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;flex:none}
.d6-bt .art{position:absolute;right:-8px;bottom:-8px;width:70px;height:70px;filter:drop-shadow(0 6px 8px #00000026)}
.d6-bt.d6tm .art{width:112px;height:112px;right:-12px;bottom:auto;top:44%}
.d6-bento.one .d6-bt.d6tm .art{width:140px;height:140px;top:auto;bottom:-10px;right:-6px}
.d6-bt.img{padding:0;background:var(--form);color:var(--ink)}
.d6-bt.img>img{width:100%;height:100%;object-fit:cover;display:block}
.d6-bt.img .tt{padding:12px}
.d6-bm .hdt{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none;margin:0}
.d6-bm .hdt i{width:6px;height:6px;border-radius:3px;background:#ffffff99}
.d6-bm .hdt i.on{width:16px;background:#fff}
/* categories: one row of six */
.d6-cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:14px 6px 2px}
.d6-ct{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-family:inherit;color:var(--ink);padding:0;cursor:pointer;min-width:0;min-height:75px}
.d6-ct span{width:52px;height:52px;max-width:100%;border-radius:50%;display:flex;align-items:center;justify-content:center}
.d6-ct img{width:38px;height:38px;filter:drop-shadow(0 3px 4px #17243C22)}
.d6-ct b{font-size:11px;line-height:14px;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
/* section titles */
.d6-sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 14px 6px}
.d6-sh h2{display:flex;align-items:center;gap:8px;font-size:18px;line-height:24px;font-weight:600;color:var(--ink);margin:0;min-width:0}
.d6-sh h2 span{overflow:hidden;text-overflow:ellipsis}
.d6-sh h2 svg{color:var(--o);flex:none}
.d6-sh button{border:0;background:none;color:var(--o);font-family:inherit;font-size:12px;font-weight:600;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:flex-end;gap:2px;padding:0;flex:none;cursor:pointer}
.d6-shs{font-size:12px;line-height:16px;color:var(--mut2);margin:-6px 14px 8px}
.d6l .d6-sh{padding:16px 0 6px}.d6l .d6-shs{margin:-6px 0 10px 28px}
/* rails */
.d6-rl{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 6px;scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding:0 14px}
.d6-rl::-webkit-scrollbar{display:none}
.d6-rl>*{flex:none;scroll-snap-align:start}
#app .d6h :is(.d6-sc,.d6-nc).closed > .d6-ph.none{display:block}
.d6h .d6-ph .hb{position:absolute;top:8px;left:8px;z-index:1}
.d6h .hrt,.d6l .hrt{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;padding:0;box-shadow:none}
.d6h .hrt::before,.d6l .hrt::before{content:'';position:absolute;inset:5px;border-radius:10px;background:#fff;box-shadow:0 1px 4px #17243C22;z-index:-1}
/* favourites again */
.d6-lo{width:122px;border:1px solid var(--line2);border-radius:12px;padding:0 0 8px;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.d6-lo .d6-ph{width:100%;height:60px}
.d6-lo .nm{font-size:13px;line-height:17px;font-weight:600;margin:8px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d6-lo .it{font-size:11px;line-height:15px;color:var(--mut2);margin:2px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d6-ob{margin:8px 8px 0;min-height:48px;border-radius:8px;background:var(--o);color:#fff;border:0;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0 4px}
/* best offers */
.d6-of{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px}
.d6-of.one{grid-template-columns:1fr}
.d6-ot{position:relative;overflow:hidden;min-height:92px;border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;background:var(--tint);color:var(--ink)}
.d6-ot.g{background:#E8F6EC}
.d6-ot b{font-size:14px;line-height:18px;font-weight:600;display:flex;align-items:center;gap:4px;position:relative;z-index:1;max-width:76%}
.d6-ot b svg{color:var(--o);flex:none}
.d6-ot .s{font-size:12px;line-height:16px;color:var(--mut2);position:relative;z-index:1;max-width:64%;display:inline-flex;align-items:center;gap:3px}
.d6-ot .ar{margin-top:auto;width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.d6-ot img{position:absolute;right:-6px;bottom:-6px;width:68px;height:68px}
/* popular restaurants */
.d6-sc{width:167px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding-bottom:10px}
.d6-sc .d6-ph{width:100%;height:100px}

.d6h .rt,.d6l .rt{display:inline-flex;align-items:center;gap:2px;color:var(--ink);font-weight:600;flex:none}
.d6h .rt svg,.d6l .rt svg{color:#F5A524}
.d6h .rt i,.d6l .rt i{font-style:normal;font-weight:400;color:var(--mut2)}
.d6-sc .pk{margin:6px 10px 0}

.d6-pt{width:120px;cursor:pointer}
.d6-pt .d6-ph{width:120px;height:80px;border-radius:12px}

.d6-pa{position:absolute;right:0;bottom:0;width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;color:var(--ink);padding:0}

/* nearby */
.d6-nr{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;grid-auto-columns:min(292px,calc(100vw - 52px));gap:10px;overflow-x:auto;padding:4px 14px 6px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 14px}

.d6-nc .go{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--o);display:flex;align-items:center;justify-content:center;margin-right:12px;flex:none}

.d6-cp{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px}

.d6-cp .c1 .go svg{color:var(--o)}
/* DineOut */
.d6-dn{position:relative;overflow:hidden;margin:0 14px;border-radius:15px;min-height:170px;background:linear-gradient(135deg,#17243C,#2A2620 62%,#5A3D16);color:#fff;padding:18px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer}

.d6-dn p{font-size:14px;line-height:19px;margin:0;position:relative;z-index:1;max-width:62%;color:#F1E6D2}
.d6-dn .go{margin-top:auto;background:var(--o);color:#fff;border-radius:20px;min-height:40px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;position:relative;z-index:1}
.d6-dn .art{position:absolute;right:-6px;bottom:-10px;width:120px;height:120px;filter:drop-shadow(0 8px 10px #0000004d)}
.d6-dn .pct{position:relative;align-self:flex-end;order:-1;max-width:100%;overflow-wrap:anywhere;background:var(--tint);color:var(--o);font-size:12px;font-weight:600;border-radius:10px;padding:4px 8px;z-index:1}
.d6-dc{width:240px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding-bottom:10px}
.d6-dc .d6-ph{width:100%;height:130px}
.d6-dc .nm{display:flex;align-items:center;gap:4px;margin:8px 12px 0;font-size:15px;line-height:20px}
.d6-dc .nm span{overflow:hidden;text-overflow:ellipsis}
.d6-dc .nm svg{color:var(--o);flex:none}
.d6-dc .mt{margin:3px 12px 0}
/* partner banners (admin) */
.d6h .bbs{margin:0 14px;border-radius:16px}
.d6h .bb{background:#FFF0E7;color:var(--ink)}
.d6h .bb b{display:block;padding:16px;font-size:18px}
/* restaurants list (all lists) */
.d6-lh{background:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0}
.d6-lt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.d6-lt h1{font-size:22px;line-height:28px;font-weight:600;margin:0;color:var(--ink);min-width:0;flex:none;max-width:70%}
.d6-lt span{font-size:12px;line-height:16px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.d6-l3 button{min-height:88px;border-radius:14px;border:2px solid transparent;font-family:inherit;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px;font-size:14px;line-height:18px;font-weight:600;color:var(--ink);text-align:start;cursor:pointer;min-width:0}

.d6l .d6-sf{margin:0 14px}
.d6l .chips{padding:10px 14px 2px;gap:8px}
.d6l .chip{min-height:44px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--o);font-weight:600;font-size:13px;box-shadow:none}

.d6l .pg{padding:4px 14px 16px}
.d6-res.pg{padding:8px 14px 16px}
.sr.d6-sr{gap:12px;align-items:flex-start;border:1px solid var(--line2);border-radius:16px;padding:14px 12px;margin-bottom:12px;background:#fff;box-shadow:none;cursor:pointer}

.sr.d6-sr .tx{padding-right:34px}
.sr.d6-sr .nm{font-size:16px;line-height:21px;font-weight:600;color:var(--ink)}
.sr.d6-sr .tx p{font-size:12px;line-height:17px;color:var(--mut2);margin-top:2px}
.sr.d6-sr .tx p.hit{color:var(--o);font-weight:600}
.sr.d6-sr .mt{margin:5px 0 0;color:var(--ink)}
.sr.d6-sr .dl{font-size:12px;line-height:17px;color:var(--mut2);margin-top:2px;display:flex;align-items:center;gap:4px}
.sr.d6-sr .or{position:absolute;right:12px;bottom:12px;background:var(--form);border-radius:10px;font-size:11px;line-height:14px;padding:4px 8px;color:var(--mut2)}
.sr.d6-sr.closed .d6-ph>img{filter:grayscale(1);opacity:.55}
@media (max-width:374px){.d6-ct b{font-size:10px}.d6-bt.d6tm .tt{font-size:20px;line-height:24px}.d6-l3 button{font-size:13px;padding:10px}}

/* v65 — owner-requested unified type scale, 18 Oct 2026.
   Supersedes v63b's 400/700 mapping. System font retained; logo assets unchanged.
   Regular 400; emphasis / controls 500; headings / amounts 600. */
:root{--type-caption:12px;--type-body:14px;--type-label:15px;--type-group:16px;--type-section:18px;--type-page:20px;--type-display:28px;--weight-regular:400;--weight-medium:500;--weight-heading:600}
body{font-size:var(--type-body);line-height:20px;font-weight:var(--weight-regular)}
#app :where(b,strong,.b6,.b7){font-weight:var(--weight-medium)}
#app :where(button,.btn,.tip,.chip,.brc,.tgb,.seg button,.d6-ob,.d6-lnk,.d6-undo,.d6-rep){font-size:var(--type-body);line-height:20px;font-weight:var(--weight-medium)}
#app :where(.btn span,.d6-dock .btn span){font-weight:var(--weight-medium)!important}
#app :where(h1,.tt b,.d6-head h1,.d6-lt h1,.d6-id h1,.d6s-in h2){font-size:var(--type-page);line-height:26px;font-weight:var(--weight-heading);letter-spacing:0}
#app :where(.d6-h2,.d6-sh h2,.pg>h3){font-size:var(--type-section);line-height:24px;font-weight:var(--weight-heading);letter-spacing:0}
#app :where(.card h3,.d6-gh h3,.d6-nt h3,.d6-dis){font-size:var(--type-group);line-height:22px;font-weight:var(--weight-medium)}
#app :where(.nm,.d6-pf b,.r2,.d6-it .tx b,.card .rg b,.b6){font-size:var(--type-label);line-height:21px;font-weight:var(--weight-medium);letter-spacing:0}
#app .d6-pv .nm{min-height:40px}
#app :where(.d6-ch .nm,.d6-ch .pr){font-size:var(--type-body);line-height:20px;font-weight:var(--weight-regular)}
#app .d6-ch.on .nm{font-weight:var(--weight-medium)}
#app :where(.d6-px,.ci .d6-lp,.d6-it .pr,.sum .tot span,.sum .tot span:last-child,.oshf .btn .px6){font-size:var(--type-group);line-height:22px;font-weight:var(--weight-heading)!important}
#app .d6s-pr{font-size:var(--type-page);line-height:26px;font-weight:var(--weight-heading)}
#app :where(.d6-px s,.d6-lp s,.d6s-pr s){font-size:var(--type-caption);line-height:18px;font-weight:var(--weight-regular)!important}
#app :where(.d6-bal .am,.d6-pts .am){font-size:var(--type-display);line-height:34px;font-weight:var(--weight-heading);letter-spacing:0}
#app .d6-sv b{font-size:24px;line-height:30px;font-weight:var(--weight-heading)}
#app :where(.sm,.d6-sub,.d6-bal .hn,.d6-pts .sm,.d6-pts .xs,.d6-rules,.d6-rwn,.dr .xs,.d6-lo .it){font-size:var(--type-body);line-height:20px;font-weight:var(--weight-regular)}
#app :where(.xs,small,.pn,.d6-pf .pn,.d6-head .st,.tt span,.d6-stat span,.d6-loc small,.d6-pts .am small,.d6-bal .am small,.d6-pill,.d6-bdg,.hb,.d6-pts .cp){font-size:var(--type-caption);line-height:18px;font-weight:var(--weight-regular);letter-spacing:0}
#app :where(.d6-pill,.d6-bdg,.hb,.d6-pts .cp){font-weight:var(--weight-medium)}
#app :where(.d6-of b,.d6-rw,.d6-rw span,.d6-loc b,.d6-cp b,.d6-nc .tx b,.d6-ob,.d6-lo .nm,.d6-ot b){font-size:var(--type-body);line-height:20px;font-weight:var(--weight-medium);letter-spacing:0}
#app :where(.d6-of span,.d6-bt p,.d6-lo .it,.d6-cp span,.d6-nc .tx span){font-size:var(--type-caption);line-height:18px;font-weight:var(--weight-regular)}
#app :where(.d6-bt .tt,.d6-bt.d6tm .tt){font-size:var(--type-page);line-height:26px;font-weight:var(--weight-heading)}
#app .d6-stat b{font-size:var(--type-label);line-height:21px;font-weight:var(--weight-medium)}
#app .d6-ct b{font-size:11px;line-height:16px;font-weight:var(--weight-regular);letter-spacing:0}
#app .nav>div{font-size:var(--type-caption);line-height:18px;font-weight:var(--weight-medium)}
#app .d6-av{font-size:24px;line-height:30px;font-weight:var(--weight-medium)}
#app :where(input,textarea,select,.fld){font-size:16px;line-height:22px;font-weight:var(--weight-regular)}
#app .d6-pts .sm{font-weight:var(--weight-regular)!important}
#app .btn span:first-child{font-size:var(--type-body);line-height:20px;font-weight:var(--weight-medium)}
#app .fdc b{font-size:var(--type-body);line-height:20px;font-weight:var(--weight-regular)}
#app .fdc strong{font-weight:var(--weight-medium)}
#app .rt{font-size:var(--type-caption);line-height:18px;font-weight:var(--weight-medium)}
#app .d6-of .ic{font-size:24px;line-height:30px}
/* Compact sheet keeps the same role scale; scrolling, not text shrinking, provides access. */
#app .d6-keyboard .d6s-in h2{font-size:var(--type-page);line-height:26px}

/* v66 — compact layout requested by the owner. No viewport scaling or financial changes. */
.d6h .d6-hr{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;grid-template-rows:23px 44px;column-gap:8px;row-gap:0;margin-bottom:6px}

.d6h .d6-loc span{display:block;overflow:hidden}

function mealsH(products,expanded=false){
  const setting=Number(TLB.settings()?.home_meal_price_cap);
  const cap=Number.isFinite(setting)&&setting>0?setting:100;
  const restaurants=products.filter(c=>c.st.c==='rest'&&homeTasteDish(c.it));
  const byDish=new Map(restaurants.map(card=>[String(card.st.id)+':'+String(card.it.id),card]));
  const pins=TLB.stores().flatMap(store=>Array.isArray(store.home_sponsored_dishes)?
    store.home_sponsored_dishes.filter(pin=>pin&&typeof pin==='object'&&pin.item_id!=null)
      .map(pin=>({...pin,store_id:store.id})):[]);
  const rank=pin=>typeof pin.rank==='number'&&Number.isFinite(pin.rank)?pin.rank:Infinity;
  pins.sort((a,b)=>rank(a)-rank(b));
  const cards=[],seen=new Set();
  for(const pin of pins){
    const key=String(pin.store_id)+':'+String(pin.item_id),card=byDish.get(key);
    if(card&&!seen.has(key)){seen.add(key);cards.push({...card,sponsored:true})}
  }
  const automatic=restaurants.filter(c=>c.it.meal_for_one||c.price<=cap)
    .sort((a,b)=>Number(Boolean(b.it.meal_for_one))-Number(Boolean(a.it.meal_for_one))||
      Number(Boolean(b.it.image))-Number(Boolean(a.it.image))||a.price-b.price);
  for(const card of automatic){
    const key=String(card.st.id)+':'+String(card.it.id);
    if(cards.length>=10)break;
    if(!seen.has(key)){seen.add(key);cards.push(card)}
  }
  cards.splice(10);

  const price=Math.min(...cards.map(c=>c.price));
  const tried=cards.some(c=>c.st.ffd)?triedRestaurants():null;
  const free=cards.every(c=>c.st.ft==='free'||(c.st.ffd&&tried&&!tried.has(c.st.n))||

}

// The regular customer feed contains only the latest 60 orders.
let discoveryHistory=null;
function triedRestaurants(){
  const orders=TLB.orders(),counts=o=>o.status!=='cancelled'&&o.status!=='rejected';
  const tried=new Set(orders.filter(counts).map(o=>o.store));
  if(orders.length<60)return tried;
  const user=TLB.me()?.id;
  if(!user)return null;
  const key=JSON.stringify([user,orders[orders.length-1].id]);
  if(discoveryHistory?.key!==key||Date.now()>discoveryHistory.retryAfter){
    const state=discoveryHistory={key,names:null,retryAfter:Infinity};
    (async()=>{
      const names=new Set();
      for(let from=0;;from+=50){
        const page=await TLB.customerOrders(user,from);
        if(state!==discoveryHistory)return;
        if(page.failed){state.retryAfter=Date.now()+30000;return}
        page.filter(counts).forEach(o=>names.add(o.store));
        if(page.length<50||(page.total!=null&&from+page.length>=page.total))break;
      }
      state.names=names;
      if(S.v==='home'||S.v==='discoverAll')render();
    })();
  }
  if(!discoveryHistory.names)return null;
  for(const name of discoveryHistory.names)tried.add(name);
  return tried;
}
function discoveryCards(){
  const now=Date.now(),tried=triedRestaurants(),raw=TLB.stores();
  const restaurants=STORES.filter(st=>st.c==='rest');
  const isRecent=date=>{const time=Date.parse(date);return time<=now&&now-time<=30*864e5};
  const newStores=restaurants.filter(st=>tried&&!tried.has(st.n)&&isRecent(st.cr))
    .sort((a,b)=>Date.parse(b.cr)-Date.parse(a.cr));
  const cards=newStores.map(st=>{
    const data=raw.find(r=>r.id===st.id),pct=Number(data?.first_order_discount_pct);
    return {st,data,type:'restaurant',id:'restaurant:'+st.id,first:pct>0&&pct<=100?pct:0};
  });
  const menus=TLB.allMenus(true),offers=[],dishKeys=new Set(),offerStores=new Set(),keys=new Set(cards.map(card=>card.id));
  for(const store of raw){
    if(!Array.isArray(store.home_reels))continue;
    const st=restaurants.find(s=>s.id===store.id);
    if(!st||!TLB.isOpen(st.n))continue;
    for(const entry of store.home_reels){
      if(!entry||!['restaurant','dish','offer'].includes(entry.type)||entry.id==null)continue;
      const id=entry.type+':'+entry.id;
      if(keys.has(id))continue;
      const item=entry.type==='dish'?(menus[st.n]||[]).find(it=>it.id===entry.item_id&&!it.optsBlocked):null;
      if(entry.type==='restaurant'&&!newStores.includes(st))continue;
      if((entry.type==='dish'&&!item)||(entry.type==='offer'&&st.disc<=0))continue;
      keys.add(id);
      const card={id,st,type:entry.type,item,first:0,title:item?.name||entry.title,cover:entry.cover_url||item?.image||st.i,video:entry.reel_url};
      if(item)dishKeys.add(item.id);
      if(entry.type==='offer'){offers.push(card);offerStores.add(st.id)}
      else cards.push(card);
    }
  }
  for(const st of restaurants){
    if(!TLB.isOpen(st.n))continue;
    if(st.disc>0&&!offerStores.has(st.id))offers.push({id:'offer:store:'+st.id,st,type:'offer',first:0});
    for(const item of menus[st.n]||[]){
      if(item.optsBlocked||dishKeys.has(item.id))continue;
      if(item.discount>0)offers.push({id:'dish:discount:'+item.id,st,type:'dish',item,title:item.name,cover:item.image||st.i,first:0});
    }
  }
  offers.sort((a,b)=>reelDiscountPct(b)-reelDiscountPct(a));
  return cards.concat(offers);
}

  .then(ok=>{U18_SERVER.status=ok===true?'ready':'unready';if(S.v==='pay')render()})

}

const RS_ORDER=['not_delivered','wrong_order','missing_items','quality','late','courier','restaurant','payment','other'],RS_GENERAL=['courier','restaurant','payment','other'],RS_ACTIVE=['late','courier','restaurant','payment','other'],RS_CLOSED=['restaurant','payment','other'];
function reasonsFor(orderId){if(orderId==null)return RS_GENERAL;const o=TLB.order(orderId);if(!o)return RS_GENERAL;if(['pending','preparing','ready','pickedup'].includes(o.status))return RS_ACTIVE;return o.status=='delivered'?RS_ORDER:RS_CLOSED}
const repOk=r=>!!r.reason&&(r.reason!='other'||r.msg.trim().length>=5)&&!r.busy;
const RSI={not_delivered:'bike',wrong_order:'receipt',missing_items:'bag',quality:'star',late:'down',courier:'user',restaurant:'home',payment:'card',other:'chat'};
const TKC={open:['#c2410c','#fff3e8'],in_progress:['#1d4ed8','#eaf1ff'],resolved:['#1fa05a','#e6f6ed'],rejected:['#d92d20','#fdeceb']};
const tkChip=s=>`<span class="tkc" style="color:${TKC[s][0]};background:${TKC[s][1]}">${t('tk_'+s)}</span>`;
const openTk=id=>TLB.tickets().find(x=>x.order_id==id&&(x.status=='open'||x.status=='in_progress'));
function canReport(o){if(['pending','preparing','ready','pickedup'].includes(o.status))return true;return Date.now()-(o.doneAt||o.createdAt)<48*3600*1000}
function reportBtn(o){if(!canReport(o))return '';const tk=openTk(o.id);

function closeRep(){S.rep=null;render()}
async function repSend(){const r=S.rep;if(!r||r.busy)return;if(!r.reason||(r.reason=='other'&&r.msg.trim().length<5)){alert(t('supNeed'));return}
