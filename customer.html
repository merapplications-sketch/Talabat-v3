let S={promo:null,perr:'',pm:null,pcode:'',note:'',busy:false,msq:'',msearch:false,sheet:false,v:'home',q:'',store:'',back:'home',cart:{},cartStore:'',tip:0,pay:'apple',tid:null,catKey:'',cq:'',srt:'',ofl:'all',fo:false};

const go=(v,x)=>{Object.assign(S,{v},x||{});render();scrollTo(0,0)};
const openStore=i=>{if(!TLB.isOpen(STORES[i].n)){TLB.toast&&TLB.toast(t('closedMsg'),true);return}go('menu',{store:STORES[i].n,back:S.v=='cat'?'cat':S.v=='fav'?'fav':S.v=='promo'?'promo':'home',msq:'',msearch:false,sheet:false})};
const openCat=c=>go('cat',{catKey:c,cq:'',srt:'',fo:false});
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const inB=p=>TLB.banners().filter(b=>(b.placement||'top')==p);
const isFirst=n=>!TLB.orders().some(o=>o.store==n&&o.status!='rejected'&&o.status!='cancelled');
const sdOf=n=>(STORES.find(x=>x.n==n)||{}).disc||0;
/* prices: an item gets the better of the store discount and its own offer (never stacked) */
const eff=(it,sd)=>Math.max(+sd||0,+it.discount||0);
const unit=(it,sd)=>{const e=eff(it,sd);return e?Math.round(it.price*(100-e))/100:it.price};
const pxH=(it,sd,q)=>{const e=eff(it,sd),k=q||1;return e?`<span class="px">${Math.round(unit(it,sd)*k*100)/100} TJS<s>${Math.round(it.price*k*100)/100}</s></span>`:`<span class="px">${Math.round(it.price*k*100)/100} TJS</span>`};
function calc(){const m=menuOf(S.cartStore),sd=sdOf(S.cartStore),st=STORES.find(x=>x.n==S.cartStore)||{fee:10,disc:0};let sub=0,d=0,base=0;
  for(const id in S.cart){const it=m.find(x=>x.id==id);if(!it)continue;const lt=it.price*S.cart[id],e=eff(it,sd);sub+=lt;d+=Math.round(lt*e)/100;if(!e)base+=lt}
  d=Math.round(d*100)/100;const ff=!!(sub&&st.ffd&&st.ft!='free'&&isFirst(S.cartStore)),fee=sub?(ff?0:st.fee):0,p=S.promo?Math.min(+S.promo.d||0,base):0;
  return{sub,d,p,fee,ff,base,total:Math.max(5,sub-d-p+fee+S.tip)}}
/* ---------- cart + promo ---------- */
const perrMsg=()=>S.perr=='promo_min'&&S.pm?t('promoMinMsg').replace('{min}',S.pm.min).replace('{have}',S.pm.have):t('err_'+S.perr);
function afterCart(){if(!cartCount()){S.promo=null;S.perr='';S.pm=null;S.note='';if(S.v=='cart'||S.v=='pay'){go(TLB.isOpen(S.cartStore)?'menu':'home',{store:S.cartStore,back:'home'});return}}render();if(S.promo||S.perr=='promo_min')revalPromo()}
function delLine(id){delete S.cart[id];afterCart()}
function clearCart(){if(!confirm(t('clearCart')))return;S.cart={};afterCart()}
function goMore(){if(!TLB.isOpen(S.cartStore)){TLB.toast&&TLB.toast(t('closedMsg'),true);return}go('menu',{store:S.cartStore,back:'cart'})}
function goCart(){S.perr='';S.pm=null;go('cart')}
function add(id,d){S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];afterCart()}
function closedNow(n){return !TLB.isOpen(n)}
function addFrom(id){if(closedNow(S.store)){alert(t('closedMsg'));return}if(Object.keys(S.cart).length&&S.cartStore!==S.store){if(!confirm(t('clear_cart')))return;S.cart={};S.promo=null;S.perr='';S.pm=null}S.cartStore=S.store;add(id,1)}
async function applyPromo(){const code=(($('pc')||{}).value||'').trim();if(!code)return;S.pcode=code;const r=await TLB.checkPromo(S.cartStore,S.cart,code);
  if(r.error){S.promo=null;S.perr=r.error;S.pm=r.error=='promo_min'?{min:r.min,have:r.have}:null}else{S.promo={code:code.toUpperCase(),d:r.discount};S.perr='';S.pm=null}render()}
function removePromo(){S.promo=null;S.perr='';S.pm=null;S.pcode='';render()}
let pSeq=0;
async function revalPromo(){const code=S.promo?S.promo.code:S.pcode;if(!code)return;const seq=++pSeq;const r=await TLB.checkPromo(S.cartStore,S.cart,code);if(seq!==pSeq)return;
  if(r.error){S.promo=null;S.perr=r.error;S.pm=r.error=='promo_min'?{min:r.min,have:r.have}:null}else{S.promo={code:code.toUpperCase(),d:r.discount};S.perr='';S.pm=null}render()}
async function place(){
  if(S.busy)return;
  if(!ME.phone){alert(t('needPh'));go('me');return}
  if(closedNow(S.cartStore)){alert(t('closedMsg'));return}
  S.busy=true;render();
  try{const first=Object.keys(S.cart)[0],notes={};if(first&&S.note.trim())notes[first]=S.note.trim();
    const r=await TLB.placeOrder({store:S.cartStore,cart:S.cart,notes,tip:S.tip,payment:S.pay,promo:S.promo&&S.promo.code,address:'Проспект Рудаки, д. 12, кв. 4'});
    if(r.error){if(/^promo_|too_many$/.test(r.error)){S.promo=null;S.perr=r.error;go('cart')}alert(t('err_'+r.error));return}
    S.cart={};S.tip=0;S.promo=null;S.perr='';S.pm=null;S.note='';S.pcode='';go('done',{tid:r.id})}
  finally{S.busy=false;if(S.v=='pay')render()}}
async function savePhone(){const r=await TLB.setMyPhone($('ph').value);if(r.error){alert(t('err_'+r.error));return}ME.phone=r.phone;render()}
function cancelO(){if(confirm(t('confirm_cancel'))){TLB.setStatus(S.tid,'cancelled');go('orders')}}
function sendChat(){const e=$('ci'),v=e.value.trim();if(!v)return;e.value='';TLB.chat(S.tid,'client',v)}
function sendLoc(){TLB.pickLocation((la,ln)=>TLB.chat(S.tid,'client','LOC:'+la.toFixed(6)+','+ln.toFixed(6)))}
function reorder(id){const o=TLB.order(id);if(!o)return;if(!TLB.isOpen(o.store)){alert(t('closedMsg'));return}const m=TLB.allMenus(true)[o.store]||[],cart={};let miss=0;
  (o.items||[]).forEach(i=>{const it=m.find(x=>x.id==i.id);if(it)cart[it.id]=i.qty;else miss++});
  if(!Object.keys(cart).length){alert(t('err_unavailable'));return}
  if(miss&&!confirm(t('reorderMiss')))return;
  S.cart=cart;S.cartStore=o.store;S.promo=null;S.perr='';S.pm=null;goCart()}
function bannerGo(id){const b=TLB.banners().find(x=>x.id==id);if(!b)return;
  if(b.link_type=='store'){const i=STORES.findIndex(x=>x.id==b.link_value);if(i>=0)openStore(i)}
  else if(b.link_type=='category'){S.q='';openCat(b.link_value)}}
/* ---------- auto-rotating ads (3 s) ---------- */
const ROT={top:0,bottom:0};
const rotStep=el=>el.children.length>1?el.children[1].offsetLeft-el.children[0].offsetLeft:el.clientWidth;
function rotDots(k){document.querySelectorAll('[data-dots="'+k+'"] i').forEach((d,i)=>{d.className=i==ROT[k]?'on':''})}
function rotSync(el){const st=rotStep(el);if(st>0){ROT[el.dataset.k]=Math.round(el.scrollLeft/st);rotDots(el.dataset.k)}}
function rotRestore(){document.querySelectorAll('[data-k]').forEach(el=>{const st=rotStep(el),k=el.dataset.k;if(st>0&&ROT[k]<el.children.length)el.scrollLeft=ROT[k]*st})}
function rotTick(){if(S.v!='home'||S.q.trim())return;document.querySelectorAll('[data-k]').forEach(el=>{const n=el.children.length,k=el.dataset.k;if(n<2)return;ROT[k]=(ROT[k]+1)%n;el.scrollTo({left:ROT[k]*rotStep(el),behavior:'smooth'});rotDots(k)})}
if(typeof setInterval=='function'&&!window.__rot)window.__rot=setInterval(rotTick,3000);
/* ---------- shared view pieces ---------- */
const cnt=n=>n>=1000?Math.floor(n/1000)+'k+':String(n);
const rate=s=>s.rt>0?`<span class="rt">${ico('star',13,1)}${s.rt.toFixed(1)}${s.rc?` <i>(${cnt(s.rc)})</i>`:''}</span>`:'';
const delTxt=s=>s.ft=='free'?t('free'):s.ffd?t('freeFirst'):s.fee+' TJS';
const pic=u=>u?`<img src="${esc(u)}" alt="" loading="lazy">`:`<div class="ph"></div>`;
const isFavS=s=>TLB.isFav(s.id);

  const fl=[['all','fAll'],['act','fAct'],['done','fDone'],['can','fCan']];
  return topbar(t('ordersT'),'',"go('home')")+`<div class="chips" style="padding-top:2px">${fl.map(([k,l])=>`<button class="chip ${f==k?'on':''}" onclick="S.ofl='${k}';render()">${t(l)}</button>`).join('')}</div>
  <div class="pg">${l.length?l.map(o=>{const st=storeOf(o.store),n=(o.items||[]).reduce((a,i)=>a+i.qty,0);return `<div class="or-r" onclick="go('track',{tid:${o.id}})"><div class="th">${pic(st.i)}</div><div class="tx"><div class="row"><b>${esc(o.store)}</b>${ico('chev',18)}</div><div class="xs mut" style="margin:3px 0 8px">${fmtD(o.createdAt)}</div><div class="row"><span class="xs b6">${n?n+' '+t('items')+' · ':''}${o.total} TJS</span><span class="pill ${o.status}">${t('trk_'+o.status)}${TLB.unread(o.id)?` · ${TLB.unread(o.id)}`:''}</span></div></div></div>`}).join(''):emptyV(t('noOrdersT'),t('noOrdersS'))}</div>`}
/* ---------- TRACKING ---------- */
const HERO=`<svg width="100%" height="120" viewBox="0 0 320 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g fill="#d8e3f6"><rect x="12" y="52" width="34" height="68"/><rect x="52" y="30" width="30" height="90"/><rect x="236" y="44" width="34" height="76"/><rect x="276" y="64" width="30" height="56"/></g><circle cx="160" cy="62" r="40" fill="#fff"/><g transform="translate(138 40)" fill="none" stroke="#f1511b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="32" r="7"/><circle cx="35" cy="32" r="7"/><path d="M9 32l9-18h11l6 18M18 14h-5"/></g></svg>`;
const RT={};
const rt0=id=>RT[id]||(RT[id]={s:0,d:0,c:''});
function setStar(id,k,n){rt0(id)[k]=n;render()}
function stars(id,k,val){return `<div class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="${n}" onclick="setStar(${id},'${k}',${n})" style="color:${n<=val?'#f5a300':'#d4d6db'}">${ico('star',34,n<=val)}</button>`).join('')}</div>`}
async function sendRate(id){const r=rt0(id),o=TLB.order(id);if(!r.s&&!r.d){alert(t('rateNeed'));return}
  const res=await TLB.rateOrder(id,r.s||null,o&&o.driver?(r.d||null):null,r.c);if(res&&res.error){alert(t('err_'+res.error));return}render()}
function rateCard(o){const done=TLB.ratingOf(o.id);
  if(done){const low=(done.store_stars&&done.store_stars<=3)||(done.driver_stars&&done.driver_stars<=3);return `<div class="card"><h3>${t('rateThanks')}</h3><div class="rg" style="gap:16px;margin-top:8px;flex-wrap:wrap">${done.store_stars?`<span class="xs mut">${t('rateStore')} <b style="color:#f5a300">${'★'.repeat(done.store_stars)}${'☆'.repeat(5-done.store_stars)}</b></span>`:''}${done.driver_stars?`<span class="xs mut">${t('rateDrv')} <b style="color:#f5a300">${'★'.repeat(done.driver_stars)}${'☆'.repeat(5-done.driver_stars)}</b></span>`:''}</div>${low?`<div class="sm mut" style="margin-top:10px">${t('rateLow')}</div>`:''}</div>`}
  const r=rt0(o.id);
  return `<div class="card"><h3 style="margin-bottom:10px">${t('rateT')}</h3><div class="b6 sm">${t('rateStore')} · ${esc(o.store)}</div>${stars(o.id,'s',r.s)}
  ${o.driver?`<div class="b6 sm" style="margin-top:6px">${t('rateDrv')} · ${esc(o.driverName)}</div>${stars(o.id,'d',r.d)}`:''}
  <div class="b6 sm" style="margin:10px 0 6px">${t('rateCmt')}</div><textarea class="fld" id="rc" maxlength="300" placeholder="${t('rateCmtPh')}" oninput="rt0(${o.id}).c=this.value">${esc(r.c)}</textarea>
  <button class="btn big" style="margin-top:12px" onclick="sendRate(${o.id})">${t('rateSend')}</button></div>`}
function receipt(o,done){const lines=(o.items||[]).map(i=>`<div class="li"><span>${i.qty}× ${esc(i.name)}${i.note?`<div class="nt">${esc(i.note)}</div>`:''}</span><span class="b6">${Math.round(i.qty*i.price*100)/100} TJS</span></div>`).join('');
  return `<div class="card"><div class="dn"><span class="ok ${done?'':'bad'}">${ico(done?'check':'trash',22)}</span><div style="flex:1;min-width:0"><b style="font-size:17px">${t(done?'trk_delivered':'trk_'+o.status)}</b><div class="xs mut" style="margin-top:2px">${fmtD(o.doneAt||o.createdAt)}</div></div><span class="pill ${o.status}">${t('trk_'+o.status)}</span></div></div>
  <div class="card rcp"><h3 style="margin-bottom:6px">${t('recT')}</h3>${lines||'<div class="sm mut">—</div>'}</div>
  <div class="card sum"><div class="row"><span>${t('sub')}</span><span>${o.subtotal} TJS</span></div>${o.discount>0?`<div class="row" style="color:var(--ok)"><span>${t('discS')}</span><span>−${o.discount} TJS</span></div>`:''}${o.promoDiscount>0?`<div class="row" style="color:var(--ok)"><span>${t('promoLine')} ${esc(o.promoCode)}</span><span>−${o.promoDiscount} TJS</span></div>`:''}<div class="row"><span>${t('deliv')}</span><span>${o.delivery} TJS</span></div>${o.tip>0?`<div class="row"><span>${t('tip')}</span><span>${o.tip} TJS</span></div>`:''}<div class="row"><span>${t('payM')}</span><span class="b6">${esc(t(o.payment))}</span></div><div class="row tot"><span>${t('total')}</span><span>${o.total} TJS</span></div></div>`}
function vTrack(){const o=TLB.order(S.tid);if(!o)return vOrders();
  const dead=o.status=='rejected'||o.status=='cancelled',done=o.status=='delivered';
  if(done||dead)return topbar(`${t('orderN')} #${o.id}`,esc(o.store),"go('orders')")+`<div class="pg">${done?rateCard(o):''}${receipt(o,done)}<button class="btn big" onclick="reorder(${o.id})">${t('reorder')}</button></div>`;
  const n={pending:0,preparing:1,ready:1,pickedup:2}[o.status],live=['preparing','ready','pickedup'].includes(o.status),steps=['stp1','stp2','stp3','stp4'];
  return topbar(`${t('orderN')} #${o.id}`,esc(o.store),"go('orders')")+`<div class="pg">
  <div class="hero">${HERO}</div>
  <div style="text-align:center;margin-bottom:6px"><h1 style="font-size:20px">${t('trk_'+o.status)}</h1><p class="mut sm" style="margin-top:4px">${t('trk_'+o.status+'_s')}</p></div>
  <div class="card" style="margin-top:14px"><div class="tl">${steps.map((k,i)=>`<div class="st ${i<n?'on':i==n?'cur':''}"><i>${i<n?ico('check',13):''}</i>${t(k)}${i==0?`<div class="xs mut" style="font-weight:500;margin-top:2px">${fmtT(o.createdAt)}</div>`:''}</div>`).join('')}</div></div>
  ${o.driver?`<div class="card"><div class="cur-card"><div class="av">${esc(String(o.driverName||'?').charAt(0).toUpperCase())}</div><div style="flex:1;min-width:0"><b>${esc(o.driverName)}</b><div class="xs mut">${t('courier')}</div></div></div>
  <div class="chat" id="ch">${(o.chat||[]).map(m=>`<div class="m ${m.s=='client'?'me':''}">${TLB.fmtMsg(m.t)}</div>`).join('')}</div>
  ${live?`<div class="rg"><input class="fld" type="text" id="ci" maxlength="200" placeholder="${t('chatH')}"><button class="ib" style="box-shadow:none;background:#f1f1f4" onclick="sendLoc()" aria-label="${t('sendLoc')}">${ico('pin',18)}</button><button class="btn sm" onclick="sendChat()">${t('send')}</button></div>`:''}</div>`:''}
  <div class="card sum"><div class="row"><span>${t('payM')}</span><span class="b6">${esc(t(o.payment))}</span></div><div class="row tot"><span>${t('total')}</span><span>${o.total} TJS</span></div></div>
  ${o.status=='pending'?`<button class="btn s big" onclick="cancelO()">${t('cancelO')}</button>`:''}</div>`}
/* ---------- FAVORITES / OFFERS / PROFILE ---------- */
function vFav(){const l=STORES.filter(isFavS);return topbar(t('fav'),'',"go('home')")+`<div class="pg">${l.length?l.map(s=>storeRow(s)).join(''):emptyV(t('favEmptyT'),t('favEmptyS'))}</div>`}
function vPromo(){const o=STORES.filter(s=>s.disc>0).sort((a,b)=>b.disc-a.disc),f=STORES.filter(s=>s.ft=='free'||s.ffd);
  return topbar(t('promoTab'),t('promoTabS'),"go('home')")+`<div class="pg">${o.length||f.length?`${o.length?`<h3 style="margin:0 4px 12px">${t('bestOffers')}</h3>${o.map(s=>storeRow(s)).join('')}`:''}${f.length?`<h3 style="margin:18px 4px 12px">${t('freeS')}</h3>${f.map(s=>storeRow(s)).join('')}`:''}`:emptyV(t('noPromoT'),t('promoTabS'))}</div>`}
function vMe(){return `<div class="pg"><div class="card" style="display:flex;align-items:center;gap:16px"><div class="av2">${esc(String(ME.name||'?').charAt(0).toUpperCase())}</div><div style="min-width:0"><b style="font-size:19px">${esc(ME.name)}</b><div class="sm mut" style="margin-top:2px">${esc(ME.phone||'')}</div></div></div>
  <div class="card"><h3>${t('phoneL')}</h3><div class="pm"><input class="fld" type="tel" id="ph" value="${esc(ME.phone)}" placeholder="+992…" maxlength="16"><button class="btn" onclick="savePhone()">${t('phoneSave')}</button></div></div>
  <div class="card" style="padding:2px 16px"><div class="lr" onclick="go('orders')"><span class="ic">${ico('receipt',22)}</span><span>${t('histL')}</span>${ico('chev',18)}</div><div class="lr" onclick="go('fav')"><span class="ic">${ico('heart',22)}</span><span>${t('fav')}</span>${ico('chev',18)}</div>
  <div class="lr"><span class="ic">${ico('globe',22)}</span><span>${t('langL')}</span><div class="seg"><button class="${TLB.lang()=='ru'?'on':''}" onclick="TLB.setLang('ru')">RU</button><button class="${TLB.lang()=='en'?'on':''}" onclick="TLB.setLang('en')">EN</button></div></div></div>
  <button class="btn s big" onclick="TLB.logout()">${ico('out',20)} ${t('logout')}</button><p class="xs mut" style="text-align:center;margin-top:16px">${t('note')}</p></div>`}
/* ---------- RENDER ---------- */
function render(){
  if(S.v=='menu'&&!TLB.isOpen(S.store)){S.v='home';TLB.toast&&TLB.toast(t('closedMsg'),true)}
  if(S.v=='track'&&TLB.unread(S.tid))setTimeout(()=>TLB.markRead(S.tid),0);
  const V={home:vHome,cat:vCat,menu:vMenu,cart:vCart,pay:vPay,done:vDone,orders:vOrders,track:vTrack,fav:vFav,promo:vPromo,me:vMe}[S.v]();
  const full=['cart','pay','done'].includes(S.v),nav=['home','orders','fav','promo','me'],ni={home:'home',orders:'receipt',fav:'heart',promo:'tag',me:'user'},un=TLB.totalUnread();
  const n=cartCount(),bar=n&&['home','menu','cat','fav','promo'].includes(S.v)?`<div class="bar" onclick="goCart()" role="button"><span class="n">${n}</span><span class="l">${t('cartBarL')}</span><span class="p">${calc().total} TJS</span></div>`:'';
  const on=k=>S.v==k||(k=='home'&&['cat','menu'].includes(S.v))||(k=='orders'&&S.v=='track');
  const navH=full?'':`<div class="nav">${nav.map(k=>`<div class="${on(k)?'on':''}" onclick="${k=='home'?"S.q='';":''}go('${k}')">${ico(ni[k],24)}${t(k=='promo'?'promoTab':k)}${k=='orders'&&un?`<span class="bdg">${un}</span>`:''}</div>`).join('')}</div>`;
  const a=document.activeElement,kid=a&&['ci','sq','cq','ph','pc','mq','nt','rc'].includes(a.id)?a.id:null,keep=kid?a.value:null;
  $('app').innerHTML=V+bar+navH;
  if(kid&&$(kid)){const e=$(kid);e.value=keep;e.focus();e.setSelectionRange(keep.length,keep.length)}
  const ch=$('ch');if(ch)ch.scrollTop=ch.scrollHeight;rotRestore();menuAfter();
  if(document.body&&document.body.style)document.body.style.paddingBottom=full?'0px':bar?'calc(150px + env(safe-area-inset-bottom,0px))':'calc(84px + env(safe-area-inset-bottom,0px))'}
TLB.start('customer',me=>{ME={name:me.name,phone:me.phone};TLB.chrome(false);syncStores();TLB.on(()=>{syncStores();render()});render()});
</script></body></html>
