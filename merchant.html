<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://dzydscryrnahnneydnry.supabase.co wss://dzydscryrnahnneydnry.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Talabat — Merchant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f8;color:#333;padding:28px 14px 30px}
.w{max-width:800px;margin:0 auto}
.top{background:#2d3748;color:#fff;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.top select{background:#4a5568;color:#fff;border:0;border-radius:6px;padding:5px;font-size:13px;font-weight:700;max-width:190px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;border:0;background:#e2e8f0;border-radius:8px;padding:10px 4px;font-weight:700;font-size:12px;color:#4a5568;cursor:pointer}.tabs .on{background:#ff5a00;color:#fff}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.items{background:#f8fafc;border-radius:8px;padding:9px;margin:9px 0;font-size:13px}.items div{display:flex;justify-content:space-between;margin-bottom:3px}
.note{font-size:11px;color:#e74c3c;font-style:italic}
.b{border:0;border-radius:8px;padding:10px 14px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;background:#ff5a00}
.b.g{background:#27ae60}.b.r{background:#e74c3c}.b.s{background:#2980b9;width:100%;margin-top:9px}.b.o{background:#e67e22}
.tm{flex:1;border:0;background:#e2e8f0;border-radius:6px;padding:6px;font-weight:700;font-size:11px;cursor:pointer}.tm.on{background:#2d3748;color:#fff}
input[type=text],input[type=number]{width:100%;padding:10px;margin-bottom:9px;border:1px solid #cbd5e0;border-radius:8px;font-size:14px}
.thumb{width:50px;height:50px;border-radius:8px;object-fit:cover;background:#e2e8f0}
.k{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;text-align:center;flex:1}.k b{font-size:19px;color:#ff5a00;display:block}.k span{font-size:11px;color:#718096}
.bar{width:36px;border-radius:6px 6px 0 0;margin:0 auto}
</style></head><body><div class="w" id="app"></div>
<script>window.onerror=function(m,s,l){var d=document.createElement('div');d.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#e74c3c;color:#fff;font:12px monospace;padding:8px;word-break:break-all';d.textContent='ERR: '+m+' @'+String(s||'').split('/').pop()+':'+l;(document.body||document.documentElement).appendChild(d)};window.addEventListener('unhandledrejection',function(e){window.onerror('Promise: '+(e.reason&&e.reason.message||e.reason),'',0)})</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="talabat-core.js?v=13"></script>
<script>
TLB.addDict({mOrders:'Заказы',mMenu:'Меню',mStats:'Аналитика',live:'Активные заказы',noAct:'Нет активных заказов',prep:'Время приготовления',acc:'Принять ✓',rej:'Отклонить ✕',rdy:'Готов к выдаче 📦',withC:'Передан курьеру — ждём доставку',waitC:'Ждём курьера',pay:'Оплата',open:'ОНЛАЙН',shut:'ЗАКРЫТО',addD:'Добавить блюдо',nm:'Название блюда',pr:'Цена, TJS',hit:'🌟 Хит продаж',photo:'📷 Фото из галереи',addB:'Добавить в меню',stop:'В стоп-лист',on:'Включить',del:'Удалить',avail:'Доступно',stopped:'В стоп-листе',fill:'Заполните название и цену',dD:'День',dW:'Неделя',dM:'Месяц',dY:'Год',done:'Выполнено',rejd:'Отклонено',rev:'Выручка',hist:'История',noH:'Пока пусто',sto:'Магазин',mSt:'Профиль',stCover:'📷 Изменить обложку',stDesc:'Описание магазина',mDisc:'Скидка магазина, %',mDiscMax:'Максимум (задаёт администрация):',secL:'Раздел меню',secPh:'Например: Бургеры, Напитки',itDis:'Скидка на блюдо, %',itDisMax:'не больше',stSave:'Сохранить'},
{mOrders:'Orders',mMenu:'Menu',mStats:'Analytics',live:'Active orders',noAct:'No active orders',prep:'Prep time',acc:'Accept ✓',rej:'Reject ✕',rdy:'Ready for pickup 📦',withC:'Handed to courier — awaiting delivery',waitC:'Waiting for courier',pay:'Payment',open:'ONLINE',shut:'CLOSED',addD:'Add item',nm:'Item name',pr:'Price, TJS',hit:'🌟 Bestseller',photo:'📷 Photo from gallery',addB:'Add to menu',stop:'Stop-list',on:'Enable',del:'Delete',avail:'Available',stopped:'In stop-list',fill:'Enter name and price',dD:'Day',dW:'Week',dM:'Month',dY:'Year',done:'Completed',rejd:'Rejected',rev:'Revenue',hist:'History',noH:'Nothing yet',sto:'Store',mSt:'Profile',stCover:'📷 Change cover photo',stDesc:'Store description',mDisc:'Store discount, %',mDiscMax:'Maximum (set by admin):',secL:'Menu section',secPh:'e.g. Burgers, Drinks',itDis:'Item discount, %',itDisMax:'max',stSave:'Save'});
const t=TLB.t,esc=TLB.esc,$=id=>document.getElementById(id);
let STORE='',tab='o',per='dD',img='',lastN=-1;
const ACT=['pending','preparing','ready','pickedup'];
const act=()=>TLB.orders(o=>o.store==STORE&&ACT.includes(o.status));
const past=()=>TLB.orders(o=>o.store==STORE&&['delivered','rejected','cancelled'].includes(o.status));
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.4].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.3);o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.3)})}catch(e){}}
document.addEventListener('click',()=>{},{once:true});
const setTab=x=>{tab=x;render()};
const setStore=v=>{STORE=v;localStorage.setItem('tlb_mstore',v);lastN=-1;render()};
const st=async(id,s)=>{const r=await TLB.setStatus(id,s);if(r.error)alert(t('err_'+r.error))};
const tog=id=>{const i=TLB.getMenu(STORE).find(x=>x.id==id);if(i)TLB.updateItem(id,{available:!i.available})};
const del=id=>{if(confirm('OK?'))TLB.deleteItem(id)};
function pick(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=200/Math.max(im.width,im.height,200);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.7);$('pv').src=img;$('pv').style.display='block'};im.src=ev.target.result};r.readAsDataURL(f)}
function addItem(){const n=$('nn').value.trim(),p=parseFloat($('np').value);if(!n||!(p>0)){alert(t('fill'));return}
  const pop=$('nh').checked,im=img;TLB.addItem(STORE,{name:n.slice(0,60),price:p,image:im,popular:pop,section:$('nsec').value,discount:$('ndis').value});img=''}
function setDisc(id,v,mx){const n=+v;if(!isFinite(n)||n<0||n>mx){alert(t('err_discount_over_max'));render();return}TLB.updateItem(id,{discount_pct:n})}
function setSec(id,v){TLB.updateItem(id,{section:v})}
function vOrders(){const l=act();
  return `<h3 style="margin-bottom:10px">${t('live')}</h3>${l.length?l.map(o=>`<div class="card"><div class="row"><b>#${o.id}</b><b style="color:#ff5a00">${o.total} TJS</b></div>
  <p style="font-size:12px;color:#718096">${t('pay')}: ${esc(t(o.payment))} • ${esc(o.client.name)}</p>
  <div class="items">${o.items.map(i=>`<div><span>${i.qty}× ${esc(i.name)}</span><span>${i.qty*i.price}</span></div>${i.note?`<div class="note">💬 ${esc(i.note)}</div>`:''}`).join('')}</div>
  <p style="font-weight:700;font-size:12px;color:#2980b9">${t(o.status)}${o.status!='pending'?' ('+o.prepTime+' min)':''}</p>
  ${o.status=='pending'||o.status=='preparing'?`<p style="font-size:11px;color:#718096;margin:6px 0 4px">${t('prep')}</p><div class="row">${[15,30,45].map(m=>`<button class="tm ${o.prepTime==m?'on':''}" onclick="TLB.patch(${o.id},{prepTime:${m}})">${m} min</button>`).join('')}</div>`:''}
  ${o.status=='pending'?`<div class="row" style="margin-top:10px"><button class="b g" style="flex:2" onclick="st(${o.id},'preparing')">${t('acc')}</button><button class="b r" style="flex:1" onclick="st(${o.id},'rejected')">${t('rej')}</button></div>`:''}
  ${o.status=='preparing'?`<button class="b s" onclick="st(${o.id},'ready')">${t('rdy')}</button>`:''}
  ${o.status=='ready'?`<p style="margin-top:8px;font-size:12px">${o.driver?'🛵 '+esc(o.driverName):t('waitC')}</p>`:''}
  ${o.status=='pickedup'?`<p style="margin-top:8px;font-size:12px;color:#27ae60">${t('withC')}</p>`:''}</div>`).join(''):`<div class="card">${t('noAct')}</div>`}`}
function vMenu(){const m=TLB.getMenu(STORE),stx=TLB.myStores().find(x=>x.name==STORE)||{},mx=stx.max_discount_pct==null?30:+stx.max_discount_pct;
  return `<div class="card"><b>${t('addD')}</b><div style="height:9px"></div><input type="text" id="nn" placeholder="${t('nm')}"><input type="number" id="np" placeholder="${t('pr')}"><input type="text" id="nsec" list="secs" maxlength="40" placeholder="${t('secPh')}"><input type="number" id="ndis" min="0" max="${mx}" step="1" value="0" placeholder="${t('itDis')}"><small style="display:block;margin:-4px 0 8px;color:#718096">${t('itDis')} (${t('itDisMax')} ${mx}%)</small>
  <label style="display:block;margin-bottom:9px"><input type="checkbox" id="nh"> ${t('hit')}</label>
  <label style="display:block;background:#edf2f7;border:1px dashed #cbd5e0;padding:10px;text-align:center;border-radius:8px;margin-bottom:9px;font-size:12px;font-weight:700">${t('photo')}<input type="file" accept="image/*" style="display:none" onchange="pick(event)"></label>
  <img id="pv" class="thumb" style="display:none;margin-bottom:9px"><button class="b g" style="width:100%" onclick="addItem()">${t('addB')} ➕</button></div>
  <datalist id="secs">${[...new Set(m.map(i=>i.section).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  ${m.map(i=>`<div class="card row"><img class="thumb" src="${esc(i.image)}" alt=""><div style="flex:1"><b>${esc(i.name)}</b>${i.popular?' 🌟':''}<div style="color:#ff5a00;font-weight:700">${i.price} TJS</div><input type="text" id="sec_${i.id}" list="secs" maxlength="40" value="${esc(i.section||'')}" placeholder="${t('secL')}" style="margin:4px 0;padding:6px 8px;font-size:12px" onchange="setSec('${i.id}',this.value)"><div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#718096"><span>${t('itDis')}</span><input type="number" id="dis_${i.id}" min="0" max="${mx}" step="1" value="${+i.discount||0}" style="margin:0;padding:5px 8px;width:70px;font-size:12px" onchange="setDisc('${i.id}',this.value,${mx})"></div><div style="font-size:11px;font-weight:700;color:${i.available?'#27ae60':'#e74c3c'}">${i.available?t('avail'):t('stopped')}</div></div>
  <div style="display:flex;flex-direction:column;gap:5px"><button class="b ${i.available?'o':'g'}" onclick="tog('${i.id}')">${i.available?t('stop'):t('on')}</button><button class="b r" onclick="del('${i.id}')">${t('del')}</button></div></div>`).join('')}`}
function vStats(){const D=864e5,sp={dD:D,dW:7*D,dM:30*D,dY:365*D}[per],p=past().filter(o=>Date.now()-o.doneAt<sp);
  const ok=p.filter(o=>o.status=='delivered'),no=p.length-ok.length,rev=ok.reduce((s,o)=>s+o.subtotal-o.discount,0),mx=Math.max(ok.length,no,1);
  return `<div class="row" style="margin-bottom:10px">${['dD','dW','dM','dY'].map(k=>`<button class="tm ${per==k?'on':''}" onclick="per='${k}';render()">${t(k)}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:12px"><div class="k"><b>${ok.length}</b><span>${t('done')}</span></div><div class="k"><b>${rev} TJS</b><span>${t('rev')}</span></div></div>
  <div class="card row" style="align-items:flex-end;height:150px"><div style="flex:1;text-align:center"><div class="bar" style="background:#27ae60;height:${Math.max(6,ok.length/mx*90)}px"></div><small>${t('done')} (${ok.length})</small></div><div style="flex:1;text-align:center"><div class="bar" style="background:#e74c3c;height:${Math.max(6,no/mx*90)}px"></div><small>${t('rejd')} (${no})</small></div></div>
  <h3 style="margin:6px 0 10px">${t('hist')}</h3>${past().length?past().map(o=>`<div class="card row"><span>#${o.id}</span><span style="color:${o.status=='delivered'?'#27ae60':'#e74c3c'};font-weight:700">${t(o.status)}</span><b>${o.total} TJS</b></div>`).join(''):`<div class="card">${t('noH')}</div>`}`}
function rz(fl,w,q,cb){const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,w/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=ev.target.result};r.readAsDataURL(fl)}
async function upd(f){const r=await TLB.updateMyStore(STORE,f);if(r.error)alert(t('err_'+r.error))}
function coverPick(e){const fl=e.target.files[0];if(fl)rz(fl,640,.7,d=>upd({cover:d}))}
async function saveDisc(mx){const v=+$('sdis').value;if(!isFinite(v)||v<0||v>mx){alert(t('err_discount_over_max'));return}const r=await TLB.setMyDiscount(STORE,v);if(r.error)alert(t('err_'+r.error))}
function saveDesc(){upd({description:$('sdesc').value.trim()})}
function vStore(){const s=TLB.myStores().find(x=>x.name==STORE);if(!s)return '';const mx=s.max_discount_pct==null?30:+s.max_discount_pct;
  return `<div class="card"><b>${esc(s.name)}</b>${s.cover_url?`<img src="${esc(s.cover_url)}" style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin:10px 0" alt="">`:'<div style="height:10px"></div>'}
  <label style="display:block;background:#edf2f7;border:1px dashed #cbd5e0;padding:10px;text-align:center;border-radius:8px;margin-bottom:9px;font-size:12px;font-weight:700">${t('stCover')}<input type="file" accept="image/*" style="display:none" onchange="coverPick(event)"></label>
  <small style="color:#718096">${t('stDesc')}</small><input type="text" id="sdesc" value="${esc(s.description||'')}"><button class="b g" style="width:100%" onclick="saveDesc()">${t('stSave')}</button></div>
  <div class="card"><b>${t('mDisc')}</b><small style="display:block;color:#718096;margin:4px 0 8px">${t('mDiscMax')} ${mx}%</small><div style="display:flex;gap:6px"><input type="number" id="sdis" min="0" max="${mx}" step="1" value="${+s.discount_pct||0}" style="margin:0;flex:1"><button class="b g" style="width:auto;margin:0" onclick="saveDisc(${mx})">${t('stSave')}</button></div></div>`}
function render(){
  const stores=TLB.myStores().map(s=>s.name);if(!stores.includes(STORE))STORE=stores[0]||'';const open=TLB.isOpen(STORE),n=act().filter(o=>o.status=='pending').length;
  if(lastN>=0&&n>lastN)beep();lastN=n;
  $('app').innerHTML=`<div class="top"><div><small>${t('sto')}</small><br><select onchange="setStore(this.value)">${stores.map(s=>`<option ${s==STORE?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
  <button class="b ${open?'g':'r'}" onclick="TLB.setOpen(STORE,${!open})">${open?'🟢 '+t('open'):'🔴 '+t('shut')}</button></div>
  <div class="tabs">${[['o','📥 '+t('mOrders')+(n?' ('+n+')':'')],['m','🍔 '+t('mMenu')],['s','📊 '+t('mStats')],['p','🏪 '+t('mSt')]].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join('')}</div>`+({o:vOrders,m:vMenu,s:vStats,p:vStore}[tab])()}
TLB.start('merchant',()=>{TLB.on(()=>{if((tab=='m'||tab=='p')&&document.activeElement&&/^(nn|np|nsec|ndis|sdesc|sdis|sec_.*|dis_.*)$/.test(document.activeElement.id))return;render()});render()});
</script></body></html>
