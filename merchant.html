function vOrders(){const l=act(),nw=l.filter(o=>o.status=='pending'),wk=l.filter(o=>o.status!='pending');
  const card=o=>`<div class="card ${o.status=='pending'?'new':''}"><div class="row"><div><b style="font-size:17px">#${o.id}</b><div class="xs mut">${esc(o.client.name)} · ${esc(t(o.payment))}</div></div><div style="text-align:right"><b style="color:var(--o);font-size:17px">${o.total} TJS</b><div style="margin-top:4px">${stPill(o.status)}${o.status!='pending'?` <span class="xs mut">${o.prepTime} min</span>`:''}</div></div></div>
  <div class="items">${o.items.map(i=>`<div><span>${i.qty}× ${esc(i.name)}</span><span>${i.qty*i.price}</span></div>${(i.opts&&i.opts.length)?`<div class="opt2">${esc(i.opts.map(x=>x.n).join(', '))}</div>`:''}${i.note?`<div class="note">💬 ${esc(i.note)}</div>`:''}`).join('')}</div>
  ${o.status=='pending'||o.status=='preparing'?`<div class="xs mut" style="margin-bottom:6px">${t('prep')}</div><div class="seg">${[15,30,45].map(m=>`<button class="${o.prepTime==m?'on':''}" onclick="TLB.patch(${o.id},{prepTime:${m}})">${m} min</button>`).join('')}</div>`:''}
  ${o.status=='pending'?`<div class="row" style="margin-top:12px;gap:10px"><button class="b g" style="flex:2;height:46px" onclick="st(${o.id},'preparing')">${t('acc')}</button><button class="b r" style="flex:1;height:46px" onclick="st(${o.id},'rejected')">${t('rej')}</button></div>`:''}
  ${o.status=='preparing'?`<button class="b s" onclick="st(${o.id},'ready')">${t('rdy')}</button>`:''}
  ${o.status=='ready'?`<div class="info">${o.driver?'🛵 '+esc(o.driverName):t('waitC')}</div>`:''}${o.status=='pickedup'?`<div class="info ok">${t('withC')}</div>`:''}</div>`;
  return l.length?`${nw.length?`<h3>${t('newO')} · ${nw.length}</h3>${nw.map(card).join('')}`:''}${wk.length?`<h3>${t('inWork')} · ${wk.length}</h3>${wk.map(card).join('')}`:''}`:`<div class="card empty">${t('noAct')}</div>`}
function vMenu(){const all=TLB.getMenu(STORE),q=mq.trim().toLowerCase(),m=q?all.filter(i=>i.name.toLowerCase().includes(q)):all;
  const g={},ord=[];m.forEach(i=>{const k=i.section||'';if(!g[k]){g[k]=[];ord.push(k)}g[k].push(i)});
  const row=i=>`<div class="mr" onclick="openSheet('${i.id}')"><div class="th">${i.image?`<img src="${esc(i.image)}" alt="">`:''}</div><div class="mt2"><div class="nm">${esc(i.name)}${i.popular?` <span style="color:#f5a300">${SVG(I.star,13)}</span>`:''}</div><div class="pr">${+i.discount>0?`<b>${Math.round(i.price*(100-i.discount))/100} TJS</b> <s>${i.price}</s> <span class="dc">−${+i.discount}%</span>`:`<b>${i.price} TJS</b>`}</div><div class="xs ${i.available?'ok':'bad'}">${i.available?t('avail'):t('soldOut')}</div></div>
  <button class="sw ${i.available?'on':''}" onclick="event.stopPropagation();tog('${i.id}')" aria-label="${t('inStock')}"><i></i></button></div>`;
  return `<div class="rg" style="gap:10px;margin-bottom:14px"><label class="sbx">${SVG(I.search,18)}<input type="search" id="mqs" placeholder="${t('searchM')}" value="${esc(mq)}" oninput="mq=this.value;render()"></label><button class="b" style="flex-shrink:0;display:flex;align-items:center;gap:6px;height:46px" onclick="openSheet()">${SVG(I.plus,18)} ${t('addNew')}</button></div>
  ${m.length?ord.map(k=>`<div class="sec"><div class="sh">${k?esc(k):t('secNone')} <span class="xs mut">${g[k].length}</span></div><div class="card" style="padding:4px 14px">${g[k].map(row).join('')}</div></div>`).join(''):`<div class="card empty">${all.length?t('noRes')||'—':t('noItems')}</div>`}`}
function sheet(){if(!SH)return '';const secs=[...new Set(TLB.getMenu(STORE).map(i=>i.section).filter(Boolean))],mx=MX();
  return `<div class="ov" onclick="closeSheet()"><div class="md" onclick="event.stopPropagation()"><div class="row" style="margin-bottom:12px"><h3 style="margin:0">${SH.id?t('editD'):t('addD')}</h3><button class="rb" onclick="closeSheet()" aria-label="${t('closeB')}">${SVG(I.x,18)}</button></div>
  <label class="photo">${SH.image?`<img src="${esc(SH.image)}" alt="">`:`<span>${SVG(I.cam,26)}<br>${t('photoAdd')}</span>`}<input type="file" accept="image/*" style="display:none" onchange="shPick(event)"></label>
  ${SH.image?`<div class="xs mut" style="text-align:center;margin:-4px 0 10px">${t('photoCh')}</div>`:''}
  <label class="fl">${t('nm')}<input type="text" id="sn" maxlength="60" value="${esc(SH.name)}" oninput="shSet('name',this.value)"></label>
  <div class="rg" style="gap:10px"><label class="fl" style="flex:1">${t('pr')}<input type="number" id="sp" min="0" step="0.5" value="${esc(SH.price)}" oninput="shSet('price',this.value)"></label><label class="fl" style="flex:1">${t('itDis')} (≤${mx})<input type="number" id="sdisc" min="0" max="${mx}" step="1" value="${esc(SH.disc)}" oninput="shSet('disc',this.value)"></label></div>
  <label class="fl">${t('secL')}<input type="text" id="ssec" maxlength="40" value="${esc(SH.section)}" placeholder="${t('secPh')}" oninput="shSet('section',this.value)"></label>
  ${secs.length?(SECL=secs,`<div class="chs">${secs.map((s,i)=>`<span class="ch" onclick="pickSec(${i})">${esc(s)}</span>`).join('')}</div>`):''}
  ${optEditor()}
  <div class="row" style="padding:10px 0"><span class="b6">${t('hitL')}</span><button class="sw ${SH.pop?'on':''}" onclick="SH.pop=!SH.pop;render()" aria-label="${t('hitL')}"><i></i></button></div>
  <button class="b s" onclick="saveSheet()">${t('saveB')}</button>${SH.id?`<button class="b r" style="width:100%;margin-top:10px;height:46px" onclick="delItem()">${t('delItem')}</button>`:''}</div></div>`}
function vStats(){const D=864e5,sp={dD:D,dW:7*D,dM:30*D,dY:365*D}[per],p=past().filter(o=>Date.now()-o.doneAt<sp);
  const ok=p.filter(o=>o.status=='delivered'),no=p.length-ok.length,rev=ok.reduce((s,o)=>s+o.subtotal-o.discount,0),mx=Math.max(ok.length,no,1);
  return `<div class="row" style="margin-bottom:10px">${['dD','dW','dM','dY'].map(k=>`<button class="tm ${per==k?'on':''}" onclick="per='${k}';render()">${t(k)}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:12px"><div class="k"><b>${ok.length}</b><span>${t('done')}</span></div><div class="k"><b>${rev} TJS</b><span>${t('rev')}</span></div></div>
  <div class="card row" style="align-items:flex-end;height:150px"><div style="flex:1;text-align:center"><div class="bar" style="background:#27ae60;height:${Math.max(6,ok.length/mx*90)}px"></div><small>${t('done')} (${ok.length})</small></div><div style="flex:1;text-align:center"><div class="bar" style="background:#e74c3c;height:${Math.max(6,no/mx*90)}px"></div><small>${t('rejd')} (${no})</small></div></div>
  <h3 style="margin:6px 0 10px">${t('hist')}</h3>${past().length?past().map(o=>`<div class="card row"><span>#${o.id}</span><span style="color:${o.status=='delivered'?'#27ae60':'#e74c3c'};font-weight:700">${t(o.status)}</span><b>${o.total} TJS</b></div>`).join(''):`<div class="card">${t('noH')}</div>`}`}
function rz(fl,w,q,cb){const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,w/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=ev.target.result};r.readAsDataURL(fl)}
async function upd(f){const r=await TLB.updateMyStore(STORE,f);if(r.error)alert(t('err_'+r.error))}
function coverPick(e){const fl=e.target.files[0];if(fl)rz(fl,960,.72,d=>upd({cover:d}))}
function logoPick(e){const fl=e.target.files[0];if(fl)rz(fl,320,.85,d=>upd({logo:d}))}
async function saveDisc(mx){const v=+$('sdis').value;if(!isFinite(v)||v<0||v>mx){alert(t('err_discount_over_max'));return}const r=await TLB.setMyDiscount(STORE,v);if(r.error)alert(t('err_'+r.error))}
function saveDesc(){upd({description:$('sdesc').value.trim()})}
function vStore(){const s=TLB.myStores().find(x=>x.name==STORE);if(!s)return '';const mx=s.max_discount_pct==null?30:+s.max_discount_pct;
  return `<div class="card"><div class="row" style="margin-bottom:12px"><b style="font-size:17px">${esc(s.name)}</b></div>
  <div class="xs mut" style="margin-bottom:12px">${t('stImgHint')}</div>
  <div class="stimg"><div class="lgp">${s.logo_url?`<img src="${esc(s.logo_url)}" alt="">`:`<span>${esc(String(s.name||'?').charAt(0).toUpperCase())}</span>`}</div>
  <div style="flex:1"><div class="b6">${t('stLogo')}</div><label class="up">${SVG(I.cam,18)} ${t('stLogoCh')}<input type="file" accept="image/*" style="display:none" onchange="logoPick(event)"></label></div></div>
  <div class="b6" style="margin:16px 0 8px">${t('stCoverT')}</div>
  <div class="cvp">${s.cover_url?`<img src="${esc(s.cover_url)}" alt="">`:`<span>${SVG(I.cam,28)}</span>`}</div>
  <label class="up" style="margin-top:10px">${SVG(I.cam,18)} ${t('stCoverCh')}<input type="file" accept="image/*" style="display:none" onchange="coverPick(event)"></label></div>
  <div class="xs mut" style="text-align:center;margin:0 0 12px">${t('verL')} ${esc(TLB.version||'')}</div>
  <div class="card"><label class="fl">${t('stDesc')}<input type="text" id="sdesc" maxlength="300" value="${esc(s.description||'')}"></label><button class="b s" onclick="saveDesc()">${t('stSave')}</button></div>
  <div class="card"><b>${t('mDisc')}</b><div class="xs mut" style="margin:4px 0 10px">${t('mDiscMax')} ${mx}%</div><div class="rg" style="gap:8px"><input type="number" id="sdis" min="0" max="${mx}" step="1" value="${+s.discount_pct||0}" style="margin:0;flex:1"><button class="b" style="flex-shrink:0;height:46px" onclick="saveDisc(${mx})">${t('stSave')}</button></div></div>`}
function render(){
  const stores=TLB.myStores().map(s=>s.name);if(!stores.includes(STORE))STORE=stores[0]||'';const open=TLB.isOpen(STORE),n=act().filter(o=>o.status=='pending').length;
  if(lastN>=0&&n>lastN)beep();lastN=n;
  $('app').innerHTML=`<div class="top"><div style="min-width:0"><small>${t('sto')}</small><select onchange="setStore(this.value)">${stores.map(s=>`<option ${s==STORE?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
  <button class="swb ${open?'on':''}" onclick="TLB.setOpen(STORE,${!open})"><i></i><span>${open?t('open'):t('shut')}</span></button></div>
  <div class="tabs">${[['o',t('mOrders')+(n?' · '+n:'')],['m',t('mMenu')],['s',t('mStats')],['p',t('mSt')]].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join('')}</div>`+({o:vOrders,m:vMenu,s:vStats,p:vStore}[tab])()+sheet();
  if(document.body&&document.body.style)document.body.style.overflow=SH?'hidden':''}
TLB.start('merchant',()=>{TLB.on(()=>{if(SH)return;if((tab=='m'||tab=='p')&&document.activeElement&&/^(mqs|sdesc|sdis)$/.test(document.activeElement.id))return;render()});render()});
</script></body></html>
