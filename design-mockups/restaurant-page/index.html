  });
}
function speedMinutes(s){
  const measured=TLB.speed?.(s.id);
  if(!measured||!(+measured.min>0))return null;
  const km=kmOf(s);
  return +measured.min+(km==null?10:Math.round(km*10)/10*3+5);
}
function sortAndFilter(list){
  syncLegacyRoute();
  let result=list.filter(({s})=>(!localFilter.disc||s.disc>0)
    &&(!localFilter.rate||s.rt>=4)
    &&(!localFilter.free||hasFreeDelivery(s))
    &&(!localFilter.fast||(speedMinutes(s)!=null&&speedMinutes(s)<=30)));
  const openOrder=(a,b)=>Number(TLB.isOpen(b.s.n))-Number(TLB.isOpen(a.s.n));
  const recommended=(a,b)=>((b.s.rt*Math.log(2+b.s.rc))-(a.s.rt*Math.log(2+a.s.rc)))||((kmOf(a.s)??99)-(kmOf(b.s)??99));
  const sorters={
    recommended:recommended,
    rating:(a,b)=>b.s.rt-a.s.rt||recommended(a,b),
    fastest:(a,b)=>(speedMinutes(a.s)??Infinity)-(speedMinutes(b.s)??Infinity)||recommended(a,b),
    cheap:(a,b)=>(Number.isFinite(a.s.fee)?a.s.fee:Infinity)-(Number.isFinite(b.s.fee)?b.s.fee:Infinity)||recommended(a,b)
  };
  return result.slice().sort((a,b)=>openOrder(a,b)||(sorters[sortMode]||recommended)(a,b));
}
function filtersView(){

    +'aria-pressed="'+localFilter[key]+'" onclick="TALABOT_RESTAURANTS_BRIEF30.filter(\''+key+'\')">'+esc(t(label))+'</button>';

        +esc(t(key))+(sortMode===id?ico('check',17):'')+'</button>').join('')
    +'</section></div>';

function rows(){
  const q=String(S.cq||'').trim().toLowerCase(),mine=d6Mine();

  if(chosenCuisine){const allowed=cuisineSource().find(c=>c.id===chosenCuisine)?.stores;
    list=list.filter(({s})=>allowed&&allowed.has(s.id));}
  if(S.fo)list=list.filter(({s})=>TLB.isOpen(s.n));
  if(S.srt==='free')list=list.filter(({s})=>hasFreeDelivery(s));
  if(S.srt==='disc')list=list.filter(({s})=>s.disc>0);
  if(S.srt==='rate')list=list.slice().sort((a,b)=>b.s.rt-a.s.rt);
  if(S.srt==='mine')list=list.filter(({s})=>s.n in mine).sort((a,b)=>mine[b.s.n]-mine[a.s.n]);
  list=rankedSearch(sortAndFilter(list));
  const filtered=q||chosenCuisine||S.fo||['free','disc','mine'].includes(S.srt)||Object.values(localFilter).some(Boolean);

/* AD-07: W-10 sponsored ranking is the existing rankedSearch() contract.
   Floating campaign only exists when an explicit manager field is present. */
let lastFloatScroll=0,floatFrame=0,floatObserver=null,floatObserved=null;
function floatingCampaign(){
  const selected=bannersAt('restaurants').find(b=>{
    const cfg=managedBannerConfig(b);
    return (cfg.floating===true||b.placement==='restaurants_float')
      &&(cfg.action==='campaign'||cfg.campaign);
  });
  if(!selected)return '';
  const text=selected.presentation?.floating_text?.[TLB.lang()]
    ||selected.title||'';
  if(!text)return '';
  return '<button type="button" class="ad30-float" '
    +'onclick="TALABOT_RESTAURANTS_BRIEF30.banner('+esc(JSON.stringify(selected.id))+')" '
    +'aria-label="'+esc(text)+'"><img src="'+A3('party-popper')+'" alt="" width="22" height="22">'
    +'<span>'+esc(text)+'</span></button>';
}
function layoutFloatingCampaign(){
  const button=document.querySelector('#app .ad30-float');
  if(!button){floatObserver?.disconnect();floatObserver=null;floatObserved=null;return;}
  const nav=document.querySelector('#app .nav'),bar=document.querySelector('#app .bar');
  if(floatObserved!==button){
    floatObserver?.disconnect();floatObserved=button;
    if(window.ResizeObserver){
      floatObserver=new ResizeObserver(queueFloatingLayout);
      for(const anchor of [nav,bar])if(anchor)floatObserver.observe(anchor);
    }
  }
  button.classList.remove('ready');button.style.display='';
  const edge=Math.min(nav?nav.getBoundingClientRect().top:innerHeight,bar?bar.getBoundingClientRect().top:innerHeight);
  button.style.bottom=Math.max(12,innerHeight-edge+12)+'px';
  const width=button.offsetWidth,height=button.offsetHeight;
  // Campaign authors supply the short floating_text. Never cut its copy in UI;
  // oversized copy remains available in the regular campaign banner instead.
  if(width>innerWidth*.92+1||button.scrollWidth>button.clientWidth+1){button.style.display='none';return;}
  const content=document.querySelector('#app .ad30-list .c01-list-content');
  content?.style.setProperty('--ad30-float-reserve',(height+12)+'px');
  const box={left:(innerWidth-width)/2,right:(innerWidth+width)/2,bottom:edge-12,top:edge-12-height};
  // Bottom padding gives scrolling room; this first-paint/scroll gate also
  // protects text mid-list without changing the accepted window scroll model.
  const collision=[...document.querySelectorAll('#app .ad30-card-copy,#app .ad30-list .empty')].some(node=>{
    const r=node.getBoundingClientRect();
    return box.left<r.right+4&&box.right>r.left-4&&box.top<r.bottom+4&&box.bottom>r.top-4;
  });
  button.classList.toggle('occluded',collision);button.classList.add('ready');
}
function queueFloatingLayout(){
  if(floatFrame)return;
  floatFrame=requestAnimationFrame(()=>{floatFrame=0;layoutFloatingCampaign()});
}
function onRestaurantScroll(){
  if(S.v!=='cat'||S.catKey!=='rest'){lastFloatScroll=scrollY||0;return;}
  const button=document.querySelector('#app .ad30-float');
  if(!button)return;
  const y=window.scrollY||document.documentElement.scrollTop||0;
  const diff=y-lastFloatScroll;
  if(Math.abs(diff)>8){button.classList.toggle('hidden',diff>0&&y>60);lastFloatScroll=y;}
  queueFloatingLayout();
}
window.addEventListener('scroll',onRestaurantScroll,{passive:true});
window.addEventListener('resize',queueFloatingLayout,{passive:true});
window.visualViewport?.addEventListener('resize',queueFloatingLayout,{passive:true});

function renderRestaurants(){
  lastFloatScroll=window.scrollY||0;
  queueFloatingLayout();
  return ad30Header(curAddr())+search()+rail()+againRail()
    +'<section class="ad30-list"><h2>'+esc(t('ad30All'))+'</h2>'+cuisineRail()+filtersView()+'<div class="pg c01-list-content">'+rows()+'</div></section>'+sortSheet()+floatingCampaign();
}
window.TALABOT_RESTAURANTS_BRIEF30={
  render:renderRestaurants,
  banner:function(id){managedBannerGo(id)},
  cuisine:toggleCuisine,
  cuisineImageFailed:hideFailedCuisine,
  filter:toggleFilter,
  reset:resetFilters,
  sort:setSort,
  sortOpen:function(){sortOpen=true;render()},
  sortClose:function(){sortOpen=false;render()}
};
})();

<script>
/* BRIEF-31 AG-05: presentation-only sheet height; selection/prices stay in the original handlers. */
(function(){
'use strict';
let root=null,active=null,frame=0,animation=0;
const clamp=x=>Math.max(0,Math.min(1,x));
const reduced=()=>window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
function cancelFrame(){if(frame)cancelAnimationFrame(frame);frame=0;if(animation)cancelAnimationFrame(animation);animation=0;}
function dimensions(sheet){
  const height=sheet.clientHeight||window.visualViewport?.height||innerHeight;
  const safe=parseFloat(getComputedStyle(sheet).getPropertyValue('--b31-safe-top'))||0;
  const large=Math.max(112,Math.min(176,height*.22));
  const small=Math.min(large,80+safe);
  return {large,small,travel:Math.max(1,large-small)};
}
function paint(sheet,progress,dims=dimensions(sheet)){
  if(!sheet?.isConnected||!S.sh)return;
  progress=clamp(progress);S.sh.sheetLift=progress;
  sheet.style.setProperty('--b31-photo-height',(dims.large-progress*dims.travel)+'px');
  const handle=sheet.querySelector('[data-dish-handle]');
  if(handle){
    const expanded=progress>=.5;
    handle.setAttribute('aria-expanded',String(expanded));
    handle.setAttribute('aria-label',t(expanded?'b31SheetCollapse':'b31SheetExpand'));
  }
}
function settle(sheet,target,instant=false){
  cancelFrame();if(!sheet?.isConnected||!S.sh)return;
  const state=S.sh,from=Number(state.sheetLift)||0,dims=dimensions(sheet);
  target=clamp(target);
  if(instant||reduced()||Math.abs(from-target)<.01){paint(sheet,target,dims);return;}
  let start;
  const tick=now=>{
    if(!sheet.isConnected||S.sh!==state){animation=0;return;}
    if(start===undefined)start=now;
    const time=Math.min(1,(now-start)/180),ease=1-Math.pow(1-time,3);
    paint(sheet,from+(target-from)*ease,dims);
    if(time<1)animation=requestAnimationFrame(tick);else animation=0;
  };
  animation=requestAnimationFrame(tick);
}
function stopDrag(event,cancelled=false){
  if(!active||event.pointerId!==active.id)return;
  const drag=active;active=null;cancelFrame();
  drag.handle.classList.remove('is-dragging');
  try{if(drag.handle.hasPointerCapture(drag.id))drag.handle.releasePointerCapture(drag.id);}catch(_e){}
  if(drag.moved){
    drag.handle.dataset.dragClick='1';
    const delta=drag.startY-drag.lastY;
    settle(drag.sheet,cancelled?drag.start:Math.abs(delta)>20?(delta>0?1:0):(Number(S.sh?.sheetLift)||0)>=.5?1:0);
  }
}
function bind(sheet,handle){
  handle.addEventListener('click',event=>{
    event.stopPropagation();
    if(handle.dataset.dragClick==='1'&&event.detail!==0){delete handle.dataset.dragClick;return;}

/* AG-06: reserve the group's own space and stack above existing fixed app controls. */
(function(){
'use strict';
let observer=null,basePadding='',lastPadding='',scheduled=0;
function layout(){
  const pill=document.querySelector('.b31-group-resume');
  if(!pill)return;
  const current=document.body.style.paddingBottom;
  if(current!==lastPadding)basePadding=current;
  let edge=window.visualViewport?.height||innerHeight;
  for(const node of document.querySelectorAll('.nav,.bar,.fbar,.c-current:not(.c-current-inline),.ad30-float')){
    const style=getComputedStyle(node),rect=node.getBoundingClientRect();
    if(style.position==='fixed'&&style.display!=='none'&&rect.height>0){
      // Keep a floating campaign's reserved slot while it animates offscreen;
      // otherwise its return could cover the group's re-entry control.
      const bottom=parseFloat(style.bottom),top=Number.isFinite(bottom)?innerHeight-bottom-rect.height:rect.top;
      if(top<innerHeight)edge=Math.min(edge,top);
    }
  }
  pill.style.setProperty('--b31-group-bottom',Math.max(12,innerHeight-edge+10)+'px');
  lastPadding='calc('+(basePadding||'0px')+' + '+Math.ceil(pill.getBoundingClientRect().height+20)+'px)';
  document.body.style.paddingBottom=lastPadding;lastPadding=document.body.style.paddingBottom;
}
function schedule(){if(!scheduled)scheduled=requestAnimationFrame(()=>{scheduled=0;layout()});}
function refresh(){
  observer?.disconnect();observer=null;basePadding=document.body.style.paddingBottom;lastPadding='';
  const pill=document.querySelector('.b31-group-resume');
  if(!pill)return;
  layout();
  if(window.ResizeObserver){observer=new ResizeObserver(schedule);observer.observe(pill);for(const node of document.querySelectorAll('.nav,.bar,.fbar,.c-current:not(.c-current-inline),.ad30-float'))observer.observe(node);}
}
const previous=render;
render=function(){previous.apply(this,arguments);refresh();};
window.addEventListener('resize',schedule);
window.visualViewport?.addEventListener('resize',schedule);
if(typeof ME!=='undefined'&&ME?.phone)render();
})();

<script>
/* TALABOT / NOTIFY-01 — shared visual safety for the original core 2.3s toast.
 * Four apps, NO changes to money, RPC, timing, permissions or other alert semantics.
 * Convert the core's bottom:96px fixed toast into a normal-flow status element;
 * insertion shifts the affected content rather than covering text or buttons.
 * Driver map errors are delegated to F-09's existing map status region.
 */
(function(){
 'use strict';
 if(window.__talabotSafeToast)return;
 const css=document.createElement('style');css.id='talabot-safe-toast';
 css.textContent=
 '.t15-flow-toast{position:static!important;inset:auto!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important;'+
 'z-index:auto!important;display:block!important;width:fit-content!important;min-height:0!important;max-width:min(86%,320px)!important;'+
 'box-sizing:border-box!important;overflow-wrap:break-word!important;white-space:normal!important;margin:8px auto 12px!important;'+
 'text-align:center!important;font-size:13px!important;line-height:18px!important;border-radius:22px!important;'+
 'pointer-events:none!important}';
 document.head.appendChild(css);
 function isCoreToast(e){
   if(!e||e.nodeType!==1||e.tagName!=='DIV'||e.parentElement!==document.body)return false;
   // Strictly recognize the ONE app-core toast primitive, independent of
   // Safari's normalized transform/left style serialization.
   const p=e.style.position||getComputedStyle(e).position;
   const z=Number(e.style.zIndex||getComputedStyle(e).zIndex);

 function target(){
   // Product note and choices are scrolled together. New notice follows the note
   // in normal flow, never overlaying "Халапеньо" or "Пожелания".
   const options=document.querySelector('#app .d6s .osh');
   if(options){const note=options.querySelector('.d6-nt');return {container:options,after:note||null};}
   // Every modal owns its own scroller. An in-flow notification cannot cover
   // its footer buttons, even when the visual viewport is keyboard-reduced.
   const modal=document.querySelector('#app .ov .md,#app .sheet .asheet,#app .f07-reject');
   if(modal)return {container:modal};
   const mission=document.querySelector('#app #a-sheet-body');

 /* Closed-customer ordering feedback does not belong in courier/merchant workflows. */
 function suppressClosedMerchantDriver(msg){
   if(!/(?:^|\/)(?:driver|merchant)\.html$/i.test(location.pathname))return false;
   const value=String(msg||'').trim();
   return /^(?:Ресторан сейчас закрыт|The restaurant is closed|Restaurant is currently closed)/i.test(value);

   if(!isCoreToast(e))return false;

      typeof window.__talabotF09MapNotice==='function'&&
      window.__talabotF09MapNotice(e))return true;

   // BEFORE this final script was parsed. MutationObserver does not replay it.

 // internal core Leaflet callbacks are still caught by the observer and sweep.
 if(window.TLB&&typeof TLB.toast==='function'){
   const original=TLB.toast;
   TLB.toast=function(message,bad){
     const msg=String(message);
     if(suppressClosedMerchantDriver(msg))return;
     if(document.body.classList.contains('a-mission')&&
       (msg===TLB.t('mapFail')||msg===TLB.t('locMapFail'))&&
       typeof window.__talabotF09MapNotice==='function'){

       if(window.__talabotF09MapNotice(virtual))return;

})();
