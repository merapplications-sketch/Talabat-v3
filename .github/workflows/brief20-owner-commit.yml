name: TALABOT BRIEF20 owner restore commit (ISOLATED REVIEW ONLY)
on:
  push:
    branches: [review/unified-fix-brief15-20261117]
    paths: ['.github/workflows/brief20-owner-commit.yml']
permissions:
  contents: read
jobs:
  owner_homeb_commit:
    if: github.repository == 'merapplications-sketch/Talabat-v3' && github.ref == 'refs/heads/review/unified-fix-brief15-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout review branch with full original git revert history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true, fetch-depth: 0}
      - name: Confirm untouched tested BRIEF20 source and reproduce ten local owner reverts
        shell: bash
        run: |
          set -euo pipefail
          for f in customer.html assets/customer-c/customer-c.js tools/brief20_revert.py tools/brief20_visual.py; do
            test "$(git rev-parse "4d2a7117c3cf6dbd557fa38e07a0fa9521e6d5c8:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          python3 tools/brief20_revert.py
          python3 - <<'PY'
          import pathlib, subprocess
          files=subprocess.check_output(['git','diff','--name-only',subprocess.check_output(['git','rev-parse','HEAD~10']).decode().strip(),'HEAD']).decode().splitlines()
          assert files==['assets/customer-c/customer-c.js'],('SCOPE_FAIL',files)
          contents=pathlib.Path('assets/customer-c/customer-c.js').read_text('utf8')
          assert "const homeBanner=null; // BRIEF-20 owner original fixed Home order card" in contents
          assert "const listAnchor=S.v!=='home'&&!homeBanner&&(" in contents
          assert "S.v==='cat'?document.querySelector('#app .d6-lh')" in contents
          assert "S.v==='menu'?document.querySelector('#app .d6m .d6-stats')" in contents
          print("BRIEF20_ISOLATED_REVERT_SAFETY_PASS ten reverts; only customer current-order Home scoped source delta")
          PY
      - name: Push only to existing isolated review branch; no deployment, PR merge or production
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = merapplications-sketch/Talabat-v3
          test "$GITHUB_REF" = refs/heads/review/unified-fix-brief15-20261117
          git fetch origin review/unified-fix-brief15-20261117
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/review/unified-fix-brief15-20261117
          echo "BRIEF20_OWNER_HOME_B_ISOLATED_PUSH_PASS"
