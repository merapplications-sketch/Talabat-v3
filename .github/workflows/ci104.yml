name: CI104 repair and safe attempt lifecycle
on:
  push:
    branches: [review/batch104-20261110]
    paths: ['tests/native104/**', '.github/workflows/ci104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 ci97/unpack.py
      - run: python3 tests/native104/build-client.py isolated97 "$RUNNER_TEMP/client104"
      - run: npm install --prefix "$RUNNER_TEMP/pw104" --no-audit --no-fund playwright@1.62.1
      - run: node "$RUNNER_TEMP/pw104/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node tests/native104/browser.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw104/node_modules/playwright
          CANDIDATE_UI: ${{ runner.temp }}/client104/customer.html
      - run: node --check "$RUNNER_TEMP/client104/talabat-core.js"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser104-synthetic-rpc
          path: native104-browser.json
          retention-days: 7
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-local-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10' 'typing_extensions==4.15.0'
      - run: python3 tests/native104/native.py
      - run: python3 tests/native104/admission.py
      - name: Restore candidate, HMAC keys and fingerprints to separate synthetic database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PREPARE_RESTORE=1 python3 tests/native104/restore.py
          docker exec "$PG_CONTAINER" pg_dump -U postgres --no-owner restore104_source > "$RUNNER_TEMP/candidate104.sql"
          docker exec "$PG_CONTAINER" createdb -U postgres restore104_target
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d restore104_target < "$RUNNER_TEMP/candidate104.sql"
          python3 tests/native104/restore.py
          rm "$RUNNER_TEMP/candidate104.sql"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native104-synthetic-${{ github.sha }}
          path: |
            native104-results.json
            native104-admission.json
            native104-restore.json
          retention-days: 7
  required104:
    if: always()
    needs: [client, postgres]
    runs-on: ubuntu-24.04
    steps:
      - run: test "$REPLAY" = success && test "$POSTGRES" = success
        env:
          REPLAY: ${{ needs.client.result }}
          POSTGRES: ${{ needs.postgres.result }}
