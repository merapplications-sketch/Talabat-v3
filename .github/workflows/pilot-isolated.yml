name: Isolated pilot integration and load
on:
  push:
    branches: [candidate/pilot-readiness-20261105]
    paths: [tests/pilot/**, .github/workflows/pilot-isolated.yml, sql/proposed/pilot_*.sql]
permissions:
  contents: read
jobs:
  pilot:
    # Only new legacy/checkout-race edges active; closed suites stay disabled.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact public source, no deployment credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin https://github.com/merapplications-sketch/Talabat-v3.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Pinned test clients
        run: python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10' 'typing_extensions==4.15.0'
      - name: Temporary native DB and real Auth REST services
        id: services
        run: |
          python3 tests/pilot/lab.py env
          docker compose --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml up -d db
          python3 tests/pilot/lab.py db
          docker compose --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml up -d auth
          python3 tests/pilot/lab.py app
          docker compose --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml up -d rest
      - name: New pilot journey and security checks only
        if: ${{ false }}
        env:
          PILOT_SKIP: auth_signup_login_refresh_and_forgery,address_RLS,current_driver_joining_gate,catalog_prices_availability_and_atomic_refusal,order_creation_retry_and_reconnect,REST_role_and_order_privacy,cancel_reject_wallet_recovery,client_error_monitoring_store,unsupported_payment_refusal,real_REST_order_to_receipt_and_lost_body,cross_ticket_refund_cap_under_contention,refund_storage_failure_atomicity,merchant_driver_and_direct_write_isolation
        run: python3 tests/pilot/lab.py integration
      - name: New driver tap actions on actual Auth REST
        if: ${{ false }}
        run: |
          npm ci --prefix tests/pilot --ignore-scripts --no-audit --no-fund
          python3 tests/pilot/lab.py driver_fixture
          cd tests/pilot
          npx playwright install --with-deps chromium
          python3 gateway.py >.runtime-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill "$GATEWAY_PID"' EXIT
          node driver-actions.cjs
      - name: New workload of order journey and tracking
        id: workload
        if: ${{ false }}
        env:
          PILOT_LOAD_STAGES: '50'
        run: python3 tests/pilot/lab.py load
      - name: Isolated logical backup and restore drill
        if: ${{ false }}
        run: |
          docker compose --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml exec -T db pg_dump -U postgres -Fc talabot_pilot >tests/pilot/backup.dump
          docker compose --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml exec -T db createdb -U postgres talabot_pilot_restore
          docker compose --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml exec -T db pg_restore -U postgres -d talabot_pilot_restore --exit-on-error <tests/pilot/backup.dump
          python3 tests/pilot/lab.py restore
      - name: New sustained order GPS and eight-role polling workload
        if: ${{ false }}
        run: python3 tests/pilot/soak.py
      - name: New isolated SMTP confirmation and recovery UI proof
        timeout-minutes: 8
        if: ${{ false }}
        run: |
          LAB_AUTOCONFIRM=false docker compose --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml up -d mailpit auth
          python3 -c "import sys;sys.path.insert(0,'tests/pilot');import lab;lab.wait(lambda:lab.request(9999,'/health')[0]==200,'auth-mail')"
          npm ci --prefix tests/pilot --ignore-scripts --no-audit --no-fund
          cd tests/pilot
          if command -v google-chrome >/dev/null; then
            export PILOT_CHROMIUM_PATH="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
          python3 gateway.py >.runtime-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill "$GATEWAY_PID"' EXIT
          MAIL_ONLY_RECOVERY=1 node auth-mail.cjs
      - name: New real private Storage policies and proof integrity
        id: storage
        if: ${{ false }}
        run: |
          python3 tests/pilot/storage.py optional
          python3 tests/pilot/storage.py prepare
          docker compose --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml up -d storage
          STORAGE_ONLY_PROOF=1 python3 tests/pilot/storage.py test
      - name: New actual Storage metadata and file restoration
        if: ${{ false }}
        run: python3 tests/pilot/storage.py restore
      - name: New first cash and changed-revision server contract
        if: ${{ false }}
        env:
          CONFIRM_UI_FIXTURE: '1'
        run: python3 tests/pilot/confirmation.py
      - name: New approval UI recovery focus and time-selection checks
        if: ${{ false }}
        run: |
          npm ci --prefix tests/pilot --ignore-scripts --no-audit --no-fund
          cd tests/pilot
          if command -v google-chrome >/dev/null; then
            export PILOT_CHROMIUM_PATH="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
          python3 gateway.py >.runtime-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill "$GATEWAY_PID"' EXIT
          node confirmation-edge-ui.cjs
      - name: New 42-user concurrent order consent GPS stages
        if: ${{ false }}
        run: python3 tests/pilot/concurrent-journeys.py
      - name: New legacy and concurrent checkout compatibility only
        if: ${{ false }}
        run: |
          CONFIRM_COMPAT_CORE_FIXTURE=1 python3 tests/pilot/confirmation-compat.py
          npm ci --prefix tests/pilot --ignore-scripts --no-audit --no-fund
          cd tests/pilot
          export PILOT_CHROMIUM_PATH="$(command -v google-chrome)"
          python3 gateway.py >.runtime-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill "$GATEWAY_PID"' EXIT
          node confirmation-legacy.cjs
      - name: New enforced pilot admission only
        run: python3 tests/pilot/admission.py
      - name: Export bounded evidence without tokens or backups
        if: always()
        run: python3 tests/pilot/lab.py export
      - name: Destroy temporary services
        if: always()
        run: docker compose --profile restore --env-file tests/pilot/.runtime.env -f tests/pilot/compose.yml down -v --remove-orphans
