name: TALABOT BRIEF-24 customer Home and cart
on:
  push:
    branches: [review/unified-fix-brief15-20261117]
    paths:
      - customer.html
      - assets/customer-c/home-sections.css
      - assets/customer-c/customer-c.css
      - assets/size-brief7/customer.css
      - qa-fixtures/home-brief22.json
      - qa-fixtures/home-brief24.json
      - qa-fixtures/home-brief25b.json
      - tools/brief25b_webkit.py
      - 'qa-shots/unified-fix/brief25b/**'
      - tools/brief24_webkit.py
      - tools/brief23_webkit.py
      - tools/brief22_webkit.py
      - .github/workflows/brief22-home.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: talabot-customer-home
  cancel-in-progress: true
jobs:
  home:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright/python:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true, fetch-depth: 0}
      - name: Load the approved customer app and reference photos
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 --no-tags origin c5a8ff8a2d3a74301a3f35130a8f84316528449c 83e94496141375d6e6f1e99ed735cccb70254c32
          git worktree add --detach "$RUNNER_TEMP/home-approved" c5a8ff8a2d3a74301a3f35130a8f84316528449c
          git diff --exit-code c5a8ff8a HEAD -- sql supabase talabat-core.js admin.html driver.html merchant.html
      - name: Run offline WebKit geometry, image, action and financial checks
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==11.3.0
          # BRIEF-25 reviews the candidate offline; the live preview is checked by Ops.
          python tools/brief23_webkit.py "$RUNNER_TEMP/home-approved" "$RUNNER_TEMP/home-regression"
          python tools/brief24_webkit.py "$RUNNER_TEMP/home-approved" "$RUNNER_TEMP/home-evidence"
          python tools/brief25b_webkit.py "$RUNNER_TEMP/home-evidence/brief25b"
      - name: Persist only BRIEF-25b fixture-labelled WebKit captures on isolated review branch
        shell: bash
        if: github.repository == 'merapplications-sketch/Talabat-v3' && github.ref == 'refs/heads/review/unified-fix-brief15-20261117'
        run: |
          set -euo pipefail
          mkdir -p qa-shots/unified-fix/brief25b
          cp "$RUNNER_TEMP/home-evidence/brief25b/"*.webp qa-shots/unified-fix/brief25b/
          git config user.name "talabot-brief25b-webkit"
          git config user.email "talabot-brief25b-webkit@users.noreply.github.com"
          git add -- qa-shots/unified-fix/brief25b/
          if ! git diff --cached --quiet; then
            git commit -m "test(BRIEF-25b): fixture-labelled RU375 WebKit screenshots only"
            git fetch origin review/unified-fix-brief15-20261117
            git rebase origin/review/unified-fix-brief15-20261117
            git push origin HEAD:refs/heads/review/unified-fix-brief15-20261117
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brief24-home-cart
          path: ${{ runner.temp }}/home-evidence/
          retention-days: 7
