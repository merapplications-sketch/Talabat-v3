name: TALABOT BRIEF-24 customer Home and cart
on:
  push:
    branches: [review/unified-fix-brief15-20261117, ci/brief-ci1-20261120]
    paths-ignore:
      - 'qa-shots/**'
      - 'ci/FULL-VISUAL-TRIGGER.txt'
      - 'docs/**'
      - '**/*.md'
      - '*.md'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright/python:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true, fetch-depth: 0}
      - name: Load the approved customer app and reference photos
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 --no-tags origin c5a8ff8a2d3a74301a3f35130a8f84316528449c 83e94496141375d6e6f1e99ed735cccb70254c32
          git worktree add --detach "$RUNNER_TEMP/home-approved" c5a8ff8a2d3a74301a3f35130a8f84316528449c
          git diff --exit-code c5a8ff8a HEAD -- sql supabase talabat-core.js driver.html merchant.html ':(exclude)sql/proposed/brief29-banner-presentation.md'
          git diff --exit-code 69cfbbb1132aa8e0aba9d151e2edd21024217f4d HEAD -- admin.html
      - name: CI1 fast current brief + one RU375 Home smoke with approved financial parity
        if: github.event_name == 'push'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 Pillow==11.3.0
          python tools/ci1_fast_webkit.py "$RUNNER_TEMP/home-approved" "qa-artifacts/ci1-fast"
      - name: Stage WebKit-only evidence under checkout for artifact upload
        if: always()
        run: |
          mkdir -p qa-artifacts
          if [ -d "$RUNNER_TEMP/home-evidence" ]; then
            cp -R "$RUNNER_TEMP/home-evidence" qa-artifacts/home-evidence
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brief24-home-cart
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 7
