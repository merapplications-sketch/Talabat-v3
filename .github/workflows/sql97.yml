name: sql97-public
on:
  push:
    branches: [review/ci-native95-20261110]
    paths: ['tests/native102/**', '.github/workflows/ci102.yml', 'tests/acceptance100/**', 'tests/fixtures100/**', 'scripts/ci100/**', '.github/workflows/ci100.yml', 'ci97/**', 'tests/native95/**', 'tests/native96/**', 'tests/native97/**', 'tests/native98/**', 'tests/http98/**', '.github/workflows/sql97.yml', '.github/workflows/native95.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 ci97/unpack.py
      - run: npm ci --ignore-scripts --prefix isolated97/tests/dispatch-isolated
      - run: node scripts/ci97/sql.mjs "$RUNNER_TEMP/sql97"
        working-directory: isolated97
        env:
          PGLITE_MODULE: ${{ github.workspace }}/isolated97/tests/dispatch-isolated/node_modules/@electric-sql/pglite/dist/index.js
      - run: |
          mkdir -p isolated97/tests/http98 isolated97/tests/native98
          cp tests/http98/*.mjs isolated97/tests/http98/
          cp tests/native98/place_order.fixed.sql isolated97/tests/native98/
      - run: node --test tests/http98/runner.test.mjs
        working-directory: isolated97
      - run: node tests/order-transaction94.mjs
        working-directory: isolated97
        env:
          PGLITE_MODULE: ${{ github.workspace }}/isolated97/tests/dispatch-isolated/node_modules/@electric-sql/pglite/dist/index.js
          ORDER_FUNCTION: tests/native98/place_order.fixed.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sql97-${{ github.sha }}
          path: ${{ runner.temp }}/sql97/report.json
          retention-days: 7
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 ci97/unpack.py
      - run: node scripts/ci97/fast.mjs "$RUNNER_TEMP/fast97"
        working-directory: isolated97
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast97-${{ github.sha }}
          path: ${{ runner.temp }}/fast97/report.json
          retention-days: 7
  gate-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -c "import json; assert json.load(open('ci97/gate-control.json'))['inject_failure'] is False, 'deliberate CI gate negative control'"
  required:
    if: always()
    needs: [sql, fast, gate-control]
    runs-on: ubuntu-latest
    steps:
      - run: test "$SQL_RESULT" = success && test "$FAST_RESULT" = success && test "$CONTROL_RESULT" = success
        env:
          SQL_RESULT: ${{ needs.sql.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          CONTROL_RESULT: ${{ needs.gate-control.result }}

