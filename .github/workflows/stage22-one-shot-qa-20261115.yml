name: TALABOT Stage22 isolated one-shot QA
on:
  push:
    branches:
      - review/stage22-one-shot-qa-20261115
    paths:
      - .github/workflows/stage22-one-shot-qa-20261115.yml
permissions:
  contents: read
concurrency:
  group: talabot-stage22-one-shot-only
  cancel-in-progress: false
jobs:
  isolated-qa:
    if: github.repository == 'merapplications-sketch/Talabat-v3' && github.ref == 'refs/heads/review/stage22-one-shot-qa-20261115' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout read-only (no persistent token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare isolated Python browser
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral Playwright/Chromium only inside runner
        run: |
          python -m pip install --no-cache-dir playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Live synthetic Pages guard and network test
        shell: bash
        run: |
          python docs/qa-first-20261115/stage22_guarded_browser_test.py
      - name: Save sanitized test artifacts (one-day retention, no real data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talabot-stage22-qa-synthetic-only
          path: stage22-qa-artifacts/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
