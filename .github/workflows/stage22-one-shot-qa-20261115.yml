name: TALABOT Stage22 isolated one-shot QA
on:
  push:
    branches:
      - review/stage22-one-shot-qa-20261115
    paths:
      - .github/workflows/stage22-one-shot-qa-20261115.yml
permissions:
  contents: read
concurrency:
  group: talabot-stage22-one-shot-only
  cancel-in-progress: false
jobs:
  isolated-qa:
    if: github.repository == 'merapplications-sketch/Talabat-v3' && github.ref == 'refs/heads/review/stage22-one-shot-qa-20261115' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout read-only (no persistent token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare isolated Python browser
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral Playwright/Chromium only inside runner
        run: |
          python -m pip install --no-cache-dir playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Live synthetic Pages guard and network test
        shell: bash
        run: |
          python - <<'PY'
          import asyncio,hashlib,json,os,ssl
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request,build_opener,HTTPRedirectHandler,HTTPSHandler
          from playwright.async_api import async_playwright
          HOST="talabot-safari-demo-20261115.pages.dev"
          BASE="https://"+HOST
          expected={"/":"2c74b7af8b8d1cdad0d3ce446ad2591703088e17948f2ba6636a83d7795466b2",
                    "/demo-guard.js":"8d19a5a9d251b30202a9f6cb9d4703df67b2e862885ab5fbac4b86ec2c7892d4",
                    "/demo-fixture.js":"2ac636de0fb1719d182242d803fc394cee5c7aa6969ecd2fae8ce829cb4826a8"}
          out={"site":HOST,"status":"STARTED","assets":[],"network":{"blocked":[],"requests":[],"responses":[],"failed":[],"websockets":[],"console":[]},"screens":[],"checkout":"NOT_TESTED"}
          def same(u):
              p=urlsplit(u)
              return p.scheme=="https" and p.hostname==HOST and p.port in (None,443) and not p.username and not p.password
          def label(u):
              p=urlsplit(u)
              return (p.hostname or "?")+(p.path or "/")
          def finish():
              print("STAGE22_JSON_BEGIN")
              print(json.dumps(out,ensure_ascii=False,separators=(",",":"),default=str)[:125000])
              print("STAGE22_JSON_END")
          class DenyRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise RuntimeError("Unexpected HTTP redirect")
          def verify_assets():
              op=build_opener(DenyRedirect(),HTTPSHandler(context=ssl.create_default_context()))
              for path in ("/","/demo-guard.js","/demo-fixture.js","/assets/3d/hamburger.webp"):
                  with op.open(Request(BASE+path,headers={"User-Agent":"TALABOT-stage22-isolated-qa"}),timeout=18) as r:
                      status=r.status
                      data=r.read(3000000)
                      h=r.headers
                  entry={"path":path,"status":status,"mime":h.get("Content-Type",""),"bytes":len(data),"sha":hashlib.sha256(data).hexdigest()}
                  if path=="/":
                      entry["csp"]=h.get("Content-Security-Policy","")
                      entry["nosniff"]=h.get("X-Content-Type-Options","")
                  out["assets"].append(entry)
                  if status!=200:raise RuntimeError("FAIL_CLOSED_HTTP_"+path)
                  if path in expected and entry["sha"]!=expected[path]:raise RuntimeError("FAIL_CLOSED_SOURCE_SHA_"+path)
                  if path=="/" and ("connect-src 'none'" not in entry["csp"] or "form-action 'none'" not in entry["csp"] or entry["nosniff"].lower()!="nosniff"):
                      raise RuntimeError("FAIL_CLOSED_CSP_HEADERS")
                  if path.endswith(".js") and "javascript" not in entry["mime"].lower():raise RuntimeError("FAIL_CLOSED_JS_MIME")
                  if path.endswith(".webp") and "image/webp" not in entry["mime"].lower():raise RuntimeError("FAIL_CLOSED_WEBP_MIME")
          async def inspect():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  try:
                      ctx=await browser.new_context(viewport={"width":390,"height":844},service_workers="block",accept_downloads=False,record_har_path="local-only.har")
                      async def http_guard(route):
                          u=route.request.url
                          if same(u):await route.continue_()
                          else:
                              out["network"]["blocked"].append({"kind":"HTTP","url":label(u)})
                              await route.abort("blockedbyclient")
                      await ctx.route("**/*",http_guard)
                      if not hasattr(ctx,"route_web_socket"):raise RuntimeError("NO_WS_INTERCEPTION")
                      async def ws_guard(route):
                          out["network"]["websockets"].append(label(route.url))
                          await route.close()
                      await ctx.route_web_socket("**/*",ws_guard)
                      async def attach(page):
                          page.on("request",lambda r:out["network"]["requests"].append(label(r.url)))
                          page.on("response",lambda r:out["network"]["responses"].append({"url":label(r.url),"status":r.status,"mime":r.headers.get("content-type","")}))
                          page.on("requestfailed",lambda r:out["network"]["failed"].append({"url":label(r.url),"error":str(r.failure)}))
                          page.on("pageerror",lambda e:out["network"]["console"].append(str(e)[:200]))
                      dry=await ctx.new_page()
                      await attach(dry)
                      try:await dry.goto("https://qa-stage22-denied.invalid/test",timeout=5000)
                      except Exception:pass
                      if not any(x["url"].startswith("qa-stage22-denied.invalid/") for x in out["network"]["blocked"]):
                          raise RuntimeError("DENY_CHECK_NOT_CAPTURED")
                      await dry.close()
                      page=await ctx.new_page()
                      await attach(page)
                      response=await page.goto(BASE+"/?lang=en",wait_until="domcontentloaded",timeout=25000)
                      if not response or response.status!=200:raise RuntimeError("LIVE_BROWSER_NAVIGATION_FAILED")
                      if len(out["network"]["blocked"])!=1 or out["network"]["websockets"]:raise RuntimeError("UNEXPECTED_EXTERNAL_OR_WS_ATTEMPT")
                      guard=await page.evaluate("Boolean(window.__demoBlockedActions!==undefined && window.TLB && TLB.placeOrder && TLB.placeOrder.toString().includes('__demoBlockedActions'))")
                      if not guard:raise RuntimeError("ORDER_GUARD_NOT_LOADED")
                      for lang in ("en","ru"):
                          for w in (320,360,390,430):
                              await page.set_viewport_size({"width":w,"height":844})
                              r=await page.goto(BASE+"/?lang="+lang,wait_until="domcontentloaded",timeout=25000)
                              if not r or r.status!=200:raise RuntimeError("LOCALE_NAV_FAILED")
                              obj=await page.evaluate("() => ({lang:document.documentElement.lang,scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,demo:!!document.querySelector('#tlb-demo-banner')})")
                              obj.update({"expected":lang,"width":w,"pass":obj["lang"]==lang and obj["scroll"]<=obj["client"]+1 and obj["demo"]})
                              out["screens"].append(obj)
                              if len(out["network"]["blocked"])!=1 or out["network"]["websockets"]:raise RuntimeError("OUTBOUND_ATTEMPT_DURING_LAYOUT")
                      await page.set_viewport_size({"width":390,"height":844})
                      await page.goto(BASE+"/?lang=en",wait_until="domcontentloaded")
                      await page.reload(wait_until="domcontentloaded")
                      out["en_query_reload"]=await page.evaluate("document.documentElement.lang==='en'")
                      if len(out["network"]["blocked"])!=1 or out["network"]["websockets"]:raise RuntimeError("OUTBOUND_ATTEMPT_BEFORE_CHECKOUT")
                      fixture=await page.evaluate("""() => {
                          if(typeof S==='undefined'||typeof lk!=='function'||typeof render!=='function')return {ok:false};
                          const st=STORES.find(x=>menuOf(x.n).some(it=>it.id==='i1'));
                          if(!st)return {ok:false};
                          const ops=TLB.optionsOf('i1').filter(g=>g.required).map(g=>g.options[0].id);
                          S.store=st.n;S.cartStore=st.n;S.cart={[lk('i1',ops,'')]:2};S.pay='cash';S.useWallet=false;S.usePts=false;S.v='pay';S.hcf=null;render();
                          return {ok:!!document.querySelector('#hbtn .d69-slide-thumb'),valid:badKeys().length===0};
                      }""")
                      out["fixture"]=fixture
                      if fixture.get("ok") and fixture.get("valid"):
                          thumb=await page.locator("#hbtn .d69-slide-thumb").bounding_box()
                          bar=await page.locator("#hbtn").bounding_box()
                          if not thumb or not bar:raise RuntimeError("SLIDER_NOT_VISIBLE")
                          before=await page.evaluate("window.__demoBlockedActions")
                          y=thumb["y"]+thumb["height"]/2
                          await page.mouse.move(thumb["x"]+thumb["width"]/2,y)
                          await page.mouse.down()
                          await page.mouse.move(bar["x"]+bar["width"]-thumb["width"]/2-3,y,steps=16)
                          await page.mouse.up()
                          await page.wait_for_timeout(400)
                          after=await page.evaluate("window.__demoBlockedActions")
                          state=await page.evaluate("S.v")
                          out["checkout"]={"blocked_actions":after-before,"view":state,"pass":after>before and state=="pay"}
                          if after<=before or state!="pay":raise RuntimeError("MOCK_SLIDER_NOT_PROVEN_SAFE")
                      else:
                          out["checkout"]={"status":"NOT_EXECUTED_FIXTURE_UNAVAILABLE"}
                      if len(out["network"]["blocked"])!=1 or out["network"]["websockets"]:raise RuntimeError("OUTBOUND_ATTEMPT_DURING_CHECKOUT")
                      await ctx.close()
                      har=Path("local-only.har")
                      if not har.exists():raise RuntimeError("HAR_NOT_CREATED")
                      entries=json.loads(har.read_text()).get("log",{}).get("entries",[])
                      out["har"]={"entries":len(entries),"sha256":hashlib.sha256(har.read_bytes()).hexdigest(),"uploaded":False}
                      if not entries:raise RuntimeError("EMPTY_LIVE_HAR")
                  finally:
                      await browser.close()
          async def main():
              if os.getenv("GITHUB_ACTIONS")!="true" or os.getenv("GITHUB_REPOSITORY")!="merapplications-sketch/Talabat-v3" or os.getenv("GITHUB_REF")!="refs/heads/review/stage22-one-shot-qa-20261115":
                  raise RuntimeError("UNAUTHORIZED_RUN_CONTEXT")
              try:
                  verify_assets()
                  await inspect()
                  out["status"]="PASS_LIMITED_SYNTHETIC_QA" if out["checkout"].get("pass") and all(x["pass"] for x in out["screens"]) else "PARTIAL_REVIEW_NEEDED"
              except Exception as exc:
                  out["status"]="BLOCKED_NO_GO: "+str(exc)[:300]
                  finish()
                  raise
              else:finish()
          asyncio.run(main())
          PY
