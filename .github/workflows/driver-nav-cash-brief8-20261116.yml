name: TALABOT Driver NAV + CASH BRIEF-8 isolated QA (NO PROD)
on:
  push:
    branches: [review/driver-nav-cash-brief8-20261116]
    paths:
      - driver.html
      - assets/driver-tech/route-layer.js
      - assets/driver-tech/nav-cash-brief8.js
      - assets/driver-tech/map-icons/**
      - tools/driver_device_v3_checks.cjs
      - tools/driver_nav_cash_brief8_checks.cjs
      - tools/driver_nav_cash_brief8_screenshots.py
      - .github/workflows/driver-nav-cash-brief8-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talabot-brief8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  brief8-local-qa:
    if: github.repository == 'merapplications-sketch/Talabat-v3' && github.ref == 'refs/heads/review/driver-nav-cash-brief8-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Pin accepted SIZE-7 ancestor and protect source SQL, admin and other product files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base c20fdd8ae5ce7a394af6f80d8a4553ccc5b8cc53 HEAD)" = c20fdd8ae5ce7a394af6f80d8a4553ccc5b8cc53
          test "$(git rev-parse HEAD:sql/proposed/gate1_cash_and_idempotent_delivery.sql)" = 684c9c18af434a267fd8b0dc07288aa287e8eb13
          git diff --name-only c20fdd8ae5ce7a394af6f80d8a4553ccc5b8cc53 HEAD > /tmp/brief8-scoped
          if grep -Ev '^((driver.html)|(assets/driver-tech/(route-layer.js|nav-cash-brief8.js|map-icons/(google-maps|2gis|yandex-maps).svg))|(tools/(driver_device_v3_checks.cjs|driver_nav_cash_brief8_(checks.cjs|screenshots.py)))|(\.github/workflows/driver-nav-cash-brief8-20261116.yml))$' /tmp/brief8-scoped; then
            echo 'STOP: BRIEF-8 has unauthorized modifications'; exit 1
          fi
          node --check assets/driver-tech/route-layer.js
          node --check assets/driver-tech/nav-cash-brief8.js
          node --check tools/driver_device_v3_checks.cjs
          node --check tools/driver_nav_cash_brief8_checks.cjs
          python3 -m py_compile tools/driver_nav_cash_brief8_screenshots.py
      - name: Install pinned disposable local QR/browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate1-qr"
          npm --prefix "$RUNNER_TEMP/gate1-qr" install --no-save --ignore-scripts --package-lock=false qrcode-generator@1.4.4 jsqr@1.4.0
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with: {version: 3.1.0}
      - name: Prepare disposable LOCAL Supabase and export exact loopback environment
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/gate1_local_prepare.py
          supabase start > "$RUNNER_TEMP/brief8-local-start.log" 2>&1 || { echo 'STOP LOCAL database not ready';exit 1; }
          supabase db reset --local > "$RUNNER_TEMP/brief8-local-reset.log" 2>&1 || { echo 'STOP LOCAL schema reset failed';exit 1; }
          supabase status -o env > "$RUNNER_TEMP/brief8-local-env"
          python3 tools/gate1_local_env.py "$RUNNER_TEMP/brief8-local-env"
      - name: Seed synthetic LOCAL-only data (separate Actions step)
        shell: bash
        run: |
          set -euo pipefail
          test "${SUPABASE_LOCAL_URL:-}" = http://127.0.0.1:54321
          python3 tools/gate1_local_seed.py
      - name: Gate1 mandatory suite, genuine LOCAL HTTP cash short E08, V3 and BRIEF8 UI regressions
        shell: bash
        env:
          GATE1_QR_DEPS: ${{ runner.temp }}/gate1-qr
        run: |
          set -euo pipefail
          bash tools/check_all.sh | tee "$RUNNER_TEMP/brief8-gate1.log"
          grep -Fq 'PASS E08 [live isolated test HTTP only]' "$RUNNER_TEMP/brief8-gate1.log"
          grep -Fxq 'GATE1_E2E: 16 / 16 LOCAL HTTP PASS' "$RUNNER_TEMP/brief8-gate1.log"
          echo 'PASS CASH_short_amount_reports_not_delivers: REAL LOCAL HTTP E08 (payment ticket, no delivered status)'
          node tools/driver_device_v3_checks.cjs
          node tools/driver_nav_cash_brief8_checks.cjs
      - name: Capture branded maps + cash sheet in isolated 390px synthetic Chromium, keyboard reduced viewport
        shell: bash
        run: python3 tools/driver_nav_cash_brief8_screenshots.py
      - name: Upload synthetic screenshots and evidence manifest only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: talabot-brief8-driver-nav-cash-synthetic-390
          path: evidence/driver-nav-cash-brief8/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown disposable LOCAL Supabase without backup
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then supabase stop --no-backup || true; fi
