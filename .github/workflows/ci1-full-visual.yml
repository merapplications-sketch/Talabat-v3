            cp -R "$RUNNER_TEMP/home-evidence" qa-artifacts/home-evidence
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brief24-home-cart
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 7
