name: TALABOT BRIEF15 H-01 Real LOCAL Auth QA (NO PROD)
on:
  push:
    branches: [review/unified-fix-brief15-20261117]
    paths:
      - 'talabat-core.js'
      - '.github/workflows/unified-fix-brief15-20261117.yml'
      - 'supabase/migrations/*auth*.sql'
      - 'supabase/migrations/*role*.sql'
      - 'supabase/migrations/*permission*.sql'
      - 'tools/gate1_local_seed.py'
      - 'tools/gate1_local_env.py'
      - 'tools/full_audit_seed.py'
      - 'tools/full_audit.py'
      - 'tools/brief24_webkit.py'
      - '.github/workflows/brief22-home.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talabot-brief15-auth
  cancel-in-progress: true
jobs:
  h01:
    if: github.repository == 'merapplications-sketch/Talabat-v3' && github.ref == 'refs/heads/review/unified-fix-brief15-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write  # commit synthetic evidence ONLY on isolated review branch
    steps:
      - name: Checkout isolated review for ephemeral authentication evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true, fetch-depth: 0}
      - name: Guard immutable backend/finance and strictly scoped owner F/O app repairs
        shell: bash
        run: |
          set -euo pipefail
          BASE=f85f927db58280c24773768f4aa5ddc88956a448
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          # Each approved UI correction has an independently revertible F/O commit.
          for f in sql/proposed/gate1_cash_and_idempotent_delivery.sql sql/proposed/patch40_navigation_budget.sql; do
            test "$(git rev-parse "$BASE:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          python3 - <<'PY'
          import pathlib,subprocess
          baseline='f85f927db58280c24773768f4aa5ddc88956a448'
          original=subprocess.check_output(['git','show',baseline+':talabat-core.js']).decode('utf8')
          current=pathlib.Path('talabat-core.js').read_text('utf8')
          start="    /* BRIEF-18 U-02 nonfinancial courier-instruction APIs; financial RPC unchanged. */"
          stop="    checkPromo: function (storeN, cart, code) {"
          assert current.count(start)==1 and current.count(stop)==1,'U-02 source uniqueness'
          a=current.index(start);b=current.index(stop,a)
          addition=current[a:b]
          assert all(addition.count('    '+x+': function')==1 for x in ('deliveryInstructionsReady','saveDeliveryInstructions','getDeliveryInstructions')),'U-02 methods missing'
          assert current[:a]+current[b:]==original,'Money / existing core code differs from frozen baseline'
          PY
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/brief15-paths"
          while IFS= read -r changed; do
            case "$changed" in
              tools/gate1_local_seed.py|tools/full_audit_seed.py|tools/full_audit.py|tools/brief15_webkit.py|tools/brief15b_webkit.py|tools/brief18_webkit.py|tools/brief18b_webkit.py|tools/brief18c_webkit.py|tools/brief18d_webkit.py|talabat-core.js|assets/3d/motor-scooter-yellow.png|sql/proposed/brief18_delivery_instructions.sql|sql/proposed/brief18_delivery_instructions_rollback.sql|sql/proposed/brief18_delivery_instructions_owner_purge.sql|tools/brief19_sec18_local.py|tools/brief11_webkit_layout.py|tools/check_all.sh|customer.html|merchant.html|driver.html|admin.html|assets/customer-c/customer-c.js|assets/customer-c/customer-c.css|assets/driver-a/driver-a.js|assets/driver-tech/map-view.js|assets/driver-tech/cash-sheet-polish-brief11.js|assets/shared/safe-toast.js|qa-shots/unified-fix/*|.github/workflows/unified-fix-brief15-20261117.yml) ;;
              .github/workflows/brief20-homeb-restore.yml|.github/workflows/brief20-owner-commit.yml|.github/workflows/brief20-source-evidence.yml|tools/brief20_restore_probe.sh|tools/brief20_revert.py|tools/brief20_visual.py|assets/size-brief7/customer.css)
                git diff --exit-code 78c4551b193d4a877a93727ccabda10df9059cb3 HEAD -- "$changed" ;;
              .github/workflows/brief21-customer-review.yml|tools/brief21_webkit.py) ;;
              .github/workflows/brief22-home.yml|tools/brief22_webkit.py|tools/brief23_webkit.py|tools/brief24_webkit.py|qa-fixtures/home-brief2*.json|qa-shots/*) ;;
              assets/customer-c/home-sections.css)
                # Keep the previous stylesheet as an exact prefix and pin the BRIEF-25 append.
                git show a9b632088b0466149953fdccfd72c7ee380a3881:"$changed" > "$RUNNER_TEMP/approved-home-css"
                cmp -s -n "$(wc -c < "$RUNNER_TEMP/approved-home-css")" "$RUNNER_TEMP/approved-home-css" "$changed"
                test "$(git rev-parse HEAD:"$changed")" = "eaea5724e633d6aaf61d4838c8126d4712bf014d" || { echo "STOP: Home stylesheet differs from BRIEF-25 preview" >&2; exit 1; } ;;
              *) echo "STOP: out of BRIEF15 scope: $changed" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/brief15-paths"
          # BRIEF-15b: permit only the precisely scoped G-04 and G-07 display changes.
          # Reverse the two known patches and compare byte-for-byte to the protected baseline.
          python3 - <<'PY'
          import pathlib,subprocess
          base='f85f927db58280c24773768f4aa5ddc88956a448'
          def undo(src,old,new):
              assert src.count(new)==1,('unrecognized UI delta',new[:80])
              return src.replace(new,old)
          for path in ('driver.html','admin.html'):
              original=subprocess.check_output(['git','show',f'{base}:{path}']).decode('utf8')
              expected=original.replace('</body></html>',
                    '<script src="assets/shared/safe-toast.js"></script></body></html>')
              current=pathlib.Path(path).read_text('utf8')
              if path=='driver.html':
                  current=undo(current,'',"""/* G-04: delivery progress is distinct from the courier's server-acknowledged shift. */
          TLB.addDict({g04Delivering:'Доставка активна'},{g04Delivering:'Delivery in progress'});
          """)
                  current=undo(current,"""<div class="pill"><span class="dot ${online?'':'off'}"></span>${online?t('online'):t('shOff')}${online?""",
                               """<div class="pill"><span class="dot ${online||a0?'':'off'}"></span>${online?t('online'):a0?t('g04Delivering'):t('shOff')}${online?""")
              else:
                  # G-06b changes only the heading capitalization of the KPI.
                  current=undo(current,"kp('box',all.length,g06Orders(all.length))",
                      "kp('box',all.length,g06Orders(all.length).replace(/^./,x=>x.toLocaleUpperCase(TLB.lang()==='ru'?'ru-RU':'en-US')))")
                  current=undo(current,'',"""/* BRIEF-15b G-06: compact Russian/English count inflection for admin totals. */
          function g06Orders(n){const v=Math.abs(Math.trunc(+n||0));if(TLB.lang()!=='ru')return v===1?'order':'orders';const d=v%10,h=v%100;return d===1&&h!==11?'заказ':d>=2&&d<=4&&(h<12||h>14)?'заказа':'заказов'}
          """)
                  current=undo(current,"kp('box',all.length,t('aKOrd'))","kp('box',all.length,g06Orders(all.length))")
                  current=undo(current,"<span>${t('xCuOrders')}</span>","<span>${g06Orders(x.orders_count)}</span>")
                  current=undo(current,"${x.orders_count} ${t('xCuOrders').toLowerCase()}","${x.orders_count} ${g06Orders(x.orders_count)}")
                  current=undo(current,'',"""/* BRIEF-15b G-07: migration diagnostics are developer-console only. */
          let g07SetupLogged=false;
          function g07LogSetup(){if(!g07SetupLogged){g07SetupLogged=true;console.warn('[TALABOT G-07]',t('aSetupW'))}}
          """)
                  current=undo(current,"""${setup?`<div class="setupw">${ic('alert',14)} ${t('aSetupW')}</div>`:''}""",
                               """${setup?(g07LogSetup(),''):''}""")
              assert current==expected,(path,'outside approved G-04/G-07 UI delta')
          # The actual driver-A header must only differ by approved G-04 state label.
          path='assets/driver-a/driver-a.js'
          orig=subprocess.check_output(['git','show',f'{base}:{path}']).decode('utf8')
          changed=pathlib.Path(path).read_text('utf8')
          old="""function aHeader(task){return `<header class="hd a-header"><div class="a-brand"><img src="assets/driver-a/brand/TALABOT-Original-RU.png" alt="Талабот"></div><div class="a-header-actions"><span class="a-shift-dot ${online?'on':''}">${t(online?'onShift':'shOff')}</span>"""
          new="""function aHeader(task){const delivering=!!(task||mine());return `<header class="hd a-header"><div class="a-brand"><img src="assets/driver-a/brand/TALABOT-Original-RU.png" alt="Талабот"></div><div class="a-header-actions"><span class="a-shift-dot ${online||delivering?'on':''}">${t(online?'onShift':delivering?'g04Delivering':'shOff')}</span>"""
          marker='/* BRIEF-18 U-02: actual driver UI reads separately permission-checked instructions. */'
          stop='function aExtraInfo(x){'
          assert changed.count(marker)==1 and changed.count(stop)==1,'U-02 driver methods missing'
          a=changed.index(marker);b=changed.index(stop,a)
          added=changed[a:b]
          assert 'function u18DriverPanel(x)' in added and 'function u18LoadDriver(x)' in added,'U-02 driver read missing'
          changed=changed[:a]+changed[b:]
          # BRIEF-18b P-03: undo only the approved no-phone explanation, never phone authorization.
          changed=undo(changed,'',"TLB.addDict({p18NoClientPhone:'Номер клиента недоступен'},{p18NoClientPhone:'Customer phone unavailable'});\n")
          changed=undo(changed,":aButton(ico('phone',18)+t('callRest'),'','a-call',`disabled aria-label=\"${t('noPh')}\"`)}",":client?aButton(ico('phone',18)+t('callRest'),\"TLB.toast(t('p18NoClientPhone'))\",'a-contact-missing',`aria-disabled=\"true\" title=\"${t('p18NoClientPhone')}\" aria-label=\"${t('p18NoClientPhone')}\"`):aButton(ico('phone',18)+t('callRest'),'','a-call',`disabled aria-label=\"${t('noPh')}\"`)}")
          changed=undo(changed,
             "<p class=\"a-compact-address\">${esc(address)}</p>${n===2?",
             "<p class=\"a-compact-address\">${esc(address)}</p>${client?u18DriverPanel(x):''}${n===2?")
          assert changed.count(new)==1 and changed.replace(new,old)==orig,'G-04 or U-02 driver-A beyond approved UI status'
          PY
          python3 -m py_compile tools/full_audit.py tools/gate1_local_seed.py tools/full_audit_seed.py tools/brief15b_webkit.py tools/brief18c_webkit.py tools/brief18d_webkit.py tools/brief19_sec18_local.py
      - name: Install immutable QA browsers and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps webkit chromium
          mkdir -p "$RUNNER_TEMP/gate1-qr" "$RUNNER_TEMP/full-audit-npm"
          npm --prefix "$RUNNER_TEMP/gate1-qr" install --no-save --ignore-scripts --package-lock=false qrcode-generator@1.4.4 jsqr@1.4.0
          npm --prefix "$RUNNER_TEMP/full-audit-npm" install --no-save --ignore-scripts --package-lock=false @supabase/supabase-js@2.117.2
      - uses: supabase/setup-cli@v1
        with: {version: 3.1.0}
      - name: Start isolated LOCAL Supabase schema-only test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/gate1_local_prepare.py
          test ! -e supabase/migrations/20261116001000_brief18.sql
          cp sql/proposed/brief18_delivery_instructions.sql supabase/migrations/20261116001000_brief18.sql
          supabase start >"$RUNNER_TEMP/local-start.log" 2>&1
          supabase db reset --local >"$RUNNER_TEMP/local-reset.log" 2>&1
          supabase status -o env >"$RUNNER_TEMP/local-status.env"
          python3 tools/gate1_local_env.py "$RUNNER_TEMP/local-status.env"
      - name: Original Gate1 tests + authentic H01 UI login through original application
        shell: bash
        env:
          GATE1_QR_DEPS: ${{ runner.temp }}/gate1-qr
          FULL_AUDIT_SUPABASE_UMD: ${{ runner.temp }}/full-audit-npm/node_modules/@supabase/supabase-js/dist/umd/supabase.js
          FULL_AUDIT_MODE: auth_only
          FULL_AUDIT_FAIL_FAST: '1'
          BRIEF19_SEC18_LOCAL: '1'
        run: |
          set -euo pipefail
          test "$SUPABASE_LOCAL_URL" = http://127.0.0.1:54321
          python3 tools/gate1_local_seed.py
          bash tools/check_all.sh >"$RUNNER_TEMP/brief15-gates.log"
          grep -Fxq 'GATE1_E2E: 16 / 16 LOCAL HTTP PASS' "$RUNNER_TEMP/brief15-gates.log"
          grep -E '^PASS BRIEF19_SEC18 |^BRIEF19_SEC18_LOCAL_PASS ' "$RUNNER_TEMP/brief15-gates.log"
          grep -Fxq 'BRIEF19_SEC18_LOCAL_PASS 16/16' "$RUNNER_TEMP/brief15-gates.log"
          python3 tools/full_audit_seed.py
          python3 tools/full_audit.py >"$RUNNER_TEMP/h01.log" 2>&1 || true
          grep -E '^H01_LOCAL_AUTHENTICATED|^FULL_APP_AUDIT' "$RUNNER_TEMP/h01.log" || true
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('qa-shots/full-audit/FINDINGS.json')
          assert p.exists(), 'H01 audit did not save findings'
          d=json.loads(p.read_text())
          verified=d.get('local_auth_verified',[])
          errors=[r for r in d.get('findings',[]) if r.get('type','').startswith('H01_')]
          print('H01_REAL_AUTH_VERIFIED',len(verified),'/24','blockers',len(errors))
          for r in errors[:5]:print('H01_BLOCKER',r.get('app'),r.get('type'),r.get('detail','')[:180])
          assert len(verified)==24 and not errors,'Original local-authenticated UI is NOT verified'
          PY
      - name: Commit H-01 AFTER-login screenshots to isolated review branch (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/review/unified-fix-brief15-20261117
          test "$GITHUB_REPOSITORY" = merapplications-sketch/Talabat-v3
          mkdir -p qa-shots/unified-fix/h01
          python3 - <<'PY'
          import pathlib,shutil,json
          root=pathlib.Path('qa-shots/full-audit')
          report=json.loads((root/'FINDINGS.json').read_text('utf8'))
          verified=report.get('local_auth_verified',[])
          assert len(verified)==24, 'Must prove all 4 original roles x RU/EN x 3 widths'
          output=pathlib.Path('qa-shots/unified-fix/h01')
          index=['# TALABOT H-01 — original app authenticated LOCAL screenshots',
            '', 'Data: ephemeral synthetic Supabase, real login UI, no production, no tokens.',
            'Each screenshot is AFTER the login overlay disappeared and TLB.me role was verified.','']
          for app in ('customer','driver','merchant','admin'):
            for lang,w in (('ru',375),('en',390)):
              src=root/app/f'local_authenticated_{lang}_{w}_local.png'
              assert src.exists(),f'Missing verified screenshot: {app} {lang} {w}'
              name=f'{app}-{lang}-{w}-authenticated.png'
              shutil.copyfile(src,output/name)
              index.append(f'- [{app} / {lang} / {w}]({name})')
          (output/'INDEX.md').write_text('\n'.join(index)+'\n',encoding='utf8')
          (output/'PROOF.json').write_text(json.dumps({'verified':len(verified),
             'roles':['customer','driver','merchant','admin'],
             'widths':[375,390,430],'languages':['ru','en'],
             'backend':'disposable LOCAL Supabase; original HTML; actual login UI',
             'token_data_in_evidence':False},indent=2),encoding='utf8')
          print('H01_BRANCH_SCREENSHOTS_READY 8 synthetic images')
          PY
          git config user.name "talabot-brief15-h01"
          git config user.email "talabot-brief15-h01@users.noreply.github.com"
          git add -- qa-shots/unified-fix/h01/
          if git diff --cached --name-only | grep -Ev '^qa-shots/unified-fix/h01/'; then exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -m "test(H-01): 8 post-auth original-app LOCAL screenshots visible in review branch"
            # Clean ONLY temporary BRIEF-14 audit outputs. The verified screenshots
            # have already been copied into h01/ and committed; no user files touched.
            git restore --worktree -- qa-shots/full-audit/
            git clean -fd -- qa-shots/full-audit/
            git fetch origin review/unified-fix-brief15-20261117
            git rebase origin/review/unified-fix-brief15-20261117
            git push origin HEAD:refs/heads/review/unified-fix-brief15-20261117
          fi
      - name: Preserve source-backed local test screenshots and findings (no account secrets)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: talabot-brief15-h01-local-auth-evidence
          path: qa-shots/unified-fix/h01/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop throwaway local DB
        if: always()
        run: supabase stop --no-backup || true

  visual:
    if: github.repository == 'merapplications-sketch/Talabat-v3' && github.ref == 'refs/heads/review/unified-fix-brief15-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write  # strictly isolated branch + evidence-only upload
    steps:
      - name: Checkout exact isolated UI candidate for real-source WebKit snapshots
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: true, fetch-depth: 0}
      - name: No production/backend/finance changes in BRIEF-15
        shell: bash
        run: |
          set -euo pipefail
          BASE=f85f927db58280c24773768f4aa5ddc88956a448
          test "$GITHUB_REF" = refs/heads/review/unified-fix-brief15-20261117
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          for f in sql/proposed/gate1_cash_and_idempotent_delivery.sql sql/proposed/patch40_navigation_budget.sql; do
            test "$(git rev-parse "$BASE:$f")" = "$(git rev-parse "HEAD:$f")"
          done
          python3 - <<'PY'
          import pathlib,subprocess
          baseline='f85f927db58280c24773768f4aa5ddc88956a448'
          original=subprocess.check_output(['git','show',baseline+':talabat-core.js']).decode('utf8')
          current=pathlib.Path('talabat-core.js').read_text('utf8')
          start="    /* BRIEF-18 U-02 nonfinancial courier-instruction APIs; financial RPC unchanged. */"
          stop="    checkPromo: function (storeN, cart, code) {"
          assert current.count(start)==1 and current.count(stop)==1,'U-02 source uniqueness'
          a=current.index(start);b=current.index(stop,a)
          addition=current[a:b]
          assert all(addition.count('    '+x+': function')==1 for x in ('deliveryInstructionsReady','saveDeliveryInstructions','getDeliveryInstructions')),'U-02 methods missing'
          assert current[:a]+current[b:]==original,'Money / existing core code differs from frozen baseline'
          PY
          python3 -m py_compile tools/brief15_webkit.py tools/brief15b_webkit.py tools/brief18_webkit.py tools/brief18b_webkit.py tools/brief18c_webkit.py tools/brief18d_webkit.py tools/brief11_webkit_layout.py tools/full_audit.py
      - name: Install pinned WebKit test engine only in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps webkit
          mkdir -p "$RUNNER_TEMP/brief18c-leaflet"
          npm --prefix "$RUNNER_TEMP/brief18c-leaflet" install --no-save --ignore-scripts --package-lock=false leaflet@1.9.4
      - name: Diagnose the formerly failing 375px RU dish keyboard before the full visual suite
        shell: bash
        run: |
          set +e
          BRIEF15_CASES=F-04 BRIEF15_WIDTHS=375 BRIEF15_LANGS=ru python3 tools/brief15_webkit.py > "$RUNNER_TEMP/f04-probe.log" 2>&1
          rc=$?
          grep -E 'BRIEF15_WEBKIT_(COVERAGE|FAIL)' "$RUNNER_TEMP/f04-probe.log" | tail -8 || true
          if test "$rc" -ne 0; then echo 'F04_DIAGNOSTIC_ONLY: failing focus geometry, full-suite still runs'; fi
          exit 0
      - name: Run F-01..F-10 tests on original four-app HTML/JS, not synthetic DOM
        shell: bash
        run: |
          set +e
          python3 tools/brief15_webkit.py > "$RUNNER_TEMP/brief15-visual.log" 2>&1
          rc=$?
          grep -E 'BRIEF15_WEBKIT_(COVERAGE|FAIL)' "$RUNNER_TEMP/brief15-visual.log" | tail -35 || true
          echo "BRIEF15_VISUAL_RC=$rc" >> "$GITHUB_ENV"
          exit 0
      - name: Run source-backed WebKit O-12..O-15 and previous C/O regressions
        shell: bash
        run: |
          set +e
          python3 tools/brief11_webkit_layout.py > "$RUNNER_TEMP/brief15-cash.log" 2>&1
          rc=$?
          grep -E '(^O1[2345]_|LAYOUT_webkit_suite PASS|Traceback|AssertionError)' "$RUNNER_TEMP/brief15-cash.log" | tail -25 || true
          if test "$rc" -ne 0; then tail -12 "$RUNNER_TEMP/brief15-cash.log"; fi
          echo "BRIEF15_CASH_RC=$rc" >> "$GITHUB_ENV"
          exit 0
      - name: Create pinned BEFORE WebKit PNGs from original BRIEF-14 source (NO app edits)
        shell: bash
        run: |
          set -euo pipefail
          BASE=f85f927db58280c24773768f4aa5ddc88956a448
          BEFORE_WORK="$RUNNER_TEMP/brief15-original-before"
          mkdir -p qa-shots/unified-fix/before
          git worktree add --detach "$BEFORE_WORK" "$BASE" >/dev/null
          # Read-only old app source, using current test driver only to photograph it.
          cp tools/brief15_webkit.py "$BEFORE_WORK/tools/brief15_webkit.py"
          (cd "$BEFORE_WORK" && BRIEF15_WIDTHS=375 BRIEF15_LANGS=ru python3 tools/brief15_webkit.py >"$RUNNER_TEMP/brief15-before-webkit.log" 2>&1) || true
          for kind in F-01 F-02 F-03 F-04 F-05 F-06 F-07 F-08 F-09 F-10; do
            case "$kind" in
              F-01|F-02|F-03|F-04|F-05) app=customer;;
              F-06|F-07|F-08) app=merchant;;
              F-09) app=driver;;
              F-10) app=admin;;
            esac
            src="$BEFORE_WORK/qa-shots/unified-fix/$kind-$app-ru-375-after.png"
            test -s "$src" || { echo "MISSING original BEFORE screenshot $kind";exit 1; }
            cp "$src" "qa-shots/unified-fix/before/$kind-$app-ru-375-before.png"
          done
          for app in customer merchant driver admin; do
            src="$BEFORE_WORK/qa-shots/unified-fix/NOTIFY-01-$app-ru-375-after.png"
            test -s "$src" || { echo "MISSING original BEFORE NOTIFY-01 $app";exit 1; }
            cp "$src" "qa-shots/unified-fix/before/NOTIFY-01-$app-ru-375-before.png"
          done
          # One extra screenshot of the ORIGINAL cash full-mode before choosing
          # Different, produced in disposable baseline worktree only.
          python3 - "$BEFORE_WORK" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          p=root/'tools/brief11_webkit_layout.py'
          s=p.read_text('utf8')
          old='    p.locator("#b8-different").click()'
          assert s.count(old)==1
          s=s.replace(old,'    p.screenshot(path=str(OUT/f"webkit_cash_full_{lang}_{width}.png"))\n'+old)
          p.write_text(s,encoding='utf8')
          PY
          (cd "$BEFORE_WORK" && python3 tools/brief11_webkit_layout.py >"$RUNNER_TEMP/brief15-before-cash.log" 2>&1) || true
          SRC="$BEFORE_WORK/evidence/cash-sheet-brief11"
          test -s "$SRC/webkit_cash_full_ru_375.png"
