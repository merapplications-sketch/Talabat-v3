name: TALABOT Gate1 isolated checks (no production)
on:
  push:
    branches:
      - dev/gate1-f01-f04-20261116
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate1:
    if: github.repository == 'merapplications-sketch/Talabat-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read isolated branch without credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned offline core-contract dependencies in disposable runner only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gate1-qr"
          npm --prefix "$RUNNER_TEMP/gate1-qr" install --no-save --ignore-scripts --package-lock=false qrcode-generator@1.4.4 jsqr@1.4.0
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      # A production-only schema snapshot is REQUIRED but never fetched by this runner.
      # Local Supabase starts ONLY after the baseline hash/origin/checks are verified.
      - name: Fail-closed schema-only baseline verification (zero network)
        shell: bash
        run: python3 tools/gate1_local_prepare.py
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start disposable LOCAL Supabase (no cloud project)
        shell: bash
        run: |
          docker network create -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 gate1-local-ci
          supabase start --network-id gate1-local-ci > "$RUNNER_TEMP/gate1-start.log" 2>&1 || {
            echo "FAIL local Supabase Docker start (redacted startup diagnostics)" >&2
            grep -E "Error|ERROR|Failed|failed" "$RUNNER_TEMP/gate1-start.log" | sed -E 's/(sb_(secret|publishable)_[A-Za-z0-9_-]+)/[REDACTED]/g' || true
            exit 1
          }
          supabase db reset --local
          supabase status -o env > "$RUNNER_TEMP/gate1-local-status.env"
          python3 tools/gate1_local_env.py "$RUNNER_TEMP/gate1-local-status.env"
      - name: Seed five synthetic LOCAL Auth identities and fixture (no cloud calls)
        shell: bash
        run: |
          python3 tools/gate1_local_seed.py
      - name: Four source regressions and fail-closed existing/E2E gates
        shell: bash
        env:
          GATE1_QR_DEPS: ${{ runner.temp }}/gate1-qr
        run: |
          python3 -m py_compile tools/gate1_e2e.py
          bash tools/check_all.sh
      - name: Tear down disposable local Supabase containers
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi
          docker network rm gate1-local-ci >/dev/null 2>&1 || true
