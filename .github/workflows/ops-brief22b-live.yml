name: TALABOT OPS live RU 375 BRIEF-22b
on:
  push:
    branches: [qa/ops-brief22b-live-343fe080]
    paths: ['.github/workflows/ops-brief22b-live.yml', 'ops/brief22b_live.py']
permissions: {contents: write}
concurrency:
  group: ops-brief22b-live-ru375
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright/python:v1.57.0-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 343fe0807819f46c97895b14290eae81a19e472c
          path: candidate
          persist-credentials: false
      - name: Verify the live preview with the pinned WebKit fixture
        working-directory: candidate
        run: |
          python -m pip -q install playwright==1.57.0 Pillow==11.3.0
          python ../ops/brief22b_live.py ../qa-shots/ops-brief22b-live
      - name: Save one compressed live screenshot on the evidence branch
        run: |
          test "$GITHUB_REF_NAME" = "qa/ops-brief22b-live-343fe080"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name talabot-qa
          git config user.email talabot-qa@users.noreply.github.com
          git add -f -- qa-shots/ops-brief22b-live/ru-375.webp
          git commit -m "qa: record live WebKit RU 375 for preview 343fe080"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
