name: CI103 historical recovery and protected fingerprints
on:
  push:
    branches: [review/ci-native95-20261110]
    paths: ['tests/native103/**', '.github/workflows/ci103.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 ci97/unpack.py
      - run: python3 tests/native103/build-client.py isolated97 "$RUNNER_TEMP/client103"
      - run: node --test tests/native103/client.test.mjs tests/native103/ui.test.mjs
        env:
          CANDIDATE_UI: ${{ runner.temp }}/client103/customer.html
      - run: node --check "$RUNNER_TEMP/client103/talabat-core.js"
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-local-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10' 'typing_extensions==4.15.0'
      - run: python3 tests/native103/test_sql.py
      - run: python3 tests/native103/admission.py
      - name: Restore candidate, HMAC keys and fingerprints to separate synthetic database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PREPARE_RESTORE=1 python3 tests/native103/restore.py
          docker exec "$PG_CONTAINER" pg_dump -U postgres --no-owner restore103_source > "$RUNNER_TEMP/candidate103.sql"
          docker exec "$PG_CONTAINER" createdb -U postgres restore103_target
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d restore103_target < "$RUNNER_TEMP/candidate103.sql"
          python3 tests/native103/restore.py
          rm "$RUNNER_TEMP/candidate103.sql"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native103-synthetic-${{ github.sha }}
          path: |
            native103-tests.json
            native103-admission.json
            native103-restore.json
          retention-days: 7
  required103:
    if: always()
    needs: [client, postgres]
    runs-on: ubuntu-24.04
    steps:
      - run: test "$REPLAY" = success && test "$POSTGRES" = success
        env:
          REPLAY: ${{ needs.client.result }}
          POSTGRES: ${{ needs.postgres.result }}
