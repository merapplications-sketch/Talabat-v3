    addPromo: function (f) { if (!validPromo(f)) return badPromo(); return sb.from('promo_codes').insert(f).then(done); },
    updatePromo: function (id, f) { if (!validPromo(f)) return badPromo(); return sb.from('promo_codes').update(f).eq('id', id).then(done); },
    deletePromo: function (id) { return sb.from('promo_codes').delete().eq('id', id).then(done); },
    isFav: function (storeId) { return DB.favs.indexOf(storeId) >= 0; },
    toggleFav: function (storeId) {
      var has = DB.favs.indexOf(storeId) >= 0;
      DB.favs = has ? DB.favs.filter(function (x) { return x !== storeId; }) : DB.favs.concat([storeId]);
      fireSoon();
      var q = has ? sb.from('favorites').delete().eq('user_id', ME.id).eq('store_id', storeId) : sb.from('favorites').insert({ user_id: ME.id, store_id: storeId });
      return q.then(function (r) { if (r.error) console.error(r.error); sigs = {}; return refresh(['misc']); });
    }
  };
  TLBref = window.TLB;
})();
</script>

let DLV={},DRV=null,tab='o',online=false,SUM=null,chatOpen=false,invOpen=false,lastN=-1,DV=null,ftm=null,phErr='',SHF=false,SWB=0,LASTACT=null,CXL=null,DM=null,DMK='';

let GEO={state:'idle',lat:null,lng:null,acc:null,sent:0,wid:null},wake=null;
const ping=()=>TLB.ping(online);
function startGeo(){if(GEO.wid!=null)return;if(!navigator.geolocation){GEO.state='na';return}GEO.state='wait';
  GEO.wid=navigator.geolocation.watchPosition(p=>{GEO.lat=p.coords.latitude;GEO.lng=p.coords.longitude;GEO.acc=p.coords.accuracy;GEO.state='ok';pushGeo(false);render()},
    e=>{GEO.state=e&&e.code==1?'denied':'err';render()},{enableHighAccuracy:true,maximumAge:5000,timeout:30000})}
function stopGeo(){if(GEO.wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(GEO.wid);GEO.wid=null;GEO.state='idle';GEO.lat=null;GEO.lng=null}
function pushGeo(force){if(!online||GEO.lat==null)return;const n=Date.now();if(!force&&n-GEO.sent<8000)return;GEO.sent=n;TLB.sendLocation(GEO.lat,GEO.lng,GEO.acc)}
async function keepAwake(){try{if(navigator.wakeLock&&online&&!wake&&!document.hidden){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}
function releaseAwake(){try{if(wake){wake.release();wake=null}}catch(e){}}
const due=o=>Math.max(0,Math.round(((+o.total||0)-(+o.walletUsed||0))*100)/100);
const todayStart=()=>{const x=new Date();x.setHours(0,0,0,0);return x.getTime()};
function shiftSummary(){const me=DRV.id,l=TLB.orders(o=>o.driver==me&&o.status=='delivered'&&(o.doneAt||o.createdAt)>=todayStart());return{n:l.length,earn:l.reduce((s,o)=>s+(+o.payout||0),0),cash:TLB.myCash()}}
async function endShift(){if(!online)return;if(mine()){alert(t('endBusy'));return}if(!confirm(t('endQ')))return;
  online=false;TLB.ring(false);flashTitle(false);stopGeo();releaseAwake();SUM=shiftSummary();await ping();render()}
async function startShift(){TLB.unlockAudio();TLB.testSound();online=true;await ping();startGeo();keepAwake();render()}
function unlockSound(){TLB.unlockAudio();TLB.testSound();render()}
function flashTitle(on){if(on&&!ftm){let k=0;ftm=setInterval(()=>{document.title=(k++%2)?'Talabat':'🔔 '+t('newOrderT')},900)}else if(!on&&ftm){clearInterval(ftm);ftm=null;document.title='Talabat'}}
async function savePhone(){const v=($('ph')||{}).value||'',r=await TLB.setMyPhone(v);if(r&&r.error){phErr=t('err_'+r.error);render();return}phErr='';render()}
function phoneGate(){return `<div class="pg"><div class="card" style="text-align:center;padding:22px 18px"><div class="hico" style="margin:0 auto 12px;width:54px;height:54px">${ico('phone',26)}</div><h3 style="margin-bottom:6px">${t('phReqT')}</h3><p class="xs" style="color:var(--mut);margin-bottom:14px;line-height:1.5">${t('phReqS')}</p><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="17" placeholder="+992 90 000 00 00" style="width:100%;height:50px;border:1.5px solid #eeeef1;border-radius:14px;padding:0 14px;font-size:14px;background:#f7f7f9;margin-bottom:8px">${phErr?`<div class="xs" style="color:var(--bad);font-weight:600;margin-bottom:8px">${esc(phErr)}</div>`:''}<button class="b" onclick="savePhone()">${t('phSave')}</button></div></div>`}
async function decline(id){const r=await TLB.decline(id);if(r&&r.error)alert(t('err_'+r.error))}
async function take(id){const r=await TLB.driverAccept(id);if(r.error)alert(t('err_'+r.error))}
async function step(id,s){const r=await TLB.setStatus(id,s);if(r.error)alert(t('trans'))}
function say(id,txt){chatOpen=true;TLB.chat(id,'driver',txt)}
function sendChat(id){const e=$('ci'),v=e.value.trim();if(!v)return;e.value='';TLB.chat(id,'driver',v)}
function sendLoc(id){TLB.pickLocation((la,ln)=>TLB.chat(id,'driver','LOC:'+la.toFixed(6)+','+ln.toFixed(6)))}
/* the last step: a photo when the customer asked to leave it at the door, the cash amount when he pays cash */
/* v58 UAT004 (T4): one delivery confirmation at a time per order, on every path (modal and direct; driver A calls the same
   functions). A screen guard only: it does not prove the server refuses a second confirmation (LINK-03). */
function deliverClick(id){if(DLV[id])return;const o=TLB.order(id);if(!o)return;const cash=TLB.isCash(o);
  if(cash||o.leaveAtDoor){DV={id,cash,photo:!!o.leaveAtDoor,total:due(o),amt:String(due(o)),note:'',ph:null,up:false};render()}
  else finish(id,null,null,null)}
async function finish(id,cash,note,photo){if(DLV[id])return false;DLV[id]=1;render();let r;
  try{r=await TLB.deliver(id,cash,note,photo)}catch(e){r={error:'generic'}}finally{delete DLV[id];render()}
  if(!r||r.error){alert(t('err_'+((r&&r.error)||'generic')));return false}return true}
async function takePhoto(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f||!DV)return;DV.up=true;render();
  const r=await TLB.uploadProof(f,DV.id);if(!DV)return;DV.up=false;if(r.error){alert(t('err_'+r.error));render();return}DV.ph=r;render()}
async function confirmDeliver(){if(!DV||DV.up||DLV[DV.id])return;if(DV.photo&&!DV.ph){TLB.toast(t('err_photo_required'),true);return}
  let amt=null;if(DV.cash){amt=parseFloat(DV.amt);
    if(!(amt>=0)){TLB.toast(t('err_cash_required'),true);return}
    if(Math.abs(amt-DV.total)>0.004&&!DV.note.trim()){TLB.toast(t('err_note_required'),true);return}}
  if(await finish(DV.id,amt,DV.cash?DV.note:null,DV.ph?DV.ph.path:null)){DV=null;render()}}
/* the 4 steps of a delivery, each confirmed with a swipe */
const stepOf=a=>a.status=='pickedup'?(a.arrivedCustAt?4:3):(a.arrivedStoreAt?2:1);
async function swDo(){const a=mine();if(!a||SWB||DLV[a.id])return;const n=stepOf(a);if(n==2&&a.status!='ready')return;SWB=1;render();let r=null;
  try{if(n==1)r=await TLB.driverArrived(a.id,'store');
    else if(n==2)r=await TLB.setStatus(a.id,'pickedup');
    else if(n==3){r=await TLB.driverArrived(a.id,'customer');if(r&&!r.error)TLB.chat(a.id,'driver',t('atCustMsg'))}
    else{SWB=0;deliverClick(a.id);return}
    if(r&&r.error)alert(t('err_'+r.error)||t('trans'));else{SHF=false;DMK=''}}
  finally{SWB=0;render()}}

function aOfferCard(x){return `<article class="card a-offer"><div class="a-offer-heading"><span class="badge">${t(x.offer.mode==='single'?'forYou':'openOrd')}</span><div><small>${t('aEarn')}</small><b>${aAmount(x.payout)} <small>TJS</small></b></div></div>${x.offer.mode==='single'?`<div class="cd"><i style="width:${Math.max(0,Math.min(100,x.offer.left/30*100))}%"></i></div><p class="xs mut">${Math.ceil(x.offer.left)} ${t('secS')}</p>`:''}<div class="a-offer-route"><section>${ico('store',20)}<div><small>${t('pick')}</small><h2>${esc(x.store)}</h2><p>${esc(aStore(x).address||t('aStoreAddress'))}</p>${x.offer.dist!=null?`<small>${x.offer.dist.toFixed(1)} ${t('kmToRest')}</small>`:''}</div></section><section>${ico('pin',20)}<div><small>${t('drop')}</small><b>${esc(x.address)}</b>${x.deliveryKm?`<small>${t('restToCust').replace('{n}',x.deliveryKm)}</small>`:''}</div></section></div><div class="a-offer-collect"><small>${t(aCash(x)?'aCollect':'paidOnline')}</small><b>${aCash(x)?aAmount(due(x))+' TJS':'0,00 TJS'}</b></div>${aCashDetail(x)}${aButton(t('aOpen')+' <span>›</span>',`aSelect(${aId(x.id)})`,'b')}</article>`}
vOrders=function(){if(ASelected&&!aOffer())ASelected=null;let h=AOldOrders();if(online&&!mine()&&!TLB.me().blocked){const offers=TLB.offers().filter(x=>x.offer.left>0);for(const x of offers)h=h.replace(offerCard(x),aOfferCard(x))}return h};

modal=function(){if(CXL||DV||chatOpen)return AOldModal();if(!AAux)return '';const task=aTask();let html='';if(AAux==='menu')html=`<h2>${t('aMenu')}</h2>${[['o','dOrders'],['h','dHist'],['m','dMe']].map(([k,label])=>aButton(t(label),`aTab('${k}')`,'b s')).join('')}`;else if(AAux==='details'&&task)html=`<h2>#${esc(task.id)}</h2>${aExtraInfo(task)}${invoice(task)}${aCashDetail(task)}${aNext(task)}`;else if(AAux==='accessible'&&task)html=`<h2>${aActionLabel(task)}?</h2>${aButton(t('aConfirm'),'AAux=null;aRun()','b')}`;return `<div class="ov a-aux" onclick="aClose()"><div class="md" role="dialog" aria-modal="true" aria-label="${t('aDetails')}" onclick="event.stopPropagation()">${aButton(ico('x',20),'aClose()','round a-modal-close',`aria-label="${t('closeB')}"`)}${html}${aButton(t('closeB'),'aClose()','b s')}</div></div>`};
function aAccessible(){const x=aTask();if(!x||aBlocked(x)||AFlight||(AResult?.kind==='success'&&String(AResult.id)===String(x.id)&&AResult.n===aTaskStage(x)))return;AAux='accessible';render();document.querySelector('.a-aux .b')?.focus()}
async function aDecline(id){const n=0;if(AFlight)return;AFlight={id,kind:'decline'};render();try{const r=await TLB.decline(id);if(r?.error)AResult={id,n,kind:'error',message:t('err_'+r.error)};else ASelected=null}catch(e){AResult={id,n,kind:'error',message:t('aFail')}}finally{AFlight=null;render()}}
/* Existing stage operations and arguments, only presentation/duplicate guards are added. */
async function aRun(){const x=aTask();if(!x||AFlight||aBlocked(x))return;const n=aTaskStage(x);if(n===4){deliverClick(x.id);return}if(AResult?.kind==='success'&&String(AResult.id)===String(x.id)&&AResult.n===n)return;const id=x.id;AFlight={id,n};AResult=null;SWB=1;render();try{let r;if(n===0)r=await TLB.driverAccept(id);else if(n===1)r=await TLB.driverArrived(id,'store');else if(n===2)r=await TLB.setStatus(id,'pickedup');else if(n===3){r=await TLB.driverArrived(id,'customer');if(r&&!r.error)TLB.chat(id,'driver',t('atCustMsg'))}if(!r||r.error){AResult={id,n,kind:'error',message:r?.error?t('err_'+r.error):t('aFail')}}else{AResult={id,n,kind:'success'};TLB.toast(t('aSuccess'));if(n===0)ASelected=null;ASnap='default';SHF=false;DMK=''}}catch(e){AResult={id,n,kind:'error',message:t('aFail')}}finally{AFlight=null;SWB=0;render()}}
