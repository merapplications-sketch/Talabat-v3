<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TALABOT — رحلة دفع اختبارية</title><style>body{font-family:system-ui;background:#f5f7fb;color:#18253a;max-width:900px;margin:24px auto;padding:16px}header,section{background:white;border-radius:16px;padding:20px;margin:16px 0}button{padding:12px;margin:5px;border:0;border-radius:10px;background:#185cd4;color:white;cursor:pointer}button:disabled{opacity:.5}nav button[aria-pressed=true]{background:#12305b}article{padding:14px;border-bottom:1px solid #ddd}.notice{background:#fff1ce;padding:16px;border-radius:12px}pre{white-space:pre-wrap}#error{color:#a01515}</style><header><h1>TALABOT · رحلة الطلب المدفوع</h1><div class="notice">بيئة اختبار محلية فقط — مزوّد دفع اصطناعي يؤكد النتيجة من الخادم. لا بطاقة حقيقية ولا خصم. تبديل الأدوار أداة اختبار.</div><p>الترتيب: الزبون يدفع ← المطعم يبدأ التحضير ← الإدارة تعيّن السائق ← المطعم يجهّز ← السائق يستلم ويسلّم.</p></header><nav id="roles"></nav><p id="error" role="alert"></p><section><h2 id="title"></h2><div id="content"></div></section><script>
let role='customer',sessions={},key=crypto.randomUUID();const names={customer:'الزبون',merchant:'المطعم',driver:'السائق',admin:'الإدارة'};
async function api(path,data){let r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessions[role]},body:data?JSON.stringify(data):undefined});let v=await r.json();if(!r.ok)throw Error(v.error);return v}
async function act(op,id,outcome){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await api('/action',{op,id,outcome,key});if(op==='create')key=crypto.randomUUID();document.querySelector('#error').textContent=''}catch(e){document.querySelector('#error').textContent=e.message}finally{await render()}}
function button(label,op,id,outcome){return `<button onclick="act('${op}','${id||''}','${outcome||''}')">${label}</button>`}
async function render(){document.querySelector('#roles').innerHTML=Object.entries(names).map(([r,n])=>`<button aria-pressed="${r===role}" onclick="role='${r}';render()">${n}</button>`).join('');document.querySelector('#title').textContent=names[role];let s=await api('/state');let h=role==='customer'?button('طلب جديد ودفع إلكتروني اختباري','create'):'';for(let p of s.intents){h+=`<article>محاولة ${p.id.slice(0,8)} — ${p.amount} ${p.currency} — <b>${p.state}</b> ${p.order_id?'الطلب #'+p.order_id:''}`;if(role==='customer'&&p.state==='pending')h+=button('تأكيد نجاح الدفع من مزوّد الاختبار','provider',p.id,'succeeded')+button('دفع معلّق','provider',p.id,'pending')+button('دفع فاشل','provider',p.id,'failed');if(role==='customer'&&p.state==='succeeded')h+=button('إعادة إشعار الدفع نفسه','provider',p.id,'succeeded');h+='</article>'}
for(let o of s.orders){h+=`<article data-order="${o.id}"><h3>طلب #${o.id} · ${o.status}</h3><p>${o.total} TJS · مدفوع إلكترونياً اختبارياً</p>`;if(role==='driver')h+='<p class="notice">لا تدفع للمطعم ولا تقبض من الزبون. المطلوب نقداً: 0 TJS.</p>';if(role==='merchant'&&o.status==='pending')h+=button('قبول وبدء التحضير','preparing',o.id);if(role==='admin'&&o.status==='preparing')h+=button('تعيين السائق','assign',o.id);if(role==='merchant'&&o.status==='preparing')h+=button('الطلب جاهز للاستلام','ready',o.id);if(role==='driver'&&o.status==='ready')h+=button('استلام الطلب المدفوع','pickedup',o.id);if(role==='driver'&&o.status==='pickedup')h+=button('تأكيد التسليم دون قبض نقدي','deliver',o.id);h+='</article>'}document.querySelector('#content').innerHTML=h||'<p>لا طلبات متاحة.</p>'}
fetch('/sessions').then(r=>r.json()).then(v=>{sessions=v;render()});
</script></html>
