services:
  db:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_PASSWORD: ${LAB_PASSWORD}
      POSTGRES_DB: talabot_pilot
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, max_connections=200]
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d talabot_pilot']
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${LAB_PASSWORD}@db:5432/talabot_pilot?search_path=auth
      GOTRUE_SITE_URL: http://127.0.0.1:8080
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:8080/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_SECRET: ${LAB_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_RATE_LIMIT_SIGN_UP: 10000
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 10000
    ports: ['127.0.0.1:9999:9999']
  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${LAB_PASSWORD}@db:5432/talabot_pilot
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${LAB_JWT_SECRET}
      PGRST_DB_POOL: 20
      PGRST_DB_MAX_ROWS: 1000
    ports: ['127.0.0.1:3000:3000']
