      if (o.lat != null && (!(num(o.lat) >= -90 && num(o.lat) <= 90) || !(num(o.lng) >= -180 && num(o.lng) <= 180))) return Promise.resolve({ error: 'bad_value' });
      return rpc('place_order', { p_store: s.id, p_items: items, p_tip: o.tip || 0, p_payment: o.payment || '', p_address: String(o.address || '').slice(0, 200), p_lat: isNaN(num(o.lat)) ? null : num(o.lat), p_lng: isNaN(num(o.lng)) ? null : num(o.lng), p_promo: (o.promo && /^[A-Za-z0-9_-]{3,20}$/.test(o.promo)) ? o.promo : null, p_key: (o.key && /^[A-Za-z0-9_-]{8,64}$/.test(o.key)) ? o.key : null, p_fee: isNaN(num(o.fee)) ? null : num(o.fee), p_wallet: (isNaN(num(o.wallet)) || num(o.wallet) <= 0) ? null : Math.round(num(o.wallet) * 100) / 100, p_points: (o.points > 0 && o.points <= 100000000) ? Math.floor(o.points) : null, p_extra: o.extra || null })
        .then(function (r) { return r.error ? r : { id: r.data }; });
    },
    checkPromo: function (storeN, cart, code) {
      var s = storeByName(storeN), k = String(code || '').trim();
      if (!s || !/^[A-Za-z0-9_-]{3,20}$/.test(k)) return Promise.resolve({ error: 'promo_invalid' });
      var items = linesOf(cart, null);
      if (!items) return Promise.resolve({ error: 'promo_invalid' });
      return sb.rpc('check_promo', { p_code: k, p_store: s.id, p_items: items }).then(function (r) {
        if (r.error) return { error: errKey(r.error) };
        var d = r.data || {};
        return d.ok ? { discount: +d.discount, base: +d.base || 0 } : { error: errKey({ message: d.error }), min: +d.min || 0, have: +d.have || 0 };
      });
    },
    setStatus: function (id, to) { return rpc('set_order_status', { p_id: id, p_to: to }); },
    patch: function (id, f) { return rpc('set_prep_time', { p_id: id, p_min: f.prepTime }, true); },
    driverAccept: function (id) { return rpc('driver_accept', { p_id: id }).then(function (r) { return r.error ? r : (r.data === true ? { ok: true } : { error: 'taken' }); }); },
    deliver: function (id, cash, note, photo) { var a = { p_id: id, p_cash: cash, p_note: note || null }; if (photo) a.p_photo = photo; return rpc('deliver_order', a); },
    /* batch 2 (patch 34): courier arrival steps, photo proof (private bucket), restaurant cancel with a reason */
    driverArrived: function (id, where) { if (where !== 'store' && where !== 'customer') return Promise.resolve({ error: 'bad_value' }); return rpc('driver_arrived', { p_id: id, p_where: where }); },
    rejectOrder: function (id, reason, note) { if (['out_of_stock', 'too_busy', 'closing', 'other'].indexOf(reason) < 0) return Promise.resolve({ error: 'bad_value' }); return rpc('reject_order', { p_id: id, p_reason: reason, p_note: note ? String(note).slice(0, 200) : null }); },
    uploadProof: function (file, orderId) {
      return new Promise(function (resolve) {
        if (!file || !/^image\//.test(file.type || '') || file.size > 25 * 1024 * 1024) return resolve({ error: 'bad_value' });
        var fr = new FileReader(); fr.onerror = function () { resolve({ error: 'generic' }); };
        fr.onload = function () {
          var im = new Image(); im.onerror = function () { resolve({ error: 'bad_value' }); };
          im.onload = function () {
            var k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
            var preview = c.toDataURL('image/jpeg', 0.6);
            if (!c.toBlob || !sb || !sb.storage || !ME) return resolve({ error: 'generic' });
            c.toBlob(function (blob) {
              if (!blob) return resolve({ error: 'generic' });
              var id = ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 12))).replace(/[^A-Za-z0-9_-]/g, '');
              var path = ME.id + '/' + orderId + '/' + id + '.jpg';
              sb.storage.from('proofs').upload(path, blob, { contentType: 'image/jpeg', upsert: false }).then(function (r) {
                resolve(r.error ? { error: 'photo_upload' } : { path: path, preview: preview });
              }, function () { resolve({ error: 'photo_upload' }); });
            }, 'image/jpeg', 0.72);
          };
          im.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    },
    proofUrl: function (path) { if (!path || !sb || !sb.storage) return Promise.resolve(null); return sb.storage.from('proofs').createSignedUrl(path, 3600).then(function (r) { return r && r.data ? r.data.signedUrl : null; }, function () { return null; }); },
    leaflet: function (cb) { loadLeaflet(cb); },
    chat: function (id, sender, text) { return sb.from('order_chat').insert({ order_id: id, sender_id: ME.id, body: String(text).slice(0, 200) }).then(doneQ); },

    addItem: function (storeN, f) { var s = storeByName(storeN); if (!s || !validItem(f)) return badStore(); return sb.from('menu_items').insert({ store_id: s.id, name: f.name, price: f.price, image_url: f.image || null, popular: !!f.popular, section: cleanSection(f.section), discount_pct: cleanPct(f.discount) }).then(done); },
    updateItem: function (id, f) { f = Object.assign({}, f); if (!validItem(f)) return badStore(); if ('image' in f) { f.image_url = f.image || null; delete f.image; } if ('discount_pct' in f) { var dp = +f.discount_pct; if (!isFinite(dp) || dp < 0 || dp > 100) return badStore(); f.discount_pct = Math.round(dp * 100) / 100; } if ('section' in f) { if (String(f.section == null ? '' : f.section).trim().length > 40) return badStore(); f.section = cleanSection(f.section); } return sb.from('menu_items').update(f).eq('id', id).then(done); },
    deleteItem: function (id) { return sb.from('menu_items').delete().eq('id', id).then(done); },
    approveItem: function (id) { return sb.from('menu_items').update({ approved: true }).eq('id', id).then(done); },

    addStore: function (f) { var c = cleanStore(f); if (!validStore(c)) return badStore(); return sb.from('stores').insert(c).then(done); },
    updateStore: function (id, f) { var c = cleanStore(f); if (!validStore(c)) return badStore(); return sb.from('stores').update(c).eq('id', id).then(done); },
    refreshRating: function (storeId) {

        toast(t('saved')); return refresh().then(function () { return { ok: true }; });
      }).catch(function () { toast(t('err_rating_fail'), true); return { error: 'rating_fail', toasted: true }; });
    },
    setMyDiscount: function (storeN, pct) { var s = storeByName(storeN), v = +pct; if (!s || !isFinite(v) || v < 0 || v > 100) return Promise.resolve({ error: 'bad_value' }); return rpc('set_my_discount', { p_store: String(s.id), p_pct: v }, true); },
    updateMyStore: function (storeN, f) { var s = storeByName(storeN); if (!s) return Promise.resolve({ error: 'generic' }); return rpc('update_my_store', { p_store: s.id, p_description: f.description == null ? null : f.description, p_cover: f.cover || null, p_logo: f.logo || null }, true); },
    perms: function () { return MYPERMS.slice(); },
    isSuper: function () { return !!ME && ME.role === 'admin'; },
    can: function (p) { return MYPERMS.indexOf(p) >= 0; },
    staffList: function () { return sb.rpc('staff_list').then(function (r) { return r.error ? { error: errKey(r.error), rows: [] } : { rows: r.data || [] }; }); },
    staffSet: function (email, perms, active) {
      email = String(email || '').trim().toLowerCase();
      var ok = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) && email.length <= 120 && Array.isArray(perms) && perms.every(function (x) { return ALL_PERMS.indexOf(x) >= 0; }) && (perms.length > 0 || active === false);
      if (!ok) return Promise.resolve({ error: 'bad_value' });
      return rpc('staff_set', { p_email: email, p_perms: perms, p_active: active !== false }, true);
    },
    brandRoute: function (brand, lat, lng, names) { return sb.rpc('brand_route', { p_brand: brand, p_lat: lat, p_lng: lng, p_names: names || null }).then(function (r) { return r.error ? [] : (r.data || []); }); },
    brandStats: function (brand, days) { return sb.rpc('brand_stats', { p_brand: brand, p_days: days || 30 }).then(function (r) { return r.error ? null : r.data; }); },
    brandCreate: function (name, ownerEmail) { name = String(name || '').trim(); if (name.length < 2 || name.length > 60) return Promise.resolve({ error: 'bad_value' }); return rpc('brand_create', { p_name: name, p_owner_email: ownerEmail || null }, true); },
    brandAttach: function (storeId, brandId, branch) { if (!/^[0-9a-f-]{36}$/i.test(String(brandId))) return Promise.resolve({ error: 'bad_value' }); return rpc('brand_attach', { p_store: storeId, p_brand: brandId, p_branch: String(branch || '').trim().slice(0, 60) }, true); },
    brandDetach: function (storeId) { return rpc('brand_detach', { p_store: storeId }, true); },
    branchCreate: function (brand, branch, address, lat, lng, phone) { branch = String(branch || '').trim(); if (branch.length < 2 || branch.length > 60) return Promise.resolve({ error: 'bad_value' }); return rpc('branch_create', { p_brand: brand, p_branch: branch, p_address: String(address || '').trim().slice(0, 200), p_lat: lat, p_lng: lng, p_phone: String(phone || '').trim().slice(0, 30) }, true); },
    brandSyncMenu: function (from, to) { return rpc('brand_sync_menu', { p_from: from, p_to: to }, true); },
    brands: function () { return (DB.brands || []); },
    staffRemove: function (id) { if (!/^[0-9a-f-]{36}$/i.test(String(id))) return Promise.resolve({ error: 'bad_value' }); return rpc('staff_remove', { p_user: id }, true); },
    assignOwner: function (id, email) { return rpc('assign_owner', { p_store: id, p_email: email }, true); },
    setDriverStatus: function (id, st) { return sb.from('profiles').update({ driver_status: st }).eq('id', id).then(done); },
    setMyPhone: function (p) { p = normPhone(p); if (!p) return Promise.resolve({ error: 'bad_phone' }); return rpc('set_my_phone', { p_phone: p }, true).then(function (r) { return r.error ? r : { ok: true, phone: p }; }); },
    setDriverBlocked: function (id, v) { return sb.from('profiles').update({ accept_blocked: !!v }).eq('id', id).then(done); },
    setDriverLimit: function (id, v) { v = +v; if (!isFinite(v) || v <= 0 || v > 1000000) return badStore(); return sb.from('profiles').update({ cash_limit: v }).eq('id', id).then(done); },
    settleCash: function(driverId){return finCommand('settle_cash',driverId,null,null);},

    banners: function (all) { var now = Date.now(); return DB.banners.filter(function (b) { return all || (b.is_active && (!b.starts_at || Date.parse(b.starts_at) <= now) && (!b.ends_at || Date.parse(b.ends_at) > now)); }); },
    addBanner: function (f) { if (!validBanner(f)) return badBanner(); return sb.from('banners').insert(f).then(done); },
    updateBanner: function (id, f) { if (!validBanner(f)) return badBanner(); return sb.from('banners').update(f).eq('id', id).then(done); },
    deleteBanner: function (id) { return sb.from('banners').delete().eq('id', id).then(done); },
    promos: function () { return DB.promos; },
    addPromo: function (f) { if (!validPromo(f)) return badPromo(); return sb.from('promo_codes').insert(f).then(done); },
    updatePromo: function (id, f) { if (!validPromo(f)) return badPromo(); return sb.from('promo_codes').update(f).eq('id', id).then(done); },
    deletePromo: function (id) { return sb.from('promo_codes').delete().eq('id', id).then(done); },
    isFav: function (storeId) { return DB.favs.indexOf(storeId) >= 0; },
    toggleFav: function (storeId) {
      var has = DB.favs.indexOf(storeId) >= 0;
      DB.favs = has ? DB.favs.filter(function (x) { return x !== storeId; }) : DB.favs.concat([storeId]);
      fireSoon();
      var q = has ? sb.from('favorites').delete().eq('user_id', ME.id).eq('store_id', storeId) : sb.from('favorites').insert({ user_id: ME.id, store_id: storeId });
      return q.then(function (r) { if (r.error) console.error(r.error); sigs = {}; return refresh(['misc']); });
    }
  };
  TLBref = window.TLB;
})();

<style>.f-warning{background:#fff4e9;color:#7c3917;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:20px}.f-warning .b{min-height:44px;margin-top:8px}.f-ref{display:block;overflow-wrap:anywhere;word-break:break-word;font-size:12px;line-height:18px;color:#536176}.f-wallet input{font-size:16px;max-width:100%;min-width:0}.f-wallet label{display:block;margin:10px 0 4px;font-size:13px}.f-entry{border-top:1px solid #e0e5ec;padding:12px 0;overflow-wrap:anywhere}.f-entry p{margin:6px 0;font-size:13px;line-height:20px}.f-command{font-size:13px;line-height:20px;overflow-wrap:anywhere;margin:8px 0}.f-details{font-size:12px;line-height:18px;white-space:pre-wrap;overflow-wrap:anywhere}.f-wallet .row>strong{font-size:18px}.f-wallet button,.f-command button{min-height:44px}.f-entry .row{flex-wrap:wrap}

<script>/* Admin finance presentation only. Core owns read snapshots and command state. */
window.TLB.addDict({fDriverInfo:'Курьер — финансы',fLoadFail:'Не удалось загрузить',fStale:'Данные не обновлены. Показаны последние успешно загруженные значения.',fRetry:'Повторить загрузку',fLoading:'Загружаем…',fActorUnknown:'Имя сотрудника недоступно',fActorNone:'Исполнитель не указан в записи',fUnknown:'Результат операции не подтверждён. Не отправляйте её повторно.',fCheck:'Проверить результат',fPending:'Ожидаем ответ сервера…',fDenied:'Финансовое исполнение требует явного допуска бухгалтера и проверенной серверной версии.',fError:'Операция отклонена. Проверьте данные и повторите.',fEarnOnly:'Начислено по загруженным заказам — не подтверждение выплаты и не остаток долга.',fHeld:'Наличные клиентов у курьера',fSettled:'Передано в офис',fRef:'Ссылка на запись',fWalletSearch:'Поиск клиента для просмотра кошелька',fScope:'Финансовый просмотр: без адресов, геопозиции и редактирования профиля.',fNoName:'Имя не указано'},
{fDriverInfo:'Courier — finance',fLoadFail:'Could not load',fStale:'Not refreshed. Showing the last successfully loaded values.',fRetry:'Retry loading',fLoading:'Loading…',fActorUnknown:'Staff name unavailable',fActorNone:'Actor not recorded',fUnknown:'Operation result is unconfirmed. Do not send it again.',fCheck:'Check result',fPending:'Waiting for server…',fDenied:'Financial execution requires explicit accountant authorization and the reviewed server version.',fError:'Operation rejected. Check the inputs and retry.',fEarnOnly:'Earned on loaded orders — not proof of payment or a net balance.',fHeld:'Customer cash held by courier',fSettled:'Handed to office',fRef:'Record reference',fWalletSearch:'Find a customer wallet',fScope:'Finance view: no addresses, location or profile editing.',fNoName:'Name not provided'});
TLB.addDict({fDetails:'Детали',fCopy:'Скопировать',fCopyFailed:'Не удалось скопировать. Выделите текст в деталях.',fDone:'Операция подтверждена',fRequest:'Запрос операции',fWaitButton:'Ожидание ответа…',fUnknownButton:'Заблокировано до проверки',fChecking:'Проверяем результат…',fAuditSettlement:'Приём наличных от курьера',fAuditWallet:'Изменение кошелька',fAuditOrder:'Изменение заказа',fAuditOther:'Изменение записи',fAuditError:'Ошибка приложения',fAmountMissing:'Сумма движения не указана в записи',fOrder:'Заказ',fTime:'Время',fCashStale:'Остаток наличных не обновлён. Показан предыдущий баланс.',fCashLoading:'Обновляем остаток наличных…'},
{fDetails:'Details',fCopy:'Copy',fCopyFailed:'Could not copy. Select the text in details.',fDone:'Operation confirmed',fRequest:'Operation request',fWaitButton:'Waiting for response…',fUnknownButton:'Blocked until checked',fChecking:'Checking result…',fAuditSettlement:'Cash received from courier',fAuditWallet:'Wallet change',fAuditOrder:'Order change',fAuditOther:'Record change',fAuditError:'Application error',fAmountMissing:'Movement amount not recorded',fOrder:'Order',fTime:'Time',fCashStale:'Cash has not refreshed. Showing the previous balance.',fCashLoading:'Refreshing cash balance…'});
const FUI={logBusy:false,walletBusy:{},messages:{},checks:{}};
function fActor(id){if(!id)return `<span>${t('fActorNone')}</span>`;const a=TLB.financeActor(id);return `<span>${a.name?esc(a.name):t('fActorUnknown')}</span>`}
function fDetails(value){return `<details class="f-details" onclick="event.stopPropagation()"><summary>${t('fDetails')}</summary><pre>${esc(JSON.stringify(value,null,2))}</pre><button class="b g" onclick="fCopyDetails(this)">${t('fCopy')}</button><span role="status"></span></details>`}
async function fCopyDetails(button){const text=button.closest('details').querySelector('pre').textContent;let copied=false;try{await navigator.clipboard.writeText(text);copied=true;}catch(e){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(area);area.select();area.setSelectionRange(0,area.value.length);try{copied=document.execCommand('copy');}catch(e){}area.remove();button.focus();}button.nextElementSibling.textContent=(copied?'✓':t('fCopyFailed'))}
function fRead(st,retry){if(!st)return `<p role="status">${t('fLoading')}</p>`;return st.state==='loading'?`<p role="status">${t('fLoading')}</p>`:st.state==='error'?`<div class="f-warning" role="status">${t(st.known||st.balanceKnown||st.entriesKnown?'fStale':'fLoadFail')} <button class="b g" onclick="${retry}">${t('fRetry')}</button></div>`:''}
function fCashRead(){const st=TLB.cashHealth();return st.state==='error'||st.dirty?`<div class="f-warning" role="status">${t(st.known?'fCashStale':'fLoadFail')} <button class="b g" onclick="fRefresh()">${t('fRetry')}</button></div>`:st.state==='loading'?`<p role="status">${t('fCashLoading')}</p>`:''}
function fMoney(v){return v==null?t('fLoadFail'):Number(v).toFixed(2)+' TJS'}
function fCommand(op,id){const st=TLB.financeCommandState(op,id);return `<div class="f-command" role="status">${st.state==='pending'?t('fPending'):st.state==='unresolved'?`${t('fUnknown')} <button class="b g" onclick="fCheck('${op}','${esc(id)}')" ${FUI.checks[op+':'+id]?'disabled':''}>${t(FUI.checks[op+':'+id]?'fChecking':'fCheck')}</button>`:st.state==='error'?t('fError'):st.state==='success'?t('fDone'):''}${st.key?fDetails({request:st.key,state:st.state,result:st.result||null}):''}${st.state==='success'&&st.result?`<span>${fMoney(st.result.amount)}</span>`:''}</div>`}
function fCanWrite(op,id){const st=TLB.financeCommandState(op,id);return TLB.financeAccess().execute&&!['pending','unresolved'].includes(st.state)}
function fWriteButton(op,id,enabled,handler,label){const st=TLB.financeCommandState(op,id);return `<button class="b f-write" onclick="${handler}" aria-busy="${st.state==='pending'}" ${enabled&&fCanWrite(op,id)?'':'disabled'}>${t(st.state==='pending'?'fWaitButton':st.state==='unresolved'?'fUnknownButton':label)}</button>`}
async function fRefresh(){await Promise.all([TLB.reload(),TLB.financeRefreshAccess()]);if(TLB.cashHealth().dirty)await TLB.financeRefreshCash();render()}
async function fCheck(op,id){const key=op+':'+id;if(FUI.checks[key])return;FUI.checks[key]=true;render();try{await TLB.financeReconcile(op,id);if(op==='wallet_adjust'&&CU.sel===id)await fWalletLoad(id);await TLB.reload();if(op==='settle_cash')await TLB.financeRefreshCash();}finally{FUI.checks[key]=false;render()}}
async function fSettle(id,bal){if(!fCanWrite('settle_cash',id)||TLB.cashHealth().state!=='ok'||TLB.cashHealth().dirty||bal==null||!(bal>0))return;if(!confirm(t('aSettleQ')+' '+Number(bal).toFixed(2)+' TJS?'))return;const p=TLB.settleCash(id);render();const r=await p;await TLB.reload();if(r.ok)await TLB.financeRefreshCash();render()}
async function fWalletLoad(id){if(FUI.walletBusy[id])return;FUI.walletBusy[id]=true;render();try{const w=await TLB.walletOf(id);if(CU.sel===id)CU.wal=w;}finally{FUI.walletBusy[id]=false;render()}}
async function fWalletWrite(){const id=CU.sel;if(!id||!fCanWrite('wallet_adjust',id))return;const p=TLB.walletAdjust(id,CU.wa,CU.wn);render();const r=await p;if(r.ok&&CU.sel===id){CU.wa='';CU.wn='';await fWalletLoad(id);}else if(r.error==='bad_value')alert(t('err_bad_value'));render()}
function fWalletCard(){const w=CU.wal,id=CU.sel;return `<section class="card f-wallet"><div class="row"><b>${t('xWalT')}</b><strong>${w&&w.balanceKnown?fMoney(w.balance):t(w?'fLoadFail':'fLoading')}</strong></div>${fRead(w,`fWalletLoad('${esc(id)}')`)}<label for="cuwa">${t('xWalAmt')}</label><input id="cuwa" type="number" step="0.01" value="${esc(CU.wa)}" oninput="CU.wa=this.value"><label for="cuwn">${t('xWalNote')}</label><input id="cuwn" maxlength="200" value="${esc(CU.wn)}" oninput="CU.wn=this.value">${fWriteButton('wallet_adjust',id,true,'cuWal()','xWalDo')}${TLB.financeAccess().execute?'':`<p class="f-warning">${t('fDenied')}</p>`}${fCommand('wallet_adjust',id)}<h3>${t('xWalHist')}</h3>${w&&w.entriesKnown?w.entries.length?w.entries.map(e=>`<article class="f-entry"><div class="row"><b>${esc(t('wk_'+e.kind))}</b><strong>${fMoney(e.amount)}</strong></div><p>${esc(e.note)}</p><p>${t('aWho')}: ${fActor(e.created_by)}</p><p>${t('fTime')}: ${Number.isFinite(e.at)?fmt(e.at):'—'}</p>${e.orderId?`<p>${t('fOrder')}: #${esc(e.orderId)}</p>`:''}${fDetails(e)}</article>`).join(''):`<p>${t('xWalNone')}</p>`:`<p>${t(w?'fLoadFail':'fLoading')}</p>`}</section>`}
function fCustomers(){if(!CU.loaded&&!CU.busy){cuLoad(true);return `<p>${t('fLoading')}</p>`}return `<p class="f-warning">${t('fScope')}</p><label for="cuq">${t('fWalletSearch')}</label><div class="row"><input id="cuq" value="${esc(CU.q)}" oninput="CU.q=this.value"><button class="b" onclick="cuLoad(true)">${t('xFind')}</button></div>${CU.rows.map(x=>`<button class="b g" onclick="CU.sel='${esc(x.id)}';CU.wal=null;fWalletLoad(CU.sel)">${esc(x.name||t('fNoName'))}</button>`).join('')}${CU.sel?fWalletCard():''}`}
async function fLoadLog(){if(FUI.logBusy)return;FUI.logBusy=true;try{const r=await Promise.all([TLB.audit(100),TLB.isSuper()?TLB.clientErrors(100):Promise.resolve({known:true,state:'ok',rows:[]})]);AUD=r[0];ERR=r[1];}finally{FUI.logBusy=false;render()}}
function fAuditValue(r,key){const v=r.details&&r.details[key];return v&&typeof v==='object'&&Object.prototype.hasOwnProperty.call(v,'to')?v.to:v}
function fAuditSummary(r){const settled=r.table_name==='orders'&&!!fAuditValue(r,'cash_settled_at');const type=settled?'fAuditSettlement':r.table_name==='orders'?'fAuditOrder':r.table_name==='wallet_entries'?'fAuditWallet':r.app||r.message?'fAuditError':'fAuditOther';const order=r.table_name==='orders'?r.row_id:fAuditValue(r,'order_id');const amount=fAuditValue(r,'amount');return `<div class="row"><b>${t(type)}</b><span>${Number.isFinite(Date.parse(r.at))?fmt(Date.parse(r.at)):'—'}</span></div><p>${t('aWho')}: ${fActor(r.user_id)}</p>${order?`<p>${t('fOrder')}: #${esc(order)}</p>`:''}<p>${amount!=null&&amount!==''&&Number.isFinite(Number(amount))?fMoney(amount):t('fAmountMissing')}</p>`}
function fLog(){if(!AUD){fLoadLog();return `<p>${t('fLoading')}</p>`}const st=logTab==='e'&&TLB.isSuper()?ERR:AUD;return `<div class="chips"><button class="chip" onclick="logTab='a';render()">${t('aTabAudit')}</button>${TLB.isSuper()?`<button class="chip" onclick="logTab='e';render()">${t('aTabErr')}</button>`:''}<button class="b g" onclick="fLoadLog()" ${FUI.logBusy?'disabled':''}>${t('fRetry')}</button></div>${fRead(st,'fLoadLog()')}${st&&st.known?st.rows.length?st.rows.map(r=>`<article class="card f-entry">${fAuditSummary(r)}${r.message?`<p>${esc(r.message)}</p>`:''}${fDetails(r)}</article>`).join(''):`<p>${t(logTab==='e'?'aNoErr':'aNoAudit')}</p>`:`<p>${t('fLoadFail')}</p>`}`}
function fLoadSettlements(id,force){const rows=TLB.orders(o=>o.driver==id).slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);return TLB.financeLoadSettlements(rows,force)}
function fSettlementInfo(o){if(!o.cashSettledAt)return '';const r=TLB.financeSettlementActor(o.id,o.cashSettledAt),st=TLB.financeSettlementHealth(o);return `<div class="f-settlement"><small>${t('fSettled')}: ${fmt(Date.parse(o.cashSettledAt))}</small><small>${t('aWho')}: ${r?fActor(r.user_id):t(st.state==='loading'?'fLoading':'fActorUnknown')}</small>${fDetails({order_id:o.id,cash_settled_at:o.cashSettledAt,event:r})}${fRead(st,`fLoadSettlements('${esc(o.driver)}',true)`)}</div>`}
function fDriverList(){const drivers=TLB.driversHealth();return `${fRead(drivers,'fRefresh()')}${fCashRead()}<p class="f-warning">${t('fScope')}</p>${TLB.drivers().map(x=>`<article class="card"><h3>${esc(x.name||t('fNoName'))}</h3><small class="f-ref">${esc(x.id)}</small><div class="row"><span>${t('fHeld')}</span><strong>${fMoney(TLB.cash(x.id))}</strong></div><button class="b g" onclick="openDrvEdit('${esc(x.id)}')">${t('aDrvAct')}</button></article>`).join('')}`}
</script>
