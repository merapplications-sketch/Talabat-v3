const t=TLB.t,esc=TLB.esc,$=id=>document.getElementById(id);
const P={nav:'<path d="M3 11l18-8-8 18-2-8z"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',check:'<path d="M5 12l5 5 9-10"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',store:'<path d="M4 9l1-5h14l1 5"/><path d="M4 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 4 0"/><path d="M5 12v8h14v-8"/>',home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',down:'<path d="M6 9l6 6 6-6"/>',up:'<path d="M6 15l6-6 6 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8M10 9H8"/>',pkg:'<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'};
const ico=(n,s)=>`<svg viewBox="0 0 24 24" width="${s||20}" height="${s||20}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle;flex-shrink:0">${P[n]}</svg>`;
let DRV=null,tab='o',online=false,SUM=null,chatOpen=false,invOpen=false,lastN=-1,DV=null,ftm=null,phErr='',SHF=false,SWB=0,LASTACT=null,CXL=null,DM=null,DMK='';
const mine=()=>TLB.orders(o=>o.driver==DRV.id&&['preparing','ready','pickedup'].includes(o.status))[0]||null;
const done=()=>TLB.orders(o=>o.driver==DRV.id&&o.status=='delivered');
const setTab=x=>{tab=x;render()};
let GEO={state:'idle',lat:null,lng:null,acc:null,sent:0,wid:null},wake=null;
const ping=()=>TLB.ping(online);
function startGeo(){if(GEO.wid!=null)return;if(!navigator.geolocation){GEO.state='na';return}GEO.state='wait';
  GEO.wid=navigator.geolocation.watchPosition(p=>{GEO.lat=p.coords.latitude;GEO.lng=p.coords.longitude;GEO.acc=p.coords.accuracy;GEO.state='ok';pushGeo(false);render()},
    e=>{GEO.state=e&&e.code==1?'denied':'err';render()},{enableHighAccuracy:true,maximumAge:5000,timeout:30000})}
function stopGeo(){if(GEO.wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(GEO.wid);GEO.wid=null;GEO.state='idle';GEO.lat=null;GEO.lng=null}
function pushGeo(force){if(!online||GEO.lat==null)return;const n=Date.now();if(!force&&n-GEO.sent<8000)return;GEO.sent=n;TLB.sendLocation(GEO.lat,GEO.lng,GEO.acc)}
async function keepAwake(){try{if(navigator.wakeLock&&online&&!wake&&!document.hidden){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}
function releaseAwake(){try{if(wake){wake.release();wake=null}}catch(e){}}
const due=o=>Math.max(0,Math.round(((+o.total||0)-(+o.walletUsed||0))*100)/100);
const todayStart=()=>{const x=new Date();x.setHours(0,0,0,0);return x.getTime()};
function shiftSummary(){const me=DRV.id,l=TLB.orders(o=>o.driver==me&&o.status=='delivered'&&(o.doneAt||o.createdAt)>=todayStart());return{n:l.length,earn:l.reduce((s,o)=>s+(+o.payout||0),0),cash:TLB.myCash()}}
async function endShift(){if(!online)return;if(mine()){alert(t('endBusy'));return}if(!confirm(t('endQ')))return;
  online=false;TLB.ring(false);flashTitle(false);stopGeo();releaseAwake();SUM=shiftSummary();await ping();render()}
async function startShift(){TLB.unlockAudio();TLB.testSound();online=true;await ping();startGeo();keepAwake();render()}
function unlockSound(){TLB.unlockAudio();TLB.testSound();render()}
function flashTitle(on){if(on&&!ftm){let k=0;ftm=setInterval(()=>{document.title=(k++%2)?'Talabat':'🔔 '+t('newOrderT')},900)}else if(!on&&ftm){clearInterval(ftm);ftm=null;document.title='Talabat'}}
async function savePhone(){const v=($('ph')||{}).value||'',r=await TLB.setMyPhone(v);if(r&&r.error){phErr=t('err_'+r.error);render();return}phErr='';render()}
function phoneGate(){return `<div class="pg"><div class="card" style="text-align:center;padding:22px 18px"><div class="hico" style="margin:0 auto 12px;width:54px;height:54px">${ico('phone',26)}</div><h3 style="margin-bottom:6px">${t('phReqT')}</h3><p class="xs" style="color:var(--mut);margin-bottom:14px;line-height:1.5">${t('phReqS')}</p><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="17" placeholder="+992 90 000 00 00" style="width:100%;height:50px;border:1.5px solid #eeeef1;border-radius:14px;padding:0 14px;font-size:14px;background:#f7f7f9;margin-bottom:8px">${phErr?`<div class="xs" style="color:var(--bad);font-weight:600;margin-bottom:8px">${esc(phErr)}</div>`:''}<button class="b" onclick="savePhone()">${t('phSave')}</button></div></div>`}
async function decline(id){const r=await TLB.decline(id);if(r&&r.error)alert(t('err_'+r.error))}
async function take(id){const r=await TLB.driverAccept(id);if(r.error)alert(t('err_'+r.error))}
async function step(id,s){const r=await TLB.setStatus(id,s);if(r.error)alert(t('trans'))}
function say(id,txt){chatOpen=true;TLB.chat(id,'driver',txt)}
function sendChat(id){const e=$('ci'),v=e.value.trim();if(!v)return;e.value='';TLB.chat(id,'driver',v)}
function sendLoc(id){TLB.pickLocation((la,ln)=>TLB.chat(id,'driver','LOC:'+la.toFixed(6)+','+ln.toFixed(6)))}
/* the last step: a photo when the customer asked to leave it at the door, the cash amount when he pays cash */
function deliverClick(id){const o=TLB.order(id);if(!o)return;const cash=TLB.isCash(o);
  if(cash||o.leaveAtDoor){DV={id,cash,photo:!!o.leaveAtDoor,total:due(o),amt:String(due(o)),note:'',ph:null,up:false};render()}
  else finish(id,null,null,null)}
async function finish(id,cash,note,photo){const r=await TLB.deliver(id,cash,note,photo);if(r.error){alert(t('err_'+r.error));return false}return true}
async function takePhoto(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f||!DV)return;DV.up=true;render();
  const r=await TLB.uploadProof(f,DV.id);if(!DV)return;DV.up=false;if(r.error){alert(t('err_'+r.error));render();return}DV.ph=r;render()}
async function confirmDeliver(){if(!DV||DV.up)return;if(DV.photo&&!DV.ph){TLB.toast(t('err_photo_required'),true);return}
  let amt=null;if(DV.cash){amt=parseFloat(DV.amt);
    if(!(amt>=0)){TLB.toast(t('err_cash_required'),true);return}
    if(Math.abs(amt-DV.total)>0.004&&!DV.note.trim()){TLB.toast(t('err_note_required'),true);return}}
  if(await finish(DV.id,amt,DV.cash?DV.note:null,DV.ph?DV.ph.path:null)){DV=null;render()}}
/* the 4 steps of a delivery, each confirmed with a swipe */
const stepOf=a=>a.status=='pickedup'?(a.arrivedCustAt?4:3):(a.arrivedStoreAt?2:1);
async function swDo(){const a=mine();if(!a||SWB)return;const n=stepOf(a);if(n==2&&a.status!='ready')return;SWB=1;render();let r=null;
  try{if(n==1)r=await TLB.driverArrived(a.id,'store');
    else if(n==2)r=await TLB.setStatus(a.id,'pickedup');
    else if(n==3){r=await TLB.driverArrived(a.id,'customer');if(r&&!r.error)TLB.chat(a.id,'driver',t('atCustMsg'))}
    else{SWB=0;deliverClick(a.id);return}
    if(r&&r.error)alert(t('err_'+r.error)||t('trans'));else{SHF=false;DMK=''}}
  finally{SWB=0;render()}}
function bindSwipe(){const w=$('swp'),k=$('swk');if(!w||!k||w.classList.contains('off'))return;let x0=null,dx=0;const max=()=>w.clientWidth-k.offsetWidth-8;
  const mv=e=>{if(x0==null)return;dx=Math.max(0,Math.min(max(),(e.clientX||0)-x0));k.style.transform='translateX('+dx+'px)'};
  const up=()=>{if(x0==null)return;x0=null;window.__drag=0;setTimeout(()=>{if(window.__rp&&!SWB){window.__rp=0;render()}},250);k.style.transition='transform .2s';const ok=dx>=max()-6;k.style.transform=ok?'translateX('+max()+'px)':'';dx=0;if(ok){try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}swDo()}};
  k.addEventListener('pointerdown',e=>{if(SWB)return;window.__drag=1;x0=(e.clientX||0);k.style.transition='none';try{k.setPointerCapture(e.pointerId)}catch(_){}});
  k.addEventListener('pointermove',mv);k.addEventListener('pointerup',up);k.addEventListener('pointercancel',up);
  k.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();swDo()}})}
function swipeH(a){const n=stepOf(a),wait=n==2&&a.status!='ready';
  if(wait)return `<div class="swp off" id="swp" role="status"><div class="swt">⏳ ${t('swWait')}</div></div>`;
  return `<div class="swp ${n==4?'g':''} ${SWB?'busy':''}" id="swp"><button class="swk" id="swk" aria-label="${t('sw'+n)} · ${t('swHint')}">${ico(n==4?'check':'nav',22)}</button><div class="swt"><span>${t('sw'+n)}</span> ››</div></div>`}
