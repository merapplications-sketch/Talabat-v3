const P={nav:'<path d="M3 11l18-8-8 18-2-8z"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',check:'<path d="M5 12l5 5 9-10"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',store:'<path d="M4 9l1-5h14l1 5"/><path d="M4 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 4 0"/><path d="M5 12v8h14v-8"/>',home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',down:'<path d="M6 9l6 6 6-6"/>',up:'<path d="M6 15l6-6 6 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8M10 9H8"/>',pkg:'<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>'};

let DRV=null,tab='o',online=true,chatOpen=false,invOpen=false,lastN=-1,DV=null;
const mine=()=>TLB.orders(o=>o.driver==DRV.id&&['preparing','ready','pickedup'].includes(o.status))[0]||null;
const done=()=>TLB.orders(o=>o.driver==DRV.id&&o.status=='delivered');
const setTab=x=>{tab=x;render()};
let GEO={state:'idle',lat:null,lng:null,acc:null,sent:0,wid:null},wake=null;
const ping=()=>TLB.ping(online);
function startGeo(){if(GEO.wid!=null)return;if(!navigator.geolocation){GEO.state='na';return}GEO.state='wait';
  GEO.wid=navigator.geolocation.watchPosition(p=>{GEO.lat=p.coords.latitude;GEO.lng=p.coords.longitude;GEO.acc=p.coords.accuracy;GEO.state='ok';pushGeo(false);render()},
    e=>{GEO.state=e&&e.code==1?'denied':'err';render()},{enableHighAccuracy:true,maximumAge:5000,timeout:30000})}
function stopGeo(){if(GEO.wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(GEO.wid);GEO.wid=null;GEO.state='idle';GEO.lat=null;GEO.lng=null}
function pushGeo(force){if(!online||GEO.lat==null)return;const n=Date.now();if(!force&&n-GEO.sent<8000)return;GEO.sent=n;TLB.sendLocation(GEO.lat,GEO.lng,GEO.acc)}
async function keepAwake(){try{if(navigator.wakeLock&&online&&!wake&&!document.hidden){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}
function releaseAwake(){try{if(wake){wake.release();wake=null}}catch(e){}}
async function flip(){online=!online;if(online){await ping();startGeo();keepAwake()}else{stopGeo();releaseAwake();await ping()}render()}

async function take(id){const r=await TLB.driverAccept(id);if(r.error)alert(t('err_'+r.error))}
async function step(id,s){const r=await TLB.setStatus(id,s);if(r.error)alert(t('trans'))}
function say(id,txt){chatOpen=true;TLB.chat(id,'driver',txt)}
function sendChat(id){const e=$('ci'),v=e.value.trim();if(!v)return;e.value='';TLB.chat(id,'driver',v)}
function sendLoc(id){TLB.pickLocation((la,ln)=>TLB.chat(id,'driver','LOC:'+la.toFixed(6)+','+ln.toFixed(6)))}
function deliverClick(id){const o=TLB.order(id);if(!o)return;
  if(TLB.isCash(o)){DV={id,total:o.total,amt:String(o.total),note:''};render()}
  else if(confirm(t('dlv')+'?'))finish(id,null,null)}
async function finish(id,cash,note){const r=await TLB.deliver(id,cash,note);if(r.error){alert(t('err_'+r.error));return false}return true}
async function confirmDeliver(){const amt=parseFloat(DV.amt);
  if(!(amt>=0)){TLB.toast(t('err_cash_required'),true);return}
  if(Math.abs(amt-DV.total)>0.004&&!DV.note.trim()){TLB.toast(t('err_note_required'),true);return}
  if(await finish(DV.id,amt,DV.note)){DV=null;render()}}
const storeLL=n=>{const st=TLB.stores(true).find(x=>x.name==n);return st&&st.lat!=null&&st.lng!=null&&isFinite(+st.lat)&&isFinite(+st.lng)?(+st.lat)+','+(+st.lng):null};

function invoice(o){const cash=TLB.isCash(o);
  return `<div class="inv"><b>🧾 ${t('inv')}</b><div style="height:6px"></div>
  ${o.items.map(i=>`<div class="l"><span>${i.qty}× ${esc(i.name)}${i.note?` <small style="color:#e74c3c">(${esc(i.note)})</small>`:''}</span><span>${(i.qty*i.price).toFixed(2)}</span></div>`).join('')}

  ${o.discount?`<div class="l"><span>${t('discT')}</span><span>−${o.discount.toFixed(2)}</span></div>`:''}${o.promoDiscount>0?`<div class="l"><span>${t('promoT')} ${esc(o.promoCode)}</span><span>−${o.promoDiscount.toFixed(2)}</span></div>`:''}
  <div class="l"><span>${t('delT')}</span><span>${o.delivery.toFixed(2)}</span></div>
  ${o.tip?`<div class="l"><span>${t('tipT')}</span><span>${o.tip.toFixed(2)}</span></div>`:''}
  <div class="l t"><span>${t('totT')}</span><span>${o.total.toFixed(2)} TJS</span></div></div>
  ${cash?`<div class="collect">💵 ${t('collect')}: ${o.total.toFixed(2)} TJS</div>`:`<div class="paid">✅ ${t('paidOnline')} (${esc(t(o.payment))})</div>`}`}
function geoBanner(){if(!online)return '';const m={denied:'geoDenied',wait:'geoWait',na:'geoNA',err:'geoErr'}[GEO.state];
  return m?`<div class="warn ${GEO.state=='wait'?'':'r'}">📍 ${t(m)}</div>`:`<div class="info2">📍 ${t('locOkT')} · ${t('keepOpen')}</div>`}
function banner(){const m=TLB.me(),bal=TLB.myCash();let h=geoBanner();
  if(m.blocked)h+=`<div class="warn">${t('blockedB')}</div>`;
  h+=bal>=m.cashLimit?`<div class="warn r">${t('cashWarn')} ${bal.toFixed(0)} / ${m.cashLimit} TJS</div>`:`<div class="info2">💵 ${t('cashHand')}: ${bal.toFixed(2)} TJS</div>`;
  return h}
function stepBar(a){const ot=a.status=='pickedup',st=[[t('stAcc'),'done'],[t('stRest'),ot?'done':'cur'],[t('stCust'),ot?'cur':'']];
  return `<div class="steps">${st.map((s,i)=>`<div class="stp ${s[1]}"><i>${s[1]=='done'?ico('check',13):i+1}</i><span>${s[0]}</span></div>`).join('')}</div>`}
function itemsSummary(a){const n=a.items.reduce((s,i)=>s+i.qty,0);
  return `<div class="card"><div class="row" onclick="invOpen=!invOpen;render()" style="cursor:pointer"><div><b>${t('orderInfo')}</b><div class="xs" style="color:var(--mut)">${n} ${t('itemsN')} · ${a.total.toFixed(2)} TJS</div></div><span style="color:var(--o)">${ico(invOpen?'up':'down',22)}</span></div>${invOpen?invoice(a):''}</div>`}
function activeCard(a){const rd=a.status=='ready',ot=a.status=='pickedup',un=TLB.unread(a.id),cash=TLB.isCash(a);
  const dest=ot?a.address:a.store,destIco=ot?'pin':'store',navHref=ot?map(a.address):(storeLL(a.store)?'https://www.google.com/maps/search/?api=1&query='+storeLL(a.store):map(a.store));
  const sub=ot?'':(rd?t('readyNow'):t('prepIn').replace('{n}',a.prepTime||''));
  return `<div class="card act"><div class="row"><span class="badge" style="background:var(--o);color:#fff">#${a.id}</span><span class="earnchip">${t('earnT')} ${a.payout.toFixed(2)} TJS</span></div>
  ${stepBar(a)}
  <div class="hero2"><div class="xs" style="color:var(--mut);font-weight:600">${ot?t('h2'):t('h1')}</div><div class="rg" style="gap:10px;margin-top:6px"><span class="hico">${ico(destIco,22)}</span><div style="min-width:0"><div class="dest">${esc(dest)}</div>${sub?`<div class="xs" style="color:${rd?'var(--ok)':'#9a5300'};font-weight:600;margin-top:2px">${sub}</div>`:''}</div></div>
  <div class="btnrow"><a class="b" target="_blank" rel="noopener" href="${navHref}">${ico('nav',18)} ${t('navB')}</a>${!ot&&a.storePhone?`<a class="b s" href="tel:${esc(a.storePhone)}">${ico('phone',18)} ${t('callRest')}</a>`:''}</div></div>
  <div class="paychip ${cash?'cash':'paid'}">${cash?`💵 ${t('collectS')}: <b>${a.total.toFixed(2)} TJS</b>`:`✅ ${t('paidS')} · ${esc(t(a.payment))}`}</div>
  <div class="cust"><div class="av2">${esc(String(a.client.name||'?').charAt(0).toUpperCase())}</div><div style="flex:1;min-width:0"><div class="xs" style="color:var(--mut)">${t('custT')}</div><b>${esc(a.client.name)}</b></div>
  ${a.client.phone?`<a class="round" href="tel:${esc(a.client.phone)}" aria-label="${t('call')}">${ico('phone',20)}</a>`:''}<button class="round o" onclick="chatOpen=true;render()" aria-label="${t('chatB')}">${ico('chat',20)}${un?`<span class="dotb">${un}</span>`:''}</button></div>
  ${!a.client.phone?`<div class="xs" style="color:var(--bad);margin:-4px 0 10px">${t('noPh')}</div>`:''}
  ${itemsSummary(a)}</div>`}
function actionBar(a){const rd=a.status=='ready',ot=a.status=='pickedup';
  return `<div class="actbar">${ot?`<button class="b g" onclick="deliverClick(${a.id})">${ico('check',20)} ${t('dlv')}</button>`:rd?`<button class="b" onclick="step(${a.id},'pickedup')">${ico('pkg',20)} ${t('gotIt')}</button>`:`<button class="b d" disabled>${t('wait')}</button>`}</div>`}
function offerCard(o){const f=o.offer,br=f.mode=='broadcast',pct=br?100:Math.max(0,Math.min(100,f.left/30*100)),secs=Math.ceil(f.left);
  return `<div class="card offer"><div class="row"><span class="badge">${br?t('offBroad'):t('offFor')}</span><span class="earnchip">+${o.payout.toFixed(2)} TJS</span></div>
  <div class="row" style="margin-top:10px"><b style="font-size:19px">${esc(o.store)}</b>${f.dist!=null?`<span class="xs" style="color:var(--mut);font-weight:600">${f.dist.toFixed(1)} ${t('kmToRest')}</span>`:''}</div>
  ${br?'':`<div class="cd"><i style="width:${pct}%"></i></div><div class="xs" style="text-align:right;color:${secs<=8?'var(--bad)':'var(--mut)'};font-weight:700;margin-top:4px">${secs} ${t('secS')}</div>`}
  <div class="route"><div class="rg">${ico('store',18)}<span>${t('pick')}: <b>${esc(o.store)}</b></span></div><div class="rg" style="margin-top:6px">${ico('pin',18)}<span>${t('drop')}: <b>${esc(o.address)}</b></span></div></div>
  <div class="paychip ${TLB.isCash(o)?'cash':'paid'}" style="margin:0 0 6px">${TLB.isCash(o)?`💵 ${t('collectS')}: <b>${o.total.toFixed(2)} TJS</b>`:`✅ ${t('paidS')}`}</div>
  <div class="btnrow"><button class="b s" onclick="decline(${o.id})">${t('declineB')}</button><button class="b" style="flex:2" onclick="take(${o.id})">${t('acceptB')}</button></div></div>`}
function vOrders(){const a=mine(),of=TLB.offers().filter(o=>o.offer.left>0),m=TLB.me();let h=banner();
  if(!a){h+=`<h3>${t('newO')}</h3>`;
    if(!online)h+=`<div class="card empty2">${t('offl')}</div>`;
    else if(m.blocked)h+='';
    else if(!of.length)h+=`<div class="card empty2">${ico('bike',30)}<div>${t('noO')}</div></div>`;
    else h+=of.map(offerCard).join('');
  }else h+=`<div class="xs" style="color:var(--mut);margin:0 4px 8px">${t('busy')}</div>`+activeCard(a);
  return h}
function chatSheet(a){const un=TLB.unread(a.id),Q=[1,2,3,4,5,6,7];
  return `<div class="ov" onclick="chatOpen=false;render()"><div class="md" onclick="event.stopPropagation()"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">${t('chatT')} · ${esc(a.client.name)}</h3><button class="round" onclick="chatOpen=false;render()" aria-label="${t('closeB')}">${ico('x',18)}</button></div>
  <div class="qrow">${Q.map(n=>`<span class="chip" onclick="say(${a.id},t('q${n}t'))">${t('q'+n)}</span>`).join('')}</div>
  <div class="chat" id="ch">${a.chat.map(m=>`<div class="m ${m.s=='driver'?'me':''}">${TLB.fmtMsg(m.t)}</div>`).join('')}</div>
  <div class="row" style="gap:8px"><input type="text" id="ci" maxlength="200" placeholder="${t('msgPh')}" style="margin:0;flex:1"><button class="round" onclick="sendLoc(${a.id})" aria-label="${t('sendLoc')}">${ico('pin',20)}</button><button class="round o" style="background:var(--o);color:#fff" onclick="sendChat(${a.id})" aria-label="${t('sendB')}">${ico('nav',20)}</button></div></div></div>`}
function vHist(){const l=done();return `<h3>${t('dHist')}</h3>${l.length?l.map(o=>`<div class="card"><div class="row"><b>#${o.id} (${esc(o.store)})</b><b style="color:#27ae60">${o.payout.toFixed(2)} TJS</b></div><p style="font-size:12px;color:#718096;margin-top:4px">🕒 ${new Date(o.doneAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${o.cashCollected!=null?` • 💵 ${o.cashCollected.toFixed(2)} TJS`:''}${o.cashNote?` • ${esc(o.cashNote)}`:''}</p></div>`).join(''):`<div class="card">${t('noH')}</div>`}`}
function vMe(){const l=done(),sum=l.reduce((s,o)=>s+o.payout,0),m=TLB.me();
  return `<div class="earn"><small>${t('bal')}</small><b>${sum.toFixed(2)} TJS</b><div class="row"><div><b style="font-size:20px;margin:0">${l.length}</b><small>${t('cnt')}</small></div><div><b style="font-size:20px;margin:0">${TLB.myCash().toFixed(0)}</b><small>${t('cashHand')} / ${m.cashLimit}</small></div></div></div>
  <div class="card row"><b>${t('langL')}</b><div style="display:flex;gap:6px"><button class="b ${TLB.lang()=='ru'?'':'s'}" style="margin:0;width:auto;padding:8px 14px" onclick="TLB.setLang('ru')">RU</button><button class="b ${TLB.lang()=='en'?'':'s'}" style="margin:0;width:auto;padding:8px 14px" onclick="TLB.setLang('en')">EN</button></div></div>
  <div class="card" style="text-align:center;background:#2d3748;color:#fff"><div style="color:#fff;display:flex;justify-content:center">${ico('bike',44)}</div><b>${esc(m.name)}</b><p style="font-size:11px;opacity:.8">#${DRV.id.slice(0,6)}</p></div>
  <button class="b r" onclick="TLB.logout()">${t('logout')}</button>`}
function modal(){const a=mine();if(chatOpen&&a&&!DV)return chatSheet(a);return DV?`<div class="ov"><div class="md"><h3>${t('recvQ')}</h3><input type="number" id="cashAmt" value="${esc(DV.amt)}" oninput="DV.amt=this.value"><input type="text" id="cashNote" placeholder="${t('diffN')}" value="${esc(DV.note)}" oninput="DV.note=this.value">
  <button class="b g" onclick="confirmDeliver()">${t('confirmB')}</button><button class="b s" onclick="DV=null;render()">${t('cancelB')}</button></div></div>`:''}
function render(){
  const of=TLB.offers().length;if(online&&!mine()&&lastN>=0&&of>lastN){TLB.beep();try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}}lastN=of;
  const a0=mine();if(chatOpen&&a0&&TLB.unread(a0.id))setTimeout(()=>TLB.markRead(a0.id),0);
  const un=TLB.totalUnread();
  const a=document.activeElement,kid=a&&['ci','cashAmt','cashNote'].includes(a.id)?a.id:null,keep=kid?a.value:null;
  $('app').innerHTML=`<div class="hd"><div class="row"><div class="av">${esc(String(DRV.name||'?').charAt(0).toUpperCase())}</div><div><b>${esc(DRV.name)}</b><div style="font-size:11px;opacity:.7">#${DRV.id.slice(0,6)}</div></div></div>
  <div class="pill" onclick="flip()"><span class="dot ${online?'':'off'}"></span>${online?t('online'):t('offline')}</div></div>
  <div class="pg">${{o:vOrders,h:vHist,m:vMe}[tab]()}</div>${tab=='o'&&mine()?actionBar(mine()):''}${modal()}
  <div class="nav">${[['o','home','dOrders'],['h','receipt','dHist'],['m','user','dMe']].map(x=>`<div class="${tab==x[0]?'on':''}" onclick="setTab('${x[0]}')"><span>${ico(x[1],24)}</span>${t(x[2])}${x[0]=='o'&&un?` <span class="bdg">${un}</span>`:''}</div>`).join('')}</div>`;
  if(kid&&$(kid)){const e=$(kid);e.value=keep;e.focus();try{e.setSelectionRange(keep.length,keep.length)}catch(x){}}
  const ch=$('ch');if(ch)ch.scrollTop=ch.scrollHeight}
TLB.start('driver',me=>{DRV=me;TLB.chrome(false);TLB.on(render);render();ping().then(()=>{if(online){startGeo();keepAwake()}});
  setInterval(()=>{if(online){ping();pushGeo(true)}},30000);
  setInterval(()=>{if(tab=='o'&&!mine()&&TLB.offers().length)render()},1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&online){ping();pushGeo(true);keepAwake()}})});
</script></body></html>
