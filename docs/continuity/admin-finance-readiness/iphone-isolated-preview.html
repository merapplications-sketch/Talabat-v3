    addStore: function (f) { var c = cleanStore(f); if (!validStore(c)) return badStore(); return sb.from('stores').insert(c).then(done); },
    updateStore: function (id, f) { var c = cleanStore(f); if (!validStore(c)) return badStore(); return sb.from('stores').update(c).eq('id', id).then(done); },
    refreshRating: function (storeId) {
      return sb.functions.invoke('google-rating', { body: { store_id: String(storeId) } }).then(function (r) {
        if (r.error || !r.data || r.data.ok !== true) { toast(t('err_rating_fail'), true); return { error: 'rating_fail', toasted: true }; }
        toast(t('saved')); return refresh().then(function () { return { ok: true }; });
      }).catch(function () { toast(t('err_rating_fail'), true); return { error: 'rating_fail', toasted: true }; });
    },
    setMyDiscount: function (storeN, pct) { var s = storeByName(storeN), v = +pct; if (!s || !isFinite(v) || v < 0 || v > 100) return Promise.resolve({ error: 'bad_value' }); return rpc('set_my_discount', { p_store: String(s.id), p_pct: v }, true); },
    updateMyStore: function (storeN, f) { var s = storeByName(storeN); if (!s) return Promise.resolve({ error: 'generic' }); return rpc('update_my_store', { p_store: s.id, p_description: f.description == null ? null : f.description, p_cover: f.cover || null, p_logo: f.logo || null }, true); },
    perms: function () { return MYPERMS.slice(); },
    isSuper: function () { return !!ME && ME.role === 'admin'; },
    can: function (p) { return MYPERMS.indexOf(p) >= 0; },
    staffList: function () { return sb.rpc('staff_list').then(function (r) { return r.error ? { error: errKey(r.error), rows: [] } : { rows: r.data || [] }; }); },
    staffSet: function (email, perms, active) {
      email = String(email || '').trim().toLowerCase();
      var ok = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) && email.length <= 120 && Array.isArray(perms) && perms.every(function (x) { return ALL_PERMS.indexOf(x) >= 0; }) && (perms.length > 0 || active === false);
      if (!ok) return Promise.resolve({ error: 'bad_value' });
      return rpc('staff_set', { p_email: email, p_perms: perms, p_active: active !== false }, true);
    },
    brandRoute: function (brand, lat, lng, names) { return sb.rpc('brand_route', { p_brand: brand, p_lat: lat, p_lng: lng, p_names: names || null }).then(function (r) { return r.error ? [] : (r.data || []); }); },
    brandStats: function (brand, days) { return sb.rpc('brand_stats', { p_brand: brand, p_days: days || 30 }).then(function (r) { return r.error ? null : r.data; }); },
    brandCreate: function (name, ownerEmail) { name = String(name || '').trim(); if (name.length < 2 || name.length > 60) return Promise.resolve({ error: 'bad_value' }); return rpc('brand_create', { p_name: name, p_owner_email: ownerEmail || null }, true); },
    brandAttach: function (storeId, brandId, branch) { if (!/^[0-9a-f-]{36}$/i.test(String(brandId))) return Promise.resolve({ error: 'bad_value' }); return rpc('brand_attach', { p_store: storeId, p_brand: brandId, p_branch: String(branch || '').trim().slice(0, 60) }, true); },
    brandDetach: function (storeId) { return rpc('brand_detach', { p_store: storeId }, true); },
    branchCreate: function (brand, branch, address, lat, lng, phone) { branch = String(branch || '').trim(); if (branch.length < 2 || branch.length > 60) return Promise.resolve({ error: 'bad_value' }); return rpc('branch_create', { p_brand: brand, p_branch: branch, p_address: String(address || '').trim().slice(0, 200), p_lat: lat, p_lng: lng, p_phone: String(phone || '').trim().slice(0, 30) }, true); },
    brandSyncMenu: function (from, to) { return rpc('brand_sync_menu', { p_from: from, p_to: to }, true); },
    brands: function () { return (DB.brands || []); },
    staffRemove: function (id) { if (!/^[0-9a-f-]{36}$/i.test(String(id))) return Promise.resolve({ error: 'bad_value' }); return rpc('staff_remove', { p_user: id }, true); },
    assignOwner: function (id, email) { return rpc('assign_owner', { p_store: id, p_email: email }, true); },
    setDriverStatus: function (id, st) { return sb.from('profiles').update({ driver_status: st }).eq('id', id).then(done); },
    setMyPhone: function (p) { p = normPhone(p); if (!p) return Promise.resolve({ error: 'bad_phone' }); return rpc('set_my_phone', { p_phone: p }, true).then(function (r) { return r.error ? r : { ok: true, phone: p }; }); },
    setDriverBlocked: function (id, v) { return sb.from('profiles').update({ accept_blocked: !!v }).eq('id', id).then(done); },
    setDriverLimit: function (id, v) { v = +v; if (!isFinite(v) || v <= 0 || v > 1000000) return badStore(); return sb.from('profiles').update({ cash_limit: v }).eq('id', id).then(done); },
    settleCash: function(driverId){return finCommand('settle_cash',driverId,null,null);},

    banners: function (all) { var now = Date.now(); return DB.banners.filter(function (b) { return all || (b.is_active && (!b.starts_at || Date.parse(b.starts_at) <= now) && (!b.ends_at || Date.parse(b.ends_at) > now)); }); },
    addBanner: function (f) { if (!validBanner(f)) return badBanner(); return sb.from('banners').insert(f).then(done); },
    updateBanner: function (id, f) { if (!validBanner(f)) return badBanner(); return sb.from('banners').update(f).eq('id', id).then(done); },
    deleteBanner: function (id) { return sb.from('banners').delete().eq('id', id).then(done); },
    promos: function () { return DB.promos; },
    addPromo: function (f) { if (!validPromo(f)) return badPromo(); return sb.from('promo_codes').insert(f).then(done); },
    updatePromo: function (id, f) { if (!validPromo(f)) return badPromo(); return sb.from('promo_codes').update(f).eq('id', id).then(done); },
    deletePromo: function (id) { return sb.from('promo_codes').delete().eq('id', id).then(done); },
    isFav: function (storeId) { return DB.favs.indexOf(storeId) >= 0; },
    toggleFav: function (storeId) {
      var has = DB.favs.indexOf(storeId) >= 0;
      DB.favs = has ? DB.favs.filter(function (x) { return x !== storeId; }) : DB.favs.concat([storeId]);
      fireSoon();
      var q = has ? sb.from('favorites').delete().eq('user_id', ME.id).eq('store_id', storeId) : sb.from('favorites').insert({ user_id: ME.id, store_id: storeId });
      return q.then(function (r) { if (r.error) console.error(r.error); sigs = {}; return refresh(['misc']); });
    }
  };
  TLBref = window.TLB;
})();
</script>

<script>/* Admin finance presentation only. Core owns read snapshots and command state. */
window.TLB.addDict({fDriverInfo:'Курьер — финансы',fLoadFail:'Не удалось загрузить',fStale:'Данные не обновлены. Показаны последние успешно загруженные значения.',fRetry:'Повторить загрузку',fLoading:'Загружаем…',fActorUnknown:'Имя сотрудника недоступно',fActorNone:'Исполнитель не указан в записи',fUnknown:'Результат операции не подтверждён. Не отправляйте её повторно.',fCheck:'Проверить результат',fPending:'Ожидаем ответ сервера…',fDenied:'Финансовое исполнение требует явного допуска бухгалтера и проверенной серверной версии.',fError:'Операция отклонена. Проверьте данные и повторите.',fEarnOnly:'Начислено по загруженным заказам — не подтверждение выплаты и не остаток долга.',fHeld:'Наличные клиентов у курьера',fSettled:'Передано в офис',fRef:'Ссылка на запись',fWalletSearch:'Поиск клиента для просмотра кошелька',fScope:'Финансовый просмотр: без адресов, геопозиции и редактирования профиля.',fNoName:'Имя не указано'},
{fDriverInfo:'Courier — finance',fLoadFail:'Could not load',fStale:'Not refreshed. Showing the last successfully loaded values.',fRetry:'Retry loading',fLoading:'Loading…',fActorUnknown:'Staff name unavailable',fActorNone:'Actor not recorded',fUnknown:'Operation result is unconfirmed. Do not send it again.',fCheck:'Check result',fPending:'Waiting for server…',fDenied:'Financial execution requires explicit accountant authorization and the reviewed server version.',fError:'Operation rejected. Check the inputs and retry.',fEarnOnly:'Earned on loaded orders — not proof of payment or a net balance.',fHeld:'Customer cash held by courier',fSettled:'Handed to office',fRef:'Record reference',fWalletSearch:'Find a customer wallet',fScope:'Finance view: no addresses, location or profile editing.',fNoName:'Name not provided'});
const FUI={logBusy:false,walletBusy:{},messages:{}};
function fActor(id){if(!id)return `<span>${t('fActorNone')}</span>`;const a=TLB.financeActor(id);return `<span>${a.name?esc(a.name):t('fActorUnknown')} <small class="f-ref">[${esc(id)}]</small></span>`}
function fRead(st,retry){if(!st)return `<p role="status">${t('fLoading')}</p>`;return st.state==='loading'?`<p role="status">${t('fLoading')}</p>`:st.state==='error'?`<div class="f-warning" role="status">${t(st.known||st.balanceKnown||st.entriesKnown?'fStale':'fLoadFail')} <button class="b g" onclick="${retry}">${t('fRetry')}</button></div>`:''}
function fMoney(v){return v==null?t('fLoadFail'):Number(v).toFixed(2)+' TJS'}
function fCommand(op,id){const st=TLB.financeCommandState(op,id);return `<div class="f-command" role="status">${st.state==='pending'?t('fPending'):st.state==='unresolved'?`${t('fUnknown')} <button class="b g" onclick="fCheck('${op}','${esc(id)}')">${t('fCheck')}</button>`:st.state==='error'?t('fError'):''}${st.state==='success'&&st.result?`<small class="f-ref">${t('fRef')}: ${esc(st.result.request)} · ${esc(st.result.amount)} TJS</small>`:''}</div>`}
function fCanWrite(op,id){const st=TLB.financeCommandState(op,id);return TLB.financeAccess().execute&&!['pending','unresolved'].includes(st.state)}
async function fRefresh(){await Promise.all([TLB.reload(),TLB.financeRefreshAccess()]);render()}
async function fCheck(op,id){await TLB.financeReconcile(op,id);if(op==='wallet_adjust'&&CU.sel===id)await fWalletLoad(id);await TLB.reload();render()}
async function fSettle(id,bal){if(!fCanWrite('settle_cash',id)||TLB.cashHealth().state!=='ok'||bal==null||!(bal>0))return;if(!confirm(t('aSettleQ')+' '+Number(bal).toFixed(2)+' TJS?'))return;const p=TLB.settleCash(id);render();await p;await TLB.reload();render()}
async function fWalletLoad(id){if(FUI.walletBusy[id])return;FUI.walletBusy[id]=true;render();try{const w=await TLB.walletOf(id);if(CU.sel===id)CU.wal=w;}finally{FUI.walletBusy[id]=false;render()}}
async function fWalletWrite(){const id=CU.sel;if(!id||!fCanWrite('wallet_adjust',id))return;const p=TLB.walletAdjust(id,CU.wa,CU.wn);render();const r=await p;if(r.ok&&CU.sel===id){CU.wa='';CU.wn='';await fWalletLoad(id);}else if(r.error==='bad_value')alert(t('err_bad_value'));render()}
function fWalletCard(){const w=CU.wal,id=CU.sel;return `<section class="card f-wallet"><div class="row"><b>${t('xWalT')}</b><strong>${w&&w.balanceKnown?fMoney(w.balance):t(w?'fLoadFail':'fLoading')}</strong></div>${fRead(w,`fWalletLoad('${esc(id)}')`)}<label for="cuwa">${t('xWalAmt')}</label><input id="cuwa" type="number" step="0.01" value="${esc(CU.wa)}" oninput="CU.wa=this.value"><label for="cuwn">${t('xWalNote')}</label><input id="cuwn" maxlength="200" value="${esc(CU.wn)}" oninput="CU.wn=this.value"><button class="b" onclick="cuWal()" ${fCanWrite('wallet_adjust',id)?'':'disabled'}>${t('xWalDo')}</button>${TLB.financeAccess().execute?'':`<p class="f-warning">${t('fDenied')}</p>`}${fCommand('wallet_adjust',id)}<h3>${t('xWalHist')}</h3>${w&&w.entriesKnown?w.entries.length?w.entries.map(e=>`<article class="f-entry"><div class="row"><b>${esc(t('wk_'+e.kind))}</b><strong>${fMoney(e.amount)}</strong></div><p>${esc(e.note)}</p><p>${t('aWho')}: ${fActor(e.created_by)} · ${Number.isFinite(e.at)?fmt(e.at):'—'}</p><small class="f-ref">${t('fRef')}: ${esc(e.id)}${e.orderId?' · #'+esc(e.orderId):''}${e.ticketId?' · ticket #'+esc(e.ticketId):''}</small></article>`).join(''):`<p>${t('xWalNone')}</p>`:`<p>${t(w?'fLoadFail':'fLoading')}</p>`}</section>`}
function fCustomers(){if(!CU.loaded&&!CU.busy){cuLoad(true);return `<p>${t('fLoading')}</p>`}return `<p class="f-warning">${t('fScope')}</p><label for="cuq">${t('fWalletSearch')}</label><div class="row"><input id="cuq" value="${esc(CU.q)}" oninput="CU.q=this.value"><button class="b" onclick="cuLoad(true)">${t('xFind')}</button></div>${CU.rows.map(x=>`<button class="b g" onclick="CU.sel='${esc(x.id)}';CU.wal=null;fWalletLoad(CU.sel)">${esc(x.name||t('fNoName'))} <small class="f-ref">${esc(x.id)}</small></button>`).join('')}${CU.sel?fWalletCard():''}`}
async function fLoadLog(){if(FUI.logBusy)return;FUI.logBusy=true;try{const r=await Promise.all([TLB.audit(100),TLB.isSuper()?TLB.clientErrors(100):Promise.resolve({known:true,state:'ok',rows:[]})]);AUD=r[0];ERR=r[1];}finally{FUI.logBusy=false;render()}}
function fLog(){if(!AUD){fLoadLog();return `<p>${t('fLoading')}</p>`}const st=logTab==='e'&&TLB.isSuper()?ERR:AUD;return `<div class="chips"><button class="chip" onclick="logTab='a';render()">${t('aTabAudit')}</button>${TLB.isSuper()?`<button class="chip" onclick="logTab='e';render()">${t('aTabErr')}</button>`:''}<button class="b g" onclick="fLoadLog()" ${FUI.logBusy?'disabled':''}>${t('fRetry')}</button></div>${fRead(st,'fLoadLog()')}${st&&st.known?st.rows.length?st.rows.map(r=>`<article class="card f-entry"><div class="row"><b>${esc(r.table_name||r.app||'')}</b><span>${fmt(Date.parse(r.at))}</span></div><p>${t('aWho')}: ${fActor(r.user_id)}</p><small class="f-ref">${t('fRef')}: ${esc(r.id)} · ${esc(r.row_id||'')}</small>${r.message?`<p>${esc(r.message)}</p>`:''}<div class="f-details">${esc(JSON.stringify(r.details||{}))}</div></article>`).join(''):`<p>${t(logTab==='e'?'aNoErr':'aNoAudit')}</p>`:`<p>${t('fLoadFail')}</p>`}`}
function fLoadSettlements(id,force){const rows=TLB.orders(o=>o.driver==id).slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);return TLB.financeLoadSettlements(rows,force)}
function fSettlementInfo(o){if(!o.cashSettledAt)return '';const r=TLB.financeSettlementActor(o.id,o.cashSettledAt),st=TLB.financeSettlementHealth(o);return `<small>${t('fSettled')}: ${fmt(Date.parse(o.cashSettledAt))} · #${esc(o.id)}</small><small>${t('aWho')}: ${r?fActor(r.user_id):t(st.state==='loading'?'fLoading':'fActorUnknown')}</small>${fRead(st,`fLoadSettlements('${esc(o.driver)}',true)`)}`}


function fDriverList(){const cash=TLB.cashHealth(),drivers=TLB.driversHealth();return `${fRead(drivers,'fRefresh()')}${fRead(cash,'fRefresh()')}<p class="f-warning">${t('fScope')}</p>${TLB.drivers().map(x=>`<article class="card"><h3>${esc(x.name||t('fNoName'))}</h3><small class="f-ref">${esc(x.id)}</small><div class="row"><span>${t('fHeld')}</span><strong>${fMoney(TLB.cash(x.id))}</strong></div><button class="b g" onclick="openDrvEdit('${esc(x.id)}')">${t('aDrvAct')}</button></article>`).join('')}`}
</script>
