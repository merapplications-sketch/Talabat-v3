.s{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#edf2f7}
.s.pending{background:#fef3c7;color:#b45309}.s.preparing,.s.ready{background:#dbeafe;color:#1d4ed8}.s.pickedup{background:#e9d5ff;color:#7e22ce}.s.delivered,.s.approved{background:#dcfce7;color:#15803d}.s.rejected,.s.cancelled,.s.suspended{background:#fee2e2;color:#b91c1c}
input,select{width:100%;padding:10px;margin-bottom:8px;border:1px solid #cbd5e0;border-radius:8px;font-size:14px;background:#fff}
small{color:#718096}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.l{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px}
.tl{border-left:3px solid #ff5a00;padding:2px 0 8px 10px;margin-left:4px;font-size:13px}.tl small{display:block}
.msg{background:#f1f5f9;border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:12px}.msg.driver{background:#fff3ed}
.warn{background:#fde2e2;color:#b91c1c;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;margin-top:6px}

  TLB.addStore({name:v('sn').slice(0,80),category:v('sc'),description:v('ss'),phone:v('sp')||null,commission_pct:+v('sm')||0,fee_type:v('sf'),fee_base:+v('sb')||0,fee_per_km:+v('sk')||0,discount_pct:+v('sd')||0}).then(r=>{if(r&&r.error&&!r.toasted)alert(t('err_'+r.error));if(!(r&&r.error)){showAddS=false;render()}})}
function pickB(e){const fl=e.target.files[0];if(fl)resizeImg(fl,1200,.7,d=>{bimg=d;$('bp').src=d;$('bp').style.display='block'})}

function pickLink(cb){const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:10000;background:#fff;display:flex;flex-direction:column;font:14px -apple-system,BlinkMacSystemFont,sans-serif';

const inp=document.createElement('input');inp.type='search';inp.placeholder=t('aSearch');inp.style.cssText='flex:1;margin:0';
const x=document.createElement('button');x.className='b g';x.textContent='✕';x.onclick=()=>ov.remove();top.append(inp,x);
const list=document.createElement('div');list.style.cssText='flex:1;overflow:auto;padding:0 14px 20px';ov.append(top,list);document.body.appendChild(ov);

  run(TLB.addBanner({title:v('bt').slice(0,80),image_url:bimg||null,link_type:lt,link_value:p[1]||null,sort:+v('bo')||0,placement:$('bpl').value=='bottom'?'bottom':'top',starts_at:dIso($('bfr').value,false),ends_at:dIso($('bto').value,true)}).then(r=>{if(r&&r.error&&!r.toasted)alert(t('err_'+r.error));if(!(r&&r.error)){showAddB=false;BL='none';render()}}));bimg=''}

async function saveStore(){const n=x=>x===''||x==null?0:+x;

  const ev=TLB.events(o.id),cash=TLB.isCash(o);

  return `<button class="b g" onclick="D=null;render()">← ${t('aBack')}</button>
  <div class="card" style="margin-top:12px"><div class="row"><b>#${o.id} — ${esc(o.store)}</b><span class="s ${o.status}">${t(o.status)}</span></div><small>${fmt(o.createdAt)}</small></div>
  <div class="card"><b>👤 ${t('aClient')}</b><p style="margin:4px 0">${esc(o.client.name)}</p>${tel(o.client.phone)}<p style="margin-top:8px">📍 ${esc(o.address)}</p></div>
  <div class="card"><b>🏪 ${t('aStoreL')}</b><p style="margin:4px 0">${esc(o.store)}</p>${tel(o.storePhone)}</div>
  <div class="card"><b>🛵 ${t('aDrvL')}</b><p style="margin-top:4px">${o.driver?esc(o.driverName):'—'}</p></div>
  <div class="card"><b>🧾 ${t('aItemsL')}</b><div style="height:6px"></div>
  ${o.items.map(i=>`<div class="l"><span>${i.qty}× ${esc(i.name)}${i.note?` <small style="color:#e74c3c">💬 ${esc(i.note)}</small>`:''}</span><span>${(i.qty*i.price).toFixed(2)}</span></div>`).join('')}
  <hr style="border:0;border-top:1px solid #e2e8f0;margin:8px 0">
  <div class="l"><span>${t('aSub')}</span><span>${o.subtotal.toFixed(2)}</span></div>${o.discount>0?`<div class="l"><span>${t('aDisc')}</span><span>−${o.discount.toFixed(2)}</span></div>`:''}${o.promoDiscount>0?`<div class="l"><span>${t('aPromo')} ${esc(o.promoCode)}</span><span>−${o.promoDiscount.toFixed(2)}</span></div>`:''}
  <div class="l"><span>${t('aDelF')}</span><span>${o.delivery.toFixed(2)}</span></div><div class="l"><span>${t('aTip')}</span><span>${o.tip.toFixed(2)}</span></div>
  <div class="l" style="font-weight:800"><span>${t('aTot')}</span><span>${o.total.toFixed(2)} TJS</span></div>
  <div class="l"><small>${t('aCommL')} (${o.commissionPct}%)</small><small>${o.commission.toFixed(2)}</small></div></div>
  <div class="card"><b>💳 ${t('aPayL')}: ${esc(t(o.payment))}</b>
  ${cash&&o.status=='delivered'?`<div class="l" style="margin-top:6px"><span>${t('aCashGot')}</span><b>${o.cashCollected==null?'—':o.cashCollected.toFixed(2)+' TJS'}</b></div>${o.cashNote?`<div class="l"><span>${t('aCashNote')}</span><span>${esc(o.cashNote)}</span></div>`:''}<small>${o.cashSettled?'✅ '+t('aSettled'):'⏳ '+t('aNotSet')}</small>`:''}</div>
  <div class="card"><b>⏱ ${t('aTimeL')}</b><div style="height:8px"></div>
  ${ev.length?ev.map((e,i)=>`<div class="tl"><b>${t(KIND[e.kind]||'aeP')}</b><small>${fmt(e.at)}${i?' (+'+dur(Date.parse(e.at)-Date.parse(ev[i-1].at))+')':''}</small></div>`).join('')+(ev.length>1?`<div class="l"><b>${t('aTotalT')}</b><b>${dur(t1-t0)}</b></div>`:''):`<small>${fmt(o.createdAt)}</small>`}</div>
  <div class="card"><b>💬 ${t('aChatL')}</b><div style="height:8px"></div>
  ${o.chat.length?o.chat.map(m=>`<div class="msg ${m.s}"><small>${m.s=='client'?t('aClient'):t('aDrvL')} • ${fmt(m.at)}</small>${TLB.fmtMsg(m.t)}</div>`).join(''):`<small>${t('aNoChat')}</small>`}</div>`}
function vStoreEdit(){const s=TLB.stores(true).find(x=>x.id==E);if(!s){E=null;return vStores()}
const L=ED.lat!=null&&ED.lng!=null,img=ED.cover||s.cover_url,iv=k=>`value="${esc(String(ED[k]==null?'':ED[k]))}"`;
return `<button class="b g" onclick="E=null;render()">← ${t('aBack')}</button>
<div class="card" style="margin-top:12px"><div class="row"><b>✏️ ${t('aEdS')}</b><span class="s ${s.is_active?'approved':'suspended'}">${s.is_active?t('aOn'):t('aOff')}</span></div>
${img?`<img src="${esc(img)}" style="width:100%;height:110px;object-fit:cover;border-radius:8px;margin:8px 0" alt="">`:''}
<label class="b g" style="display:block;text-align:center;margin-bottom:10px;padding:10px">${t('aCoverCh')}<input type="file" accept="image/*" style="display:none" onchange="edCover(event)"></label>
<small>${t('aName')}</small><input ${iv('name')} maxlength="80" oninput="ed('name',this.value)">
<small>${t('aDesc')}</small><input ${iv('description')} maxlength="500" oninput="ed('description',this.value)">
<small>${t('aPh')}</small><input type="tel" ${iv('phone')} maxlength="20" oninput="ed('phone',this.value)">
<small>${t('aCat')}</small><select onchange="ed('category',this.value)">${CATS.map(c=>`<option value="${c}" ${ED.category==c?'selected':''}>${t(c)}</option>`).join('')}</select>
<small>${t('aCom')}</small><input type="number" min="0" max="100" ${iv('commission_pct')} oninput="ed('commission_pct',this.value)">
<small>${t('aDis')}</small><input type="number" min="0" max="100" ${iv('discount_pct')} oninput="ed('discount_pct',this.value)">
<small>${t('aMaxDis')}</small><input type="number" min="0" max="100" ${iv('max_discount_pct')} oninput="ed('max_discount_pct',this.value)">
<small>${t('aFeeT')}</small><select onchange="ed('fee_type',this.value)">${[['fixed','aFix'],['distance','aDist'],['free','aFree']].map(x=>`<option value="${x[0]}" ${ED.fee_type==x[0]?'selected':''}>${t(x[1])}</option>`).join('')}</select>
<label style="display:flex;gap:8px;align-items:center;margin:4px 0 10px;font-size:13px"><input type="checkbox" style="width:auto;margin:0" ${ED.free_first_delivery?'checked':''} onchange="ed('free_first_delivery',this.checked)">${t('aFFD')}</label>
<small>${t('aFeeB')}</small><input type="number" min="0" ${iv('fee_base')} oninput="ed('fee_base',this.value)">
<small>${t('aKm')}</small><input type="number" min="0" ${iv('fee_per_km')} oninput="ed('fee_per_km',this.value)">
<small>${t('aLoc')}</small>
<div class="row" style="margin:4px 0 10px"><span style="font-size:12px">${L?`📍 ${ED.lat}, ${ED.lng}`:t('aLocNone')}</span>${L?`<a class="b g" href="https://www.google.com/maps?q=${+ED.lat},${+ED.lng}" target="_blank" rel="noopener">${t('aMapOpen')}</a>`:''}</div>
<div class="btns" style="margin:0 0 10px"><button class="b o" onclick="edLoc()">${t('aLocSet')}</button>${L?`<button class="b r" onclick="edLocClr()">${t('aLocClr')}</button>`:''}</div>
<button class="b" style="width:100%;padding:13px" onclick="saveStore()">${t('aSv')}</button></div>
<div class="card"><b>${t('aOwn')}</b><small style="display:block;margin:2px 0 8px">${s.owner_id?t('aHasOwn'):t('aNoOwn')}</small>
<input type="email" placeholder="${t('aOwnPh')}" oninput="ed('owner',this.value)"><button class="b g" onclick="edOwner()">${t('aOwnB')}</button></div>
<div class="card"><button class="b ${s.is_active?'r':''}" style="width:100%;padding:12px" onclick="run(TLB.updateStore('${s.id}',{is_active:${!s.is_active}}))">${s.is_active?t('aSus'):t('aAc')}</button></div>`}
function vDrvEdit(){const x=TLB.drivers().find(y=>y.id==DE);if(!x){DE=null;return vDrivers()}
const bal=TLB.cash(x.id),lim=+x.cash_limit||1000,st=x.driver_status||'pending';
return `<button class="b g" onclick="DE=null;render()">← ${t('aBack')}</button>
<div class="card" style="margin-top:12px"><div class="row"><b>🛵 ${t('aEdD')}: ${esc(x.name||x.id.slice(0,8))}</b><span class="s ${st}">${st}</span></div>
<div class="btns"><button class="b" onclick="run(TLB.setDriverStatus('${x.id}','approved'))">${t('aDrvA')}</button><button class="b r" onclick="run(TLB.setDriverStatus('${x.id}','suspended'))">${t('aDrvS')}</button></div></div>
<div class="card"><div class="l"><span>💵 ${t('aCashH')}</span><b>${bal.toFixed(2)} / ${lim} TJS</b></div>
${bal>=lim?`<div class="warn">${t('aOver')}</div>`:''}${x.accept_blocked?`<div class="warn">⛔ ${t('aBlocked')}</div>`:''}
<small style="display:block;margin-top:10px">${t('aLimP')}</small><input type="number" min="1" value="${esc(String(DD.limit))}" oninput="dd('limit',this.value)"><button class="b g" onclick="saveLimit()">${t('aSv')}</button>
<div class="btns"><button class="b ${x.accept_blocked?'':'o'}" onclick="run(TLB.setDriverBlocked('${x.id}',${!x.accept_blocked}))">${x.accept_blocked?t('aAllow'):t('aBlock')}</button>
<button class="b" onclick="settle('${x.id}',${bal})" ${bal>0?'':'disabled style="opacity:.4"'}>${t('aSettle')}</button></div></div>`}
function vStores(){const ss=TLB.stores(true),pend=TLB.pendingItems();
  return `${showAddS?`<div class="card"><div class="row"><b>${t('aAdd')}</b><button class="b g" onclick="showAddS=false;render()">${t('aClose')}</button></div><div style="height:8px"></div>
  <input id="sn" placeholder="${t('aName')}"><input id="ss" placeholder="${t('aDesc')}"><input id="sp" type="tel" placeholder="${t('aPh')}">
  <select id="sc">${CATS.map(c=>`<option value="${c}">${t(c)}</option>`).join('')}</select>
  <input id="sm" type="number" placeholder="${t('aCom')}" value="10">
  <select id="sf"><option value="fixed">${t('aFix')}</option><option value="distance">${t('aDist')}</option><option value="free">${t('aFree')}</option></select>
  <input id="sb" type="number" placeholder="${t('aFeeB')}" value="10"><input id="sk" type="number" placeholder="${t('aKm')}" value="0"><input id="sd" type="number" placeholder="${t('aDis')}" value="0">
  <button class="b" style="width:100%;padding:12px" onclick="addStore()">${t('aSave')}</button></div>`:`<button class="b" style="width:100%;padding:13px;margin-bottom:12px" onclick="showAddS=true;render()">${t('aAddS')}</button>`}

${ss.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="s ${s.is_active?'approved':'suspended'}">${s.is_active?t('aOn'):t('aOff')}</span></div>
${s.cover_url?`<img src="${esc(s.cover_url)}" style="width:100%;height:90px;object-fit:cover;border-radius:8px;margin:8px 0" alt="">`:''}
<small>${t(s.category)} • ${t('aCom')}: ${s.commission_pct}% • ${s.fee_type=='free'?t('aFree'):s.fee_base+' TJS'} • ${s.owner_id?t('aHasOwn'):t('aNoOwn')}</small>
<div class="btns"><button class="b" onclick="openStoreEdit('${s.id}')">✏️ ${t('aEdit')}</button></div></div>`).join('')}

${pend.length?`<h3>${t('aPend')}</h3>${pend.map(i=>`<div class="card row"><div><b>${esc(i.name)}</b><br><small>${esc(i.store)} • ${i.price} TJS</small></div><button class="b" onclick="run(TLB.approveItem('${i.id}'))">${t('aApp')}</button></div>`).join('')}`:''}`}
function vDrivers(){const d=TLB.drivers();
  return d.length?d.map(x=>{const bal=TLB.cash(x.id),lim=+x.cash_limit||1000,over=bal>=lim;
  return `<div class="card"><div class="row"><b>🛵 ${esc(x.name||x.id.slice(0,8))}</b><span class="s ${x.driver_status||'pending'}">${x.driver_status||'pending'}</span></div>
  <div class="l" style="margin-top:8px"><span>💵 ${t('aCashH')}</span><b>${bal.toFixed(2)} / ${lim} TJS</b></div>
  ${over?`<div class="warn">${t('aOver')}</div>`:''}${x.accept_blocked?`<div class="warn">⛔ ${t('aBlocked')}</div>`:''}
  <div class="btns"><button class="b" onclick="openDrvEdit('${x.id}')">✏️ ${t('aEdit')}</button></div></div>`}).join(''):`<div class="card">${t('aNoD')}</div>`}
function bState(b){const n=Date.now();if(!b.is_active)return['suspended',t('aBOffS')];if(b.starts_at&&Date.parse(b.starts_at)>n)return['pending',t('aBSched')+' '+dShow(b.starts_at)];if(b.ends_at&&Date.parse(b.ends_at)<=n)return['rejected',t('aBExp')];return['approved',t('aBNow')]}
function vBanners(){const bs=TLB.banners(true);
  const addF=`<div class="card"><div class="row"><b>${t('aBAdd')}</b><button class="b g" onclick="showAddB=false;render()">${t('aClose')}</button></div><div style="height:8px"></div><input id="bt" placeholder="${t('aBTitle')}">
  <small style="display:block;margin-bottom:6px">${t('aBHint')}</small><label class="b g" style="display:block;text-align:center;margin-bottom:8px;padding:11px">${t('aBImg')}<input type="file" accept="image/*" style="display:none" onchange="pickB(event)"></label>
  <img id="bp" style="display:none;width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px" alt="">
  <button id="blb" class="b g" style="width:100%;margin-bottom:8px;padding:11px;text-align:left" onclick="pickLink(v=>{BL=v;$('blb').textContent='🔗 '+linkLabel(v)})">🔗 ${esc(linkLabel(BL))}</button>
  <small>${t('aBPl')}</small><select id="bpl"><option value="top">${t('aBTop')}</option><option value="bottom">${t('aBBot')}</option></select>
  <small>${t('aBFrom')}</small><input id="bfr" type="date"><small>${t('aBTo')}</small><input id="bto" type="date">
  <small style="display:block;margin-bottom:4px">${t('aBOrd')}</small><input id="bo" type="number" value="0"><button class="b" style="width:100%;padding:12px" onclick="addBanner()">${t('aBAdd')}</button></div>`;
  return `${showAddB?addF:`<button class="b" style="width:100%;padding:13px;margin-bottom:12px" onclick="showAddB=true;render()">${t('aAddB')}</button>`}
  ${bs.length?bs.map(b=>{const cur=b.link_type=='store'?'store:'+b.link_value:b.link_type=='category'?'cat:'+b.link_value:'none',st=bState(b);
  return `<div class="card"><div class="row"><b>${esc(b.title)} <small>#${b.sort}</small></b><span class="s ${st[0]}">${st[1]}</span></div>
  <small>${(b.placement||'top')=='bottom'?t('aBBot'):t('aBTop')}</small>
  ${b.image_url?`<img src="${esc(b.image_url)}" style="width:100%;max-height:110px;object-fit:cover;border-radius:8px;margin:8px 0" alt="">`:''}
  <button class="b g" style="width:100%;margin-bottom:8px;padding:10px;text-align:left" onclick="pickLink(v=>bannerLink('${b.id}',v))">🔗 ${esc(linkLabel(cur))}</button>
  <small>${t('aBPl')}</small><select onchange="bannerPlace('${b.id}',this.value)"><option value="top" ${(b.placement||'top')=='top'?'selected':''}>${t('aBTop')}</option><option value="bottom" ${b.placement=='bottom'?'selected':''}>${t('aBBot')}</option></select>
  <small>${t('aBFrom')}</small><input type="date" value="${dShow(b.starts_at)}" onchange="bannerDate('${b.id}','starts_at',this.value)"><small>${t('aBTo')}</small><input type="date" value="${dShow(b.ends_at)}" onchange="bannerDate('${b.id}','ends_at',this.value)">
  <div class="btns"><label class="b g" style="margin:0">📷 ${t('aImgB')}<input type="file" accept="image/*" style="display:none" onchange="bannerImg(event,'${b.id}')"></label>
  <button class="b o" onclick="bannerTitle('${b.id}',${JSON.stringify(b.title).replace(/"/g,'&quot;')})">✏️ ${t('aTitleB')}</button><button class="b o" onclick="bannerOrder('${b.id}',${b.sort})">#</button>
  <button class="b ${b.is_active?'r':''}" onclick="run(TLB.updateBanner('${b.id}',{is_active:${!b.is_active}}))">${b.is_active?t('aSus'):t('aAc')}</button>
  <button class="b g" onclick="if(confirm('?'))run(TLB.deleteBanner('${b.id}'))">${t('aRm')}</button></div></div>`}).join(''):`<div class="card">${t('aBNo')}</div>`}`}
function addPromo(){const code=v('pcode').toUpperCase(),kind=$('pkind').value,val=+v('pval'),mn=+v('pmin')||0,mx=v('pmax')===''?null:+v('pmax');
TLB.addPromo({code,kind,value:val,min_order:mn,max_uses:mx,starts_at:dIso($('pfr').value,false),ends_at:dIso($('pto').value,true)}).then(r=>{if(r&&r.error&&!r.toasted)alert(t('err_'+r.error));if(!(r&&r.error)){showAddP=false;render()}})}
function promoUsed(code){return TLB.orders().filter(o=>o.promoCode==code&&o.status!='rejected'&&o.status!='cancelled').length}
function vPromos(){const ps=TLB.promos(),n=Date.now();
const addF=`<div class="card"><div class="row"><b>${t('aAddP')}</b><button class="b g" onclick="showAddP=false;render()">${t('aClose')}</button></div><div style="height:8px"></div>
<small>${t('aPCode')}</small><input id="pcode" maxlength="20" autocapitalize="characters" style="text-transform:uppercase">
<small>${t('aPKind')}</small><select id="pkind"><option value="percent">${t('aPPct')}</option><option value="fixed">${t('aPFix')}</option></select>
<small>${t('aPVal')}</small><input id="pval" type="number" min="0" step="0.01">
<small>${t('aPMin')}</small><input id="pmin" type="number" min="0" value="0">
<small>${t('aPMax')}</small><input id="pmax" type="number" min="1">
<small>${t('aBFrom')}</small><input id="pfr" type="date"><small>${t('aBTo')}</small><input id="pto" type="date">
<small style="display:block;margin-bottom:8px">${t('aPNote')}</small><button class="b" style="width:100%;padding:12px" onclick="addPromo()">${t('aAddP')}</button></div>`;
return `${showAddP?addF:`<button class="b" style="width:100%;padding:13px;margin-bottom:12px" onclick="showAddP=true;render()">${t('aAddP')}</button>`}
${ps.length?ps.map(p=>{const used=promoUsed(String(p.code).toUpperCase()),st=!p.is_active?['suspended',t('aBOffS')]:(p.starts_at&&Date.parse(p.starts_at)>n)?['pending',t('aBSched')+' '+dShow(p.starts_at)]:(p.ends_at&&Date.parse(p.ends_at)<=n)?['rejected',t('aBExp')]:(p.max_uses&&used>=p.max_uses)?['rejected',t('aBExp')]:['approved',t('aBNow')];
return `<div class="card"><div class="row"><b style="letter-spacing:1px">${esc(p.code)}</b><span class="s ${st[0]}">${st[1]}</span></div>
<small>${p.kind=='percent'?(+p.value)+'%':(+p.value)+' TJS'} • ${t('aPMin')}: ${+p.min_order} • ${t('aPUsed')}: ${used}${p.max_uses?' / '+p.max_uses:''}${p.starts_at||p.ends_at?` • ${dShow(p.starts_at)||'…'} → ${dShow(p.ends_at)||'…'}`:''}</small>
<div class="btns"><button class="b ${p.is_active?'r':''}" onclick="run(TLB.updatePromo('${p.id}',{is_active:${!p.is_active}}))">${p.is_active?t('aSus'):t('aAc')}</button>
<button class="b g" onclick="if(confirm('?'))run(TLB.deletePromo('${p.id}'))">${t('aRm')}</button></div></div>`}).join(''):`<div class="card">${t('aPNo')}</div>`}`}
function alerts(){const ov=TLB.drivers().filter(x=>TLB.cash(x.id)>=(+x.cash_limit||1000));if(!ov.length)return'';
return `<div class="card" style="border-color:#fca5a5;background:#fff5f5"><b style="color:#b91c1c">${t('aOver')}: ${ov.length}</b>${ov.map(x=>{const bal=TLB.cash(x.id),lim=+x.cash_limit||1000;return `<div class="row" style="margin-top:8px"><span>🛵 ${esc(x.name||x.id.slice(0,8))} <small>${bal.toFixed(2)} / ${lim} TJS</small></span>${x.accept_blocked?`<span class="s suspended">⛔ ${t('aBlocked')}</span>`:`<button class="b o" onclick="run(TLB.setDriverBlocked('${x.id}',true))">${t('aBlock')}</button>`}</div>`}).join('')}<button class="b g" style="margin-top:10px" onclick="tab='d';D=null;E=null;DE=null;render()">${t('tD')} →</button></div>`}
function render(){
  const all=TLB.orders(),del=all.filter(o=>o.status=='delivered'),act=all.filter(o=>['pending','preparing','ready','pickedup'].includes(o.status));
  const body=D&&tab=='o'?vDetail():tab=='s'&&E?vStoreEdit():tab=='d'&&DE?vDrvEdit():({o:vOrders,s:vStores,d:vDrivers,b:vBanners,c:vPromos}[tab])();
  const ovN=TLB.drivers().filter(x=>TLB.cash(x.id)>=(+x.cash_limit||1000)).length;
$('app').innerHTML=`<div class="top"><b style="font-size:17px">👑 ${t('aT')}</b><br><small style="color:#a0aec0">${t('aNote')}</small></div>
  ${alerts()}<div class="grid"><div class="k"><b>${all.length}</b><span>${t('aOrd')}</span></div><div class="k"><b>${del.reduce((s,o)=>s+o.total,0)} TJS</b><span>${t('aRev')}</span></div>
  <div class="k"><b>${del.reduce((s,o)=>s+o.commission,0).toFixed(1)} TJS</b><span>${t('aComm')}</span></div><div class="k"><b>${act.length}</b><span>${t('aAct')}</span></div></div>
  <div class="tabs">${[['o','tO'],['s','tS'],['d','tD'],['b','tB'],['c','tP']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';D=null;E=null;DE=null;render()">${t(x[1])}${x[0]=='d'&&ovN?' ⚠️':''}</button>`).join('')}</div>`+body}
TLB.start('admin',()=>{TLB.on(()=>{const a=document.activeElement;if(a&&/^(INPUT|SELECT)$/.test(a.tagName)&&$('app').contains(a))return;render()});render()});
</script></body></html>
