    ${CU.wal&&CU.wal.entries.length?`<small style="display:block;margin:12px 0 4px;font-weight:700">${t('xWalHist')}</small>${CU.wal.entries.slice(0,8).map(e=>`<div class="row" style="padding:6px 0;border-top:1px solid #eeeef1"><span style="min-width:0"><small style="display:block">${t('wk_'+e.kind)}${e.orderId?' #'+e.orderId:''}${e.ticketId&&!e.orderId?' · #'+e.ticketId:''}</small>${e.note?`<small style="color:#8b8f98">${esc(e.note)}</small>`:''}<small style="display:block;color:#8b8f98">${fmt(e.at)}</small></span><b style="color:${e.amount>0?'#1fa05a':'#d92d20'}">${e.amount>0?'+':'\u2212'}${Math.abs(e.amount)}</b></div>`).join('')}`:(CU.wal?`<small style="display:block;margin-top:10px;color:#8b8f98">${t('xWalNone')}</small>`:'')}</div>

  return `<div class="row" style="gap:8px;margin-bottom:12px"><input id="cuq" placeholder="${t('xCuSearch')}" value="${esc(CU.q)}" oninput="CU.q=this.value" onkeydown="if(event.key=='Enter')cuLoad(true)" style="margin:0;flex:1"><button class="b" style="flex-shrink:0" onclick="cuLoad(true)">${t('xFind')}</button></div>
  ${CU.rows.length?CU.rows.map(x=>`<div class="card" style="cursor:pointer;${x.banned_at?'border-left:5px solid #ef4444':''}" onclick="cuOpen('${x.id}')"><div class="row"><b>${esc(x.name||'—')}</b>${x.banned_at?`<span class="s suspended">${t('xBanned')}</span>`:`<small>${x.orders_count} ${t('xCuOrders').toLowerCase()} · ${money(x.total_spent)} TJS</small>`}</div><div class="row" style="margin-top:4px"><small>${esc(x.phone||'—')}</small><small>${fmt(Date.parse(x.created_at))}</small></div></div>`).join(''):(CU.busy?'<div class="card empty">…</div>':emptyA(t('xCuNone')))}
  ${CU.rows.length&&!CU.end?`<button class="b g" style="width:100%;margin:6px 0 14px;padding:12px" onclick="cuLoad(false)">${t('xMore')}</button>`:''}`}
/* ---------- NEW RESTAURANT REQUESTS ---------- */
const SRCAT=c=>t(c);
function srqCard(){const all=TLB.storeRequests(),pend=all.filter(q=>q.status=='pending'),done=all.filter(q=>q.status!='pending').slice(0,3);
  if(!all.length)return '';
  const row=q=>{const p=TLB.person(q.user_id);return `<div class="card" style="background:#fffaf0;border:1px solid #f5d9a8"><div class="row"><b>${esc(q.name)}</b><small>${SRCAT(q.category)}</small></div>
  <div class="row" style="margin-top:6px"><span>${t('xOwner')}: <b>${esc(p.name||'—')}</b></span>${p.phone?tel(p.phone):''}</div>
  <div class="row" style="margin-top:6px">${tel(q.phone)}${q.lat!=null&&q.lng!=null?mapL(q.lat,q.lng):''}</div>
  ${q.address?`<small style="display:block;margin-top:4px">${esc(q.address)}</small>`:''}${q.note?`<div class="qt" style="margin-top:8px">${esc(q.note)}</div>`:''}
  <input id="srn-${q.id}" maxlength="300" placeholder="${t('xRejectNote')}" value="${esc(SRN[q.id]||'')}" oninput="SRN['${q.id}']=this.value" style="margin-top:8px">
  <div class="btns"><button class="b" onclick="srqDecide('${q.id}',true)">✓ ${t('xApprove')}</button><button class="b r" onclick="srqDecide('${q.id}',false)">${t('xReject')}</button></div></div>`};
  return `<div class="al amber"><div class="alh"><span>🏪 ${t('xSrqT')}</span><b>${pend.length}</b></div>${pend.length?pend.map(row).join(''):`<small>${t('xSrqNone')}</small>`}${done.length?`<div style="margin-top:8px">${done.map(q=>`<small style="display:block;margin-top:4px">${q.status=='approved'?'✅':'❌'} ${esc(q.name)}${q.admin_note?' — '+esc(q.admin_note):''}</small>`).join('')}</div>`:''}</div>`}
async function srqDecide(id,ok){const r=await TLB.decideStoreRequest(id,ok,SRN[id]||'');if(r&&r.error){alert(t('err_'+r.error));return}delete SRN[id];if(ok)alert(t('xSrqOk'));render()}
const stampH=()=>`<div class="xs" style="text-align:center;color:#8b8f98;margin:18px 0 6px">${t('verL')||'v'} ${esc(TLB.version||'')} · admin-50</div>`;
function pgVal(s,l){const k=s+'_'+l;if(PGE[k]!=null)return PGE[k];const p=TLB.pages()[s];return p?p[l]:''}
function pgSet(s,l,v){PGE[s+'_'+l]=v}
async function pgSave(){for(const s of ['about','privacy'])for(const l of ['ru','en']){const k=s+'_'+l;if(PGE[k]==null)continue;const r=await TLB.setPage(s,l,PGE[k]);if(r&&r.error&&!r.toasted){alert(t('err_'+r.error));return}}PGE={};alert(t('xTxOk'));render()}
function vTexts(){const loaded=Object.keys(TLB.pages()).length>0,blk=(s,tl)=>`<div class="card"><b>${t(tl)}</b>${['ru','en'].map(l=>`<small style="display:block;margin:10px 0 4px">${t(l=='ru'?'xTxRu':'xTxEn')}</small><textarea id="pgt_${s}_${l}" maxlength="20000" oninput="pgSet('${s}','${l}',this.value)" style="width:100%;min-height:150px;border:1.5px solid #eeeef1;border-radius:12px;padding:10px;font:inherit;font-size:16px;box-sizing:border-box">${esc(pgVal(s,l))}</textarea>`).join('')}</div>`;
  return `<div class="card"><b>${t('xTxT')}</b><small style="display:block;margin-top:6px;line-height:1.45">${t('xTxS')}</small></div>${loaded?blk('about','xTxAbout')+blk('privacy','xTxPriv')+`<button class="b" style="width:100%;padding:12px" onclick="pgSave()">${t('xTxSave')}</button>`:`<div class="card empty">…</div>`}`}
function noCourier(){const l=TLB.orders(o=>!o.driver&&(o.status=='preparing'||o.status=='ready')&&Date.now()-o.createdAt>90000);if(!l.length)return '';
  return `<div class="al amber"><div class="alh"><span>🛵 ${t('aNoCourier')}</span><b>${l.length}</b></div>${l.map(o=>{const of=TLB.allOffers().filter(f=>f.order_id==o.id),bc=of.some(f=>f.mode=='broadcast');return `<div class="row" style="margin-top:10px;gap:8px"><span style="min-width:0"><b>#${o.id}</b> ${esc(o.store)}<small style="display:block">${Math.floor((Date.now()-o.createdAt)/60000)} ${t('aMin')} · ${of.length} ${t('aOffered')}${bc?' · '+t('aBroad'):''}</small></span><button class="b" onclick="ASG=${o.id};render()">${t('aAssign')}</button></div>`}).join('')}</div>`}
function assignModal(){if(!ASG)return '';const o=TLB.order(ASG);if(!o){ASG=null;return ''}const st=TLB.stores(true).find(s=>s.name==o.store)||{};
  const cs=TLB.drivers().filter(x=>x.driver_status=='approved'&&isLive(x)&&!busyOf(x)).map(x=>({x,d:st.lat!=null&&locFresh(x)?km(+st.lat,+st.lng,+x.lat,+x.lng):null})).sort((p,q)=>(p.d==null)-(q.d==null)||p.d-q.d);
  return `<div class="ovl" onclick="ASG=null;render()"><div class="mdl" onclick="event.stopPropagation()"><div class="row" style="margin-bottom:10px"><b>${t('aPickC')} · #${o.id}</b><button class="b g" onclick="ASG=null;render()">${t('aClose2')}</button></div>
  ${cs.length?cs.map(({x,d})=>`<div class="lr"><span class="dt free"></span><span style="flex:1"><b>${esc(x.name||x.id.slice(0,8))}</b><small style="display:block">${d==null?t('aNoLoc'):d.toFixed(1)+' '+t('aKmAway')}</small></span><button class="b" onclick="doAssign(${o.id},'${x.id}')">${t('aAssign')}</button></div>`).join(''):`<div class="lr"><small>${t('aNoOnlineC')}</small></div>`}</div></div>`}
async function doAssign(oid,did){const r=await TLB.assignDriver(oid,did);if(r&&r.error){alert(t('err_'+r.error));return}ASG=null;render()}
function mapModal(){if(!MAPO)return '';return `<div class="ovl" style="align-items:stretch"><div class="mdl" style="max-width:none;width:100%;border-radius:0;display:flex;flex-direction:column;height:100%;padding:12px"><div class="row" style="margin-bottom:8px"><b>${t('aMapT')}</b><button class="b g" onclick="MAPO=false;render()">${t('aClose2')}</button></div><small style="margin-bottom:8px">${t('aLegend')}</small><div id="adm-map" style="flex:1;min-height:300px;border-radius:14px"></div></div></div>`}
function openMap(){MAPO=true;render();const pts=[];TLB.drivers().filter(x=>isLive(x)&&locFresh(x)).forEach(x=>pts.push({lat:x.lat,lng:x.lng,kind:'driver',busy:busyOf(x),label:x.name||x.id.slice(0,6)}));TLB.stores(true).filter(s=>s.is_active&&s.lat!=null).forEach(s=>pts.push({lat:s.lat,lng:s.lng,kind:'store',open:s.is_open,label:s.name}));TLB.mapView('adm-map',pts)}
function alerts(){const ov=TLB.drivers().filter(x=>TLB.cash(x.id)>=(+x.cash_limit||1000));if(!ov.length)return lowAlert()+noCourier();
return lowAlert()+noCourier()+`<div class="al red"><div class="alh"><span>💵 ${t('aOver')}</span><b>${ov.length}</b></div>${ov.map(x=>{const bal=TLB.cash(x.id),lim=+x.cash_limit||1000;return `<div class="row" style="margin-top:8px"><span>🛵 ${esc(x.name||x.id.slice(0,8))} <small>${bal.toFixed(2)} / ${lim} TJS</small></span>${x.accept_blocked?`<span class="s suspended">⛔ ${t('aBlocked')}</span>`:`<button class="b o" onclick="run(TLB.setDriverBlocked('${x.id}',true))">${t('aBlock')}</button>`}</div>`}).join('')}<button class="b g" style="margin-top:10px" onclick="tab='d';D=null;E=null;DE=null;render()">${t('tD')} →</button></div>`}
function render0(){if(!tabOk(tab)){const k=TABS.find(x=>tabOk(x[0]));if(k)tab=k[0]}

  const ae=document.activeElement,kid=ae&&/^(dq|sq|resn|cuq|tka|tkn|tkr|cur|supph|suphrs|ownem|cuwa|cuwn|cuph|cuphr|pgt_\w+)$/.test(ae.id)?ae.id:null,keep=kid?ae.value:null;
  const all=TLB.orders(),del=all.filter(o=>o.status=='delivered'),act=all.filter(o=>['pending','preparing','ready','pickedup'].includes(o.status));
  const body=D&&tab=='o'?vDetail():tab=='s'&&E?vStoreEdit():tab=='d'&&DE?vDrvEdit():tab=='b'&&BE?vBannerEdit():({o:vOrders,s:vStores,d:vDrivers,b:vBanners,c:vPromos,y:vLoyalty,r:vRatings,l:vLog,h:vSupportA,u:vCustomers,g:vTexts,f:vStaff}[tab])()+stampH();
  const ovN=TLB.drivers().filter(x=>TLB.cash(x.id)>=(+x.cash_limit||1000)).length,lowN=TLB.lowRatings(2).length;
  if(lastLow>=0&&lowN>lastLow){try{TLB.beep()}catch(e){}}lastLow=lowN;
  const tkN0=TLB.adminTickets().filter(needsReply).length;if(lastTk>=0&&tkN0>lastTk){try{TLB.beep()}catch(e){}}lastTk=tkN0;
  const tkBar=tkN0>0&&tab!='h'?`<button class="b" style="position:sticky;top:6px;z-index:30;width:100%;margin-bottom:10px;padding:12px;background:#d92d20;box-shadow:0 4px 14px #d92d2055" onclick="tab='h';TK.sel=null;D=null;E=null;DE=null;BE=null;render();scrollTo(0,0)">💬 ${t('aTkWait').replace('{n}',tkN0)}</button>`:'';
  const kp=(ic,v,l)=>`<div class="k"><i>${ic}</i><b>${v}</b><span>${l}</span></div>`;
  const tkN=TLB.adminTickets().filter(needsReply).length,srN=TLB.storeRequests().filter(q=>q.status=='pending').length,badge=x=>x=='d'&&ovN?`<em>${ovN}</em>`:x=='r'&&lowN?`<em>${lowN}</em>`:x=='h'&&tkN?`<em>${tkN}</em>`:x=='s'&&srN?`<em>${srN}</em>`:'';
  $('app').innerHTML=`<div class="top"><div class="tph"><div><div class="tpt">${t('aT')}</div></div></div>${livePills()}</div>
  ${tkBar}${alerts()}${tab=='o'&&!D?`<div class="grid">${kp('📦',all.length,t('aKOrd'))}${kp('💰',del.reduce((s,o)=>s+o.total,0)+' TJS',t('aKRev'))}${kp('%',del.reduce((s,o)=>s+o.commission,0).toFixed(1)+' TJS',t('aKCom'))}${kp('⏱',act.length,t('aKAct'))}</div>`:''}
  <div class="tabs">${TABS.filter(x=>tabOk(x[0])).map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';D=null;E=null;DE=null;BE=null;pgN=50;TK.sel=null;CU.sel=null;if(tab=='l'){AUD=null;ERR=null}if(tab=='f')STF.list=null;if(tab=='u'&&!CU.loaded)cuLoad(true);if(tab=='g'){PGE={};TLB.loadPages(true)}render()">${t(x[1])}${badge(x[0])}</button>`).join('')}</div>`+body+assignModal()+mapModal()+resModal();
  if(kid&&$(kid)){const e=$(kid);e.value=keep;e.focus();try{e.setSelectionRange(keep.length,keep.length)}catch(x){}}}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
setInterval(()=>{if(Date.now()-lastAct>30*60*1000){alert(t('aIdle'));TLB.logout()}},60000);
TLB.start('admin',()=>{TLB.on(()=>{if(MAPO||RES&&document.activeElement&&document.activeElement.id=='resn')return;const a=document.activeElement;if(a&&/^(INPUT|SELECT)$/.test(a.tagName)&&$('app').contains(a)&&!/^(dq|sq|resn|cuq|tka|tkn|tkr|cur|supph|suphrs|ownem|cuwa|cuwn|cuph|cuphr|pgt_\w+)$/.test(a.id))return;render()});render()});

function render(){const a=document.activeElement,ok=a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!='file',all=ok?[...document.querySelectorAll('input,textarea')]:[],ix=all.indexOf(a),id=ok&&a.id,ss=ok&&a.selectionStart,se=ok&&a.selectionEnd,y=window.scrollY;
  render0();
  if(ok){let e=id?document.getElementById(id):null;if(!e||e===a){const n=[...document.querySelectorAll('input,textarea')];e=n[ix]}if(e&&e!==a){try{e.focus({preventScroll:true});if(ss!=null&&e.setSelectionRange)e.setSelectionRange(ss,se)}catch(_){}}}
  window.scrollTo(0,y)}
