  ${compact?'':`<div class="rst ${r.handled_at?'ok':'warnr'}">${r.handled_at?`✅ ${t('aHandled')} · ${fmt(Date.parse(r.handled_at))}${r.handled_note?` — ${esc(r.handled_note)}`:''}`:`⚠️ ${t('aNeeds')}`}</div>`}
  <div class="btns">${r.handled_at?`<button class="b g" onclick="run(TLB.reopenRating(${r.order_id}))">${t('aReopen')}</button>`:`<button class="b" onclick="RES={o:${r.order_id},n:''};render()">✓ ${t('aResolve')}</button>`}${o?`<button class="b g" onclick="D=${r.order_id};tab='o';render();scrollTo(0,0)">${t('aOpenO')} #${r.order_id}</button>`:''}</div></div>`}
function resModal(){if(!RES)return '';return `<div class="ovl" onclick="RES=null;render()"><div class="mdl" onclick="event.stopPropagation()"><div class="row" style="margin-bottom:10px"><b>${t('aResolveT')} · #${RES.o}</b><button class="b g" onclick="RES=null;render()">${t('aClose2')}</button></div><div class="alhelp" style="margin-bottom:10px">${t('aResHelp')}</div><small>${t('aResNote')}</small><input id="resn" maxlength="300" value="${esc(RES.n)}" oninput="RES.n=this.value" style="margin-top:6px"><button class="b" style="width:100%;padding:12px" onclick="saveRes()">${t('aResSave')}</button></div></div>`}
async function saveRes(){const r=await TLB.resolveRating(RES.o,RES.n);if(r&&r.error){alert(t('err_'+r.error));return}RES=null;render()}
function vRatings(){const R=TLB.ratings(),need=TLB.lowRatings(2),hand=R.filter(r=>r.handled_at),sa=avg(R,'store_stars'),da=avg(R,'driver_stars');
  const L=rfl=='need'?R.filter(r=>lowOf(r,3)&&!r.handled_at):rfl=='done'?hand:R;
  const ch=(k,l,c)=>`<button class="chip ${rfl==k?'on':''}" onclick="rfl='${k}';render()">${l} · ${c}</button>`;
  return `<div class="grid"><div class="k"><b>${da?da.a.toFixed(1)+' ★':'—'}</b><span>${t('aRAvgD')} · ${da?da.n:0} ${t('aRCnt')}</span></div><div class="k"><b>${sa?sa.a.toFixed(1)+' ★':'—'}</b><span>${t('aRAvgS')} · ${sa?sa.n:0} ${t('aRCnt')}</span></div><div class="k ${need.length?'kred':''}"><b>${need.length}</b><span>${t('aRNeeds')}</span></div><div class="k"><b>${R.length}</b><span>${t('aRCnt')}</span></div></div>
  <div class="chips">${ch('need',t('aRNeeds'),R.filter(r=>lowOf(r,3)&&!r.handled_at).length)}${ch('all',t('fAllK'),R.length)}${ch('done',t('aRDone'),hand.length)}</div>
  ${L.length?L.map(r=>ratingBlock(r,false)).join(''):`<div class="card empty">${t('aNoRates')}</div>`}`}
function lowAlert(){const l=TLB.lowRatings(2);if(!l.length)return '';
  return `<div class="al red"><div class="alh"><span>⭐ ${t('aLowRate')}</span><b>${l.length}</b></div><div class="alhelp">${t('aLowHelp')}</div>${l.slice(0,5).map(r=>{const o=TLB.order(r.order_id),dv=TLB.drivers().find(x=>x.id==r.driver_id),cp=cmtParts(r.comment),dl=r.driver_stars!=null&&r.driver_stars<=2;
  return `<div class="alr2"><div class="alr2h"><b>#${r.order_id}</b><span class="alwho">${dl?'🛵 '+t('aWhoC')+(dv?' · '+esc(dv.name||''):''):'🏪 '+t('aWhoS')}</span>${starsRow(dl?r.driver_stars:r.store_stars)}</div>${cp.tags.length||cp.text?`<div class="alsm">${cp.tags.length?esc(cp.tags.join(' · '))+(cp.text?' — ':''):''}${esc(cp.text).slice(0,120)}</div>`:''}${o?`<div class="alsm">👤 ${esc(o.client.name||'—')}${o.client.phone?' · '+esc(o.client.phone):''}</div>`:''}
  <div class="alb2">${o&&o.client.phone?`<a class="b" href="tel:${esc(o.client.phone)}">📞 ${t('aCall')}</a>`:''}<button class="b g" onclick="tab='r';rfl='need';render();scrollTo(0,0)">${t('aOpenO')}</button><button class="b o" onclick="RES={o:${r.order_id},n:''};render()">✓ ${t('aResolve')}</button></div></div>`}).join('')}${l.length>5?`<button class="b g" style="margin-top:8px" onclick="tab='r';rfl='need';render();scrollTo(0,0)">+${l.length-5} →</button>`:''}</div>`}
function noCourier(){const l=TLB.orders(o=>!o.driver&&(o.status=='preparing'||o.status=='ready')&&Date.now()-o.createdAt>90000);if(!l.length)return '';
  return `<div class="al amber"><div class="alh"><span>🛵 ${t('aNoCourier')}</span><b>${l.length}</b></div>${l.map(o=>{const of=TLB.allOffers().filter(f=>f.order_id==o.id),bc=of.some(f=>f.mode=='broadcast');return `<div class="row" style="margin-top:10px;gap:8px"><span style="min-width:0"><b>#${o.id}</b> ${esc(o.store)}<small style="display:block">${Math.floor((Date.now()-o.createdAt)/60000)} ${t('aMin')} · ${of.length} ${t('aOffered')}${bc?' · '+t('aBroad'):''}</small></span><button class="b" onclick="ASG=${o.id};render()">${t('aAssign')}</button></div>`}).join('')}</div>`}
function assignModal(){if(!ASG)return '';const o=TLB.order(ASG);if(!o){ASG=null;return ''}const st=TLB.stores(true).find(s=>s.name==o.store)||{};
  const cs=TLB.drivers().filter(x=>x.driver_status=='approved'&&isLive(x)&&!busyOf(x)).map(x=>({x,d:st.lat!=null&&locFresh(x)?km(+st.lat,+st.lng,+x.lat,+x.lng):null})).sort((p,q)=>(p.d==null)-(q.d==null)||p.d-q.d);
  return `<div class="ovl" onclick="ASG=null;render()"><div class="mdl" onclick="event.stopPropagation()"><div class="row" style="margin-bottom:10px"><b>${t('aPickC')} · #${o.id}</b><button class="b g" onclick="ASG=null;render()">${t('aClose2')}</button></div>
  ${cs.length?cs.map(({x,d})=>`<div class="lr"><span class="dt free"></span><span style="flex:1"><b>${esc(x.name||x.id.slice(0,8))}</b><small style="display:block">${d==null?t('aNoLoc'):d.toFixed(1)+' '+t('aKmAway')}</small></span><button class="b" onclick="doAssign(${o.id},'${x.id}')">${t('aAssign')}</button></div>`).join(''):`<div class="lr"><small>${t('aNoOnlineC')}</small></div>`}</div></div>`}
async function doAssign(oid,did){const r=await TLB.assignDriver(oid,did);if(r&&r.error){alert(t('err_'+r.error));return}ASG=null;render()}
function mapModal(){if(!MAPO)return '';return `<div class="ovl" style="align-items:stretch"><div class="mdl" style="max-width:none;width:100%;border-radius:0;display:flex;flex-direction:column;height:100%;padding:12px"><div class="row" style="margin-bottom:8px"><b>${t('aMapT')}</b><button class="b g" onclick="MAPO=false;render()">${t('aClose2')}</button></div><small style="margin-bottom:8px">${t('aLegend')}</small><div id="adm-map" style="flex:1;min-height:300px;border-radius:14px"></div></div></div>`}
function openMap(){MAPO=true;render();const pts=[];TLB.drivers().filter(x=>isLive(x)&&locFresh(x)).forEach(x=>pts.push({lat:x.lat,lng:x.lng,kind:'driver',busy:busyOf(x),label:x.name||x.id.slice(0,6)}));TLB.stores(true).filter(s=>s.is_active&&s.lat!=null).forEach(s=>pts.push({lat:s.lat,lng:s.lng,kind:'store',open:s.is_open,label:s.name}));TLB.mapView('adm-map',pts)}
function alerts(){const ov=TLB.drivers().filter(x=>TLB.cash(x.id)>=(+x.cash_limit||1000));if(!ov.length)return lowAlert()+noCourier();
return lowAlert()+noCourier()+`<div class="al red"><div class="alh"><span>💵 ${t('aOver')}</span><b>${ov.length}</b></div>${ov.map(x=>{const bal=TLB.cash(x.id),lim=+x.cash_limit||1000;return `<div class="row" style="margin-top:8px"><span>🛵 ${esc(x.name||x.id.slice(0,8))} <small>${bal.toFixed(2)} / ${lim} TJS</small></span>${x.accept_blocked?`<span class="s suspended">⛔ ${t('aBlocked')}</span>`:`<button class="b o" onclick="run(TLB.setDriverBlocked('${x.id}',true))">${t('aBlock')}</button>`}</div>`}).join('')}<button class="b g" style="margin-top:10px" onclick="tab='d';D=null;E=null;DE=null;render()">${t('tD')} →</button></div>`}
function render(){
  const ae=document.activeElement,kid=ae&&/^(dq|sq|resn)$/.test(ae.id)?ae.id:null,keep=kid?ae.value:null;
  const all=TLB.orders(),del=all.filter(o=>o.status=='delivered'),act=all.filter(o=>['pending','preparing','ready','pickedup'].includes(o.status));
  const body=D&&tab=='o'?vDetail():tab=='s'&&E?vStoreEdit():tab=='d'&&DE?vDrvEdit():tab=='b'&&BE?vBannerEdit():({o:vOrders,s:vStores,d:vDrivers,b:vBanners,c:vPromos,r:vRatings}[tab])();
  const ovN=TLB.drivers().filter(x=>TLB.cash(x.id)>=(+x.cash_limit||1000)).length,lowN=TLB.lowRatings(2).length;
  if(lastLow>=0&&lowN>lastLow){try{TLB.beep()}catch(e){}}lastLow=lowN;
  const kp=(ic,v,l)=>`<div class="k"><i>${ic}</i><b>${v}</b><span>${l}</span></div>`;
  const badge=x=>x=='d'&&ovN?`<em>${ovN}</em>`:x=='r'&&lowN?`<em>${lowN}</em>`:'';
  $('app').innerHTML=`<div class="top"><div class="tph"><div><div class="tpt">${t('aT')}</div><div class="tps">${t('aNote')} · ${esc(TLB.version||'')}</div></div></div>${livePills()}</div>
  ${alerts()}<div class="grid">${kp('📦',all.length,t('aKOrd'))}${kp('💰',del.reduce((s,o)=>s+o.total,0)+' TJS',t('aKRev'))}${kp('%',del.reduce((s,o)=>s+o.commission,0).toFixed(1)+' TJS',t('aKCom'))}${kp('⏱',act.length,t('aKAct'))}</div>
  <div class="tabs">${[['o','tO'],['s','tS'],['d','tD'],['r','tR'],['b','tB'],['c','tP']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';D=null;E=null;DE=null;BE=null;render()">${t(x[1])}${badge(x[0])}</button>`).join('')}</div>`+body+assignModal()+mapModal()+resModal();
  if(kid&&$(kid)){const e=$(kid);e.value=keep;e.focus();try{e.setSelectionRange(keep.length,keep.length)}catch(x){}}}
TLB.start('admin',()=>{TLB.on(()=>{if(MAPO||RES&&document.activeElement&&document.activeElement.id=='resn')return;const a=document.activeElement;if(a&&/^(INPUT|SELECT)$/.test(a.tagName)&&$('app').contains(a)&&!/^(dq|sq|resn)$/.test(a.id))return;render()});render()});
</script></body></html>
